<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT MIDTERM MASTER — الشرح الكامل لمادة Internet of Things</title>
<meta name="description" content="دليل مذاكرة كامل أوفلاين لمادة Internet of Things — د. نيرة صادق — Chapters 0–3">
<style>
:root{--bg:#0a1020;--bg2:#0e1730;--card:#131f3b;--card2:#17264a;--line:#26385f;--text:#e7eefb;--muted:#a2b3d3;--cyan:#22d3ee;--cyan2:#0e7490;--violet:#a78bfa;--violet2:#6d28d9;--warn:#fbbf24;--bad:#f87171;--good:#34d399;--code:#0b1429;--shadow:0 6px 24px rgba(0,0,0,.35);--hdr:56px;--fs:17px}
[data-theme=light]{--bg:#f4f7fc;--bg2:#e9eff9;--card:#ffffff;--card2:#f1f5fc;--line:#cbd7ea;--text:#0f1a33;--muted:#4a5b7e;--cyan:#0369a1;--cyan2:#7dd3fc;--violet:#6d28d9;--violet2:#ddd6fe;--warn:#92400e;--bad:#b91c1c;--good:#047857;--code:#eaf0fb;--shadow:0 4px 16px rgba(20,40,90,.12)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 14px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.9 "Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,system-ui,-apple-system,Arial,sans-serif;overflow-x:hidden;min-width:320px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 85% -10%,rgba(34,211,238,.10),transparent 60%),radial-gradient(800px 500px at 0% 20%,rgba(167,139,250,.10),transparent 60%)}
a{color:var(--cyan)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}
.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
code,.mono{font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;direction:ltr;unicode-bidi:isolate;background:var(--code);border:1px solid var(--line);padding:0 .35em;border-radius:6px;font-size:.88em;display:inline-block;line-height:1.6}
/* header */
#hdr{position:sticky;top:0;z-index:50;height:var(--hdr);display:flex;align-items:center;gap:8px;padding:0 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#hdr .brand{font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-size:1rem}
#hdr .brand svg{flex:none}
.ibtn{background:var(--card);border:1px solid var(--line);color:var(--text);min-width:40px;height:40px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;gap:6px}
.ibtn:hover{border-color:var(--cyan)}
#sq{flex:1;min-width:0;height:40px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;direction:auto}
#sq::placeholder{color:var(--muted)}
#tabs{position:sticky;top:var(--hdr);z-index:40;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--line);scrollbar-width:thin}
#tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:6px 14px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:.9rem}
#tabs a[aria-current=page]{color:var(--bg);background:linear-gradient(90deg,var(--cyan),var(--violet));font-weight:800}
#tabs a:hover{border-color:var(--line)}
#pbar{position:fixed;top:0;inset-inline:0;height:3px;z-index:60;background:transparent}
#pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet))}
/* layout */
#wrap{display:grid;grid-template-columns:minmax(0,1fr);max-width:1280px;margin:0 auto}
#side{display:none}
@media(min-width:1000px){#wrap.hasside{grid-template-columns:310px minmax(0,1fr)}#wrap.hasside #side{display:block;position:sticky;top:calc(var(--hdr) + 50px);height:calc(100vh - var(--hdr) - 50px);overflow:auto;padding:12px;border-inline-end:1px solid var(--line)}#drawerbtn{display:none}}
#main{padding:18px 14px 80px;min-width:0}
.page{max-width:900px;margin:0 auto}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70}
#drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(88vw,340px);background:var(--bg2);z-index:80;transform:translateX(105%);transition:transform .25s;overflow:auto;padding:12px;border-inline-end:1px solid var(--line);visibility:hidden}
html[dir=rtl] #drawer{inset-inline-start:auto;right:0;left:auto;transform:translateX(105%)}
#drawer.open{transform:none;visibility:visible}
@media(prefers-reduced-motion:reduce){#drawer,html{transition:none;scroll-behavior:auto}*{animation:none!important}}
/* toc */
.tocch{margin:0 0 6px}
.tocch>button{width:100%;text-align:start;background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tocch>button .pc{font-size:.78rem;color:var(--cyan);font-weight:700}
.tocch ul{list-style:none;margin:4px 0 8px;padding:0 8px 0 0}
.tocch a{display:flex;gap:8px;text-decoration:none;color:var(--muted);padding:5px 8px;border-radius:8px;font-size:.88rem;line-height:1.5;align-items:flex-start}
.tocch a b{color:var(--cyan);font-weight:700;min-width:2.4em;direction:ltr;unicode-bidi:isolate;text-align:start}
.tocch a:hover{background:var(--card)}
.tocch a.act{background:var(--card2);color:var(--text);box-shadow:inset 3px 0 0 var(--cyan)}
.tocch a.done::after{content:"✓";color:var(--good);margin-inline-start:auto}
.tocch a .t{direction:ltr;unicode-bidi:isolate;text-align:left}
/* hero */
.hero{border:1px solid var(--line);border-radius:22px;padding:26px 20px;background:linear-gradient(135deg,var(--card),var(--card2));box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:clamp(1.6rem,5vw,2.6rem);line-height:1.3}
.hero p{margin:6px 0;color:var(--muted)}
.hero svg.net{position:absolute;inset-inline-start:-20px;bottom:-20px;width:260px;opacity:.5;pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-weight:700;text-decoration:none;min-height:42px}
.btn:hover{border-color:var(--cyan)}
.btn.pri{background:linear-gradient(90deg,var(--cyan),var(--violet));color:#071022;border-color:transparent}
.btn.sm{padding:4px 12px;min-height:34px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h3{margin:0 0 6px;font-size:1.05rem}
.meter{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0;transition:width .6s}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tag{display:inline-block;padding:0 9px;border-radius:99px;border:1px solid var(--line);font-size:.78rem;color:var(--muted);background:var(--bg2);line-height:1.7}
h2.sec{font-size:1.4rem;margin:30px 0 10px;display:flex;gap:10px;align-items:center}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
/* chapter + topic */
.chhead{margin:8px 0 22px;padding:22px 18px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(135deg,var(--card2),var(--card))}
.chhead .num{font-size:3rem;font-weight:900;line-height:1;color:var(--cyan);direction:ltr;display:inline-block;opacity:.9}
.chhead h1{margin:.2em 0;font-size:1.7rem;direction:ltr;text-align:left}
.topic{margin:0 0 34px;padding:0 0 10px;border-bottom:1px dashed var(--line)}
.thead{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
.tnum{flex:none;min-width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05rem;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#061022;direction:ltr}
.ttl{flex:1;min-width:200px}
.ttl h2{margin:0;font-size:1.45rem;line-height:1.4;direction:ltr;text-align:left}
.ttl .src{color:var(--muted);font-size:.82rem;direction:ltr;text-align:left}
.tact{display:flex;gap:6px;flex-wrap:wrap}
.tact button{min-height:38px}
.tact button[aria-pressed=true]{background:var(--cyan);color:#041022;border-color:transparent}
.topic p{margin:.7em 0}
.topic h3{margin:1.2em 0 .3em;font-size:1.12rem;color:var(--violet)}
.topic ul,.topic ol{padding-inline-start:1.4em;margin:.5em 0}
.topic li{margin:.3em 0}
.box{border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:14px 0;background:var(--card)}
.box>.bt{font-weight:800;margin-bottom:4px;display:block}
.box.simple{border-inline-start:5px solid var(--cyan);background:linear-gradient(90deg,color-mix(in srgb,var(--cyan) 9%,var(--card)),var(--card))}
.box.def{border-inline-start:5px solid var(--violet);direction:ltr;text-align:left}
.box.def .bt{color:var(--violet)}
.box.memo{border-inline-start:5px solid var(--warn)}
.box.memo .bt{color:var(--warn)}
.box.trap{border-inline-start:5px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.box.trap .bt{color:var(--bad)}
.box.scn{border-inline-start:5px solid var(--good)}
.box.scn .bt{color:var(--good)}
.box.extra{border-style:dashed;background:transparent}
.box.extra .bt{color:var(--muted)}
.box.typo{border-style:dashed;border-color:var(--warn);background:transparent}
.box.typo .bt{color:var(--warn)}
.box.flag{border-style:dashed;border-color:var(--bad);background:transparent}
.box.q{border-inline-start:5px solid var(--cyan2)}
.box.steps ol{counter-reset:s;list-style:none;padding:0}
.box.steps li{counter-increment:s;position:relative;padding-inline-start:2.4em;margin:.5em 0}
.box.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:.1em;width:1.7em;height:1.7em;border-radius:50%;background:var(--violet);color:#071022;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85rem;line-height:1}
.ans{display:none;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--code);border:1px solid var(--line);direction:ltr;text-align:left}
.ans.show{display:block}
.fig{margin:14px 0;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.fig svg{width:100%;height:auto;max-width:100%;display:block}
.fig figcaption{font-size:.82rem;color:var(--muted);margin-top:6px;direction:ltr;text-align:left}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top;line-height:1.6}
th{background:var(--card2);position:sticky;top:0;white-space:nowrap}
tr:nth-child(even) td{background:color-mix(in srgb,var(--card2) 55%,transparent)}
td:first-child{font-weight:700}
.nav2{display:flex;justify-content:space-between;gap:10px;margin:20px 0;flex-wrap:wrap}
/* quiz */
.opt{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;cursor:pointer;direction:ltr;text-align:left;line-height:1.6}
.opt:hover{border-color:var(--cyan)}
.opt.sel{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 14%,var(--card))}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.qtext{direction:ltr;text-align:left;font-weight:700;font-size:1.05rem;line-height:1.7}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0}
select,input[type=text],input[type=number],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%}
textarea{min-height:110px;direction:ltr;text-align:left}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;min-height:38px}
.chip[aria-pressed=true]{background:var(--cyan);color:#041022;border-color:transparent;font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:800;direction:ltr;display:inline-block}
.bar{display:flex;gap:6px;align-items:center}
/* flashcard */
.fc{perspective:900px;margin:14px 0}
.fc .inner{min-height:230px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,var(--card),var(--card2));padding:22px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;box-shadow:var(--shadow)}
.fc .front{direction:ltr;text-align:center;font-size:1.3rem;font-weight:800}
.fc .back{margin-top:12px;display:none}
.fc.flip .back{display:block}
.fc .back .e{direction:ltr;text-align:left;margin-bottom:8px}
/* lab */
.lab svg text{font-family:inherit}
.stepnote{min-height:3.4em;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0}
.sw{fill:var(--card2);stroke:var(--line)}
.stext{fill:var(--text)}
.smuted{fill:var(--muted)}
.scy{stroke:var(--cyan);fill:var(--cyan)}
.svi{stroke:var(--violet);fill:var(--violet)}
.ssel{stroke:var(--warn)}
/* misc */
.hl{background:color-mix(in srgb,var(--warn) 40%,transparent);border-radius:4px}
.res{display:block;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--card)}
.res:hover{border-color:var(--cyan)}
.res .k{font-size:.78rem;color:var(--cyan)}
.toast{position:fixed;bottom:16px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;background:var(--card2);border:1px solid var(--cyan);padding:8px 16px;border-radius:12px;z-index:100;box-shadow:var(--shadow)}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:.8rem}
details{border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:8px 0;background:var(--card)}
summary{cursor:pointer;font-weight:700}
.stat{font-size:1.7rem;font-weight:900;color:var(--cyan);direction:ltr;display:inline-block}
.sticky-nav{position:sticky;bottom:8px;display:flex;gap:8px;justify-content:center;z-index:5}
@media(max-width:520px){:root{--fs:16px}.tnum{min-width:48px;height:48px}.ttl h2{font-size:1.2rem}#hdr .brand span{display:none}th,td{padding:6px 7px}}
@media print{#hdr,#tabs,#side,#drawer,#scrim,.tact,.nav2,.btn,#pbar,.sticky-nav{display:none!important}body{background:#fff;color:#000}body::before{display:none}.box,.card,.fig{break-inside:avoid;background:#fff!important;border-color:#999}.ans{display:block!important;background:#fff}#wrap{display:block!important}.topic{break-inside:auto}:root{--text:#000;--muted:#333;--line:#999;--card:#fff;--card2:#fff;--bg:#fff;--bg2:#fff;--cyan:#036;--violet:#306;--code:#f3f3f3}}
.stk{display:flex;flex-direction:column;gap:4px;direction:ltr;max-width:640px}.stk>div{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card2);text-align:center}
.stk>div:first-child{border-color:var(--cyan)}
.lt{direction:ltr;unicode-bidi:isolate}
</style>
</head>
<body>
<div id="pbar" aria-hidden="true"><i></i></div>
<header id="hdr" role="banner">
  <button class="ibtn" id="drawerbtn" aria-label="فتح الفهرس" aria-expanded="false" aria-controls="drawer">☰</button>
  <a class="brand" href="#/home" aria-label="الصفحة الرئيسية"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><circle cx="16" cy="16" r="5" fill="url(#lg)"/><g stroke="url(#lg)" stroke-width="2" fill="none"><circle cx="16" cy="16" r="12"/><path d="M16 4v7M16 21v7M4 16h7M21 16h7"/></g><g fill="#22d3ee"><circle cx="16" cy="4" r="2"/><circle cx="28" cy="16" r="2"/><circle cx="16" cy="28" r="2"/><circle cx="4" cy="16" r="2"/></g></svg><span>IoT MIDTERM MASTER</span></a>
  <input id="sq" type="search" placeholder="ابحث: MQTT, QoS, بلوتوث, ZigBee …" aria-label="بحث في كل المحتوى" autocomplete="off">
  <button class="ibtn" id="themebtn" aria-label="تبديل الثيم">◐</button>
  <button class="ibtn" id="fsbtn" aria-label="تكبير الخط">A+</button>
</header>
<nav id="tabs" aria-label="أقسام الموقع"></nav>
<div id="wrap">
  <aside id="side" aria-label="فهرس المحتويات"></aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="scrim"></div>
<aside id="drawer" aria-label="فهرس المحتويات" role="dialog" aria-modal="true" aria-hidden="true"></aside>
<div id="toastbox" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ===== CORE DATA HELPERS ===== */
const CH=[
{id:0,t:'Chapter 0 — Course Overview',ar:'نظرة عامة: Embedded Systems, Networks, IoT',file:'Chapter0_handout.pdf',pages:10,slides:20},
{id:1,t:'Chapter 1 — IoT Fundamentals',ar:'أساسيات IoT: Architecture, Smart Things, Gateway, Cloud, Analytics',file:'Chapter1_handout.pdf',pages:14,slides:27},
{id:2,t:'Chapter 2 — Infrastructure Protocols in IoT',ar:'Bluetooth, BLE, 802.11ah, 802.15.4, ZigBee, 6LoWPAN',file:'Chapter2_Handout.pdf',pages:35,slides:70},
{id:3,t:'Chapter 3 — Service Discovery & Application Layer Protocols',ar:'mDNS, DNS-SD, MQTT, CoAP',file:'Chapter3_Handout.pdf',pages:22,slides:44}
];
const T=[],Qs=[],G=[],FACTS=[];
function tb(h,rows){return '<div class="tw"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function ul(a){return '<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
function ol(a){return '<ol>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ol>';}
function stk(a,cap){return '<figure class="fig"><div class="stk">'+a.map(x=>'<div>'+x+'</div>').join('')+'</div>'+(cap?'<figcaption>'+cap+'</figcaption>':'')+'</figure>';}
function fig(svg,cap){return '<figure class="fig">'+svg+(cap?'<figcaption>'+cap+'</figcaption>':'')+'</figure>';}
function L(id,title,ar,s,o){T.push(Object.assign({id,ch:+id.split('-')[0],t:title,ar,s},o));}
function pgs(t){const p=new Set();t.s.forEach(r=>{for(let i=r[0];i<=r[1];i++)p.add(Math.ceil(i/2));});return [...p].sort((a,b)=>a-b);}
function slidesTxt(t){return t.s.map(r=>r[0]===r[1]?'slide '+r[0]:'slides '+r[0]+'–'+r[1]).join(', ');}
function refTxt(t){const p=pgs(t);return 'Ch'+t.ch+' · PDF p.'+(p.length>1?p[0]+'–'+p[p.length-1]:p[0])+' · '+slidesTxt(t);}
function topicById(id){return T.find(t=>t.id===id);}
function strip(h){return h.replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();}
/* Questions */
let _qn=0;
function Q(t,d,q,c,w1,w2,w3,e){Qs.push({id:'q'+(++_qn),t,d,k:'mcq',q,o:[c,w1,w2,w3],e});}
function TF(t,d,q,a,e){Qs.push({id:'q'+(++_qn),t,d,k:'tf',q,o:['True','False'],a:a?0:1,e});}
function FB(t,d,q,a,e){Qs.push({id:'q'+(++_qn),t,d,k:'fb',q,a:a.split('|'),e});}
function WR(t,d,q,m,r){Qs.push({id:'q'+(++_qn),t,d,k:'wr',q,m,r});}
function GL(term,full,ar,t){G.push({term,full,ar,t});}
function FC(q,a,ar,t){FACTS.push({q,a,ar,t});}

/* ===================== CHAPTER 0 ===================== */
L('0-1','Course Overview, Objectives, Contents, Labs & References','نظرة عامة على الكورس',[[1,1],[17,20]],{
simple:'دي خريطة الكورس: اسم المادة، مين بيشرحها، الأهداف اللي المفروض توصلها، المواضيع، اللاب، والمراجع.',
body:`<p>المادة اسمها <b>Internet of Things</b>. المحاضرات <b>2 hours/week</b> مع <b>Dr. Nayera Sadek</b>، واللاب <b>2 hour/week</b> (slide 1).</p>
<h3>Course Objectives (slide 17)</h3>
<p>لما تخلص الكورس المفروض تقدر:</p>
${ol(['<b>تشرح تعريف</b> الـ “Internet of Things”.','<b>تفهم المكونات الأساسية</b> (key components) لأي IoT system.','<b>تفرّق بين مستويات الـ IoT stack</b> وتبقى عارف أهم التقنيات والـ protocols المستخدمة في كل layer من الـ stack.','<b>تطبّق</b> اللي اتعلمته عشان تبني وتختبر IoT system كامل وشغّال، بما فيه prototyping وprogramming وdata analysis.'])}
<h3>Contents (slide 18)</h3>
${ol(['Internet of Things (IoT) Fundamentals','IoT Building Blocks – Hardware and Software','Sensing Principles and Wireless Sensor Network','IoT Gateway','IoT Protocol Stack','IoT Cloud and Fog Computing','IoT Applications','IoT Security','Social IoT'])}
<h3>Labs (slide 19)</h3>
<p>اللاب مقسوم قسمين: <b>IoT Simulation</b> و <b>IoT Hardware</b>.</p>
<h3>References (slide 20)</h3>
${ul(['Muhammad A. Imran, Huanlai Xing, Sajjad Hussain, Muhammad Azhar Iqbal — <i>“Enabling the Internet of Things: Fundamentals, Design, and Applications”</i>, 2021, John Wiley &amp; Sons Ltd.','David Hanes, Gonzalo Salgueiro, Patrick Grossetete — <i>“IoT Fundamentals: Networking Technologies, Protocols, and Use Cases for the Internet of Things”</i>, 2017, Cisco Systems, Inc.','Raj Kamal — <i>“INTERNET OF THINGS: Architecture and Design Principles”</i>, 2017, McGraw Hill Education (India) Private Limited.'])}`,
defs:[['Course objective #3','Differentiate between the levels of the IoT stack and be familiar with the key technologies and protocols employed at each layer of the stack.']],
memo:['4 objectives: <b>define IoT</b> → <b>key components</b> → <b>levels of the stack + protocols per layer</b> → <b>build & test a working system</b> (prototyping, programming, data analysis).','Contents = 9 items; Item 1 هو “IoT Fundamentals”.','Labs = IoT Simulation + IoT Hardware.'],
extra:['الـ Contents فيها 9 مواضيع، والـ 4 handouts اللي عندك بتغطي جزء منها (Overview, Fundamentals, Infrastructure Protocols, Service Discovery & Application Protocols). الموقع ده بيغطي الـ 4 handouts بس.'],
q:['List the four objectives stated in the course overview.','1) Explain the definition of the “Internet of Things”. 2) Understand the key components of the IoT system. 3) Differentiate between the levels of the IoT stack and be familiar with the key technologies and protocols at each layer. 4) Apply the knowledge to build and test a complete working IoT system involving prototyping, programming and data analysis.']});

L('0-2','Embedded Systems','الـ Embedded Systems',[[2,2]],{
simple:'الـ Embedded System هو كمبيوتر صغير متخصص “مدفون” جوّا جهاز، بيحس بالبيئة (sensors)، بيفكر (processor)، وبيأثر على البيئة (actuators).',
body:`<p>السلايد ده فيه <b>diagram بس</b> (العنوان “Embedded Systems”) بيوضح الأجزاء اللي جوّا أي embedded system وعلاقتها بالـ <b>Environment</b> والـ <b>User</b>. تعالى نفهم الرسمة جزء جزء:</p>
${tb(['Block in the figure','بيعمل إيه (بالبلدي)'],[
['<b>SENSORS</b>','بيحوّلوا حاجة من العالم الحقيقي (حرارة، ضوء...) لإشارة كهربائية داخلة للنظام. السهم داخل من الـ Environment.'],
['<b>MEMORY</b>','بتخزّن البرنامج والبيانات. في الرسمة فيه أكتر من طبقة memory.'],
['<b>PROCESSOR</b>','العقل اللي بينفّذ البرنامج. متوصّل بالـ MEMORY في الاتجاهين.'],
['<b>HARDWIRED UNIT</b>','وحدة hardware ثابتة فيها: <b>Application-specific logic</b>, <b>Timers</b>, <b>A/D and D/A conversion</b>.'],
['<b>ACTUATORS</b>','بينفّذوا الأمر على الواقع (يشغّلوا motor مثلاً). السهم طالع للـ Environment.'],
['<b>USER I/O</b>','تواصل المستخدم مع النظام (input/output).']])}
${fig(`<svg viewBox="0 0 640 250" role="img" aria-label="Embedded system block diagram"><ellipse cx="320" cy="120" rx="290" ry="105" class="sw"/><g class="stext" font-size="14" text-anchor="middle"><rect x="140" y="40" width="130" height="46" rx="8" class="sw"/><text x="205" y="68">MEMORY</text><rect x="340" y="40" width="140" height="46" rx="8" class="sw"/><text x="410" y="68">PROCESSOR</text><rect x="190" y="140" width="260" height="56" rx="8" class="sw"/><text x="320" y="162" font-size="12">HARDWIRED UNIT</text><text x="320" y="182" font-size="11" class="smuted">App-specific logic · Timers · A/D &amp; D/A</text><rect x="46" y="70" width="60" height="90" rx="8" class="sw" stroke-dasharray="4"/><text x="76" y="120" font-size="11">SENSORS</text><rect x="530" y="70" width="70" height="90" rx="8" class="sw" stroke-dasharray="4"/><text x="565" y="120" font-size="11">ACTUATORS</text></g><g stroke="var(--cyan)" stroke-width="2" fill="none"><path d="M0 115h44M106 115h82"/><path d="M450 168h80M600 115h38"/><path d="M270 63h68M340 100v38M205 90v48"/></g><text x="320" y="238" text-anchor="middle" class="smuted" font-size="12">USER I/O ⇄ · ENVIRONMENT</text></svg>`,'Redrawn from slide 2 (block labels as in the handout; arrows simplified).')}`,
defs:[['Embedded system (extra)','A dedicated computer system built into a larger device to perform specific functions, typically sensing inputs, processing them, and driving outputs.']],
scn:'ميكروويف: sensor بيقيس الحرارة، processor بيقرر، actuator بيشغّل/يقفل السخان، وUSER I/O هو الأزرار والشاشة.',
memo:['الأجزاء المرسومة: <b>Sensors, Memory, Processor, Hardwired Unit (application-specific logic, timers, A/D & D/A), Actuators, User I/O, Environment</b>.'],
extra:['التعريف الأكاديمي أعلاه مش مكتوب بالنص في السلايد (السلايد diagram بس). مكتوب هنا للفهم.','سلايد الـ diagram فيه علامة مائية باسم دكتور تاني، ده بس مصدر الصورة.'],
q:['Name the blocks shown in the embedded-system diagram of the handout.','Sensors, Memory, Processor, Hardwired Unit (application-specific logic, timers, A/D and D/A conversion), Actuators, User I/O, all interacting with the Environment.']});

L('0-3','Computer Networks','الـ Computer Networks',[[3,3]],{
simple:'الـ Computer Network هو مجموعة أجهزة متوصلة ببعض عشان تتبادل بيانات — والـ Internet أكبر مثال. IoT بيوسّع الفكرة دي لأي “شيء” مش بس كمبيوتر.',
body:`<p>السلايد ده <b>صورة بس</b> (عنوان “Computer Networks”): laptops كتير متوصلة حوالين كورة أرضية (الـ Internet).</p>
<p>الفكرة اللي بتمهّد لها: قبل IoT، الشبكات كانت بتربط <b>computers</b> ببعض. IoT بيمد الشبكة لأجهزة وأشياء تانية (Chapter 1 slide 3 بيوضح التطور: Network → The Internet → Mobile-Internet → Mobiles + People + PCs → Internet of Things).</p>`,
defs:[['Computer network (extra)','A set of interconnected devices that exchange data over a communication medium.']],
memo:['الـ slide = صورة بدون نص؛ الفكرة = الشبكة هي الأساس اللي IoT بيتبني عليه.'],
extra:['مفيش نص في السلايد ده. الشرح فوق للربط بس.'],
flag:['السلايد 3 image-only (مفيش نص قابل للاستخراج). وصفناه من الصورة: laptops حوالين globe.'],
q:['What does the “Computer Networks” slide visually show, and why is it relevant to IoT?','It shows several laptops connected around a globe (the Internet). It is relevant because IoT builds on networking by extending connectivity from computers to everyday objects.']});

L('0-4','Introduction — What IoT Is and Where It Is Used','تعريف IoT ومجالات استخدامه',[[4,12]],{
simple:'IoT = أجهزة متوصلة بالإنترنت ومعاها sensors، بتجمع وتبعت بيانات من غير تدخل إنسان. وبتدخل في كل مجال تقريباً: بيوت، مدن، أكل، عربيات، مستشفيات، زراعة.',
body:`<h3>التعريف (slide 5)</h3>
<p><b>Internet of Things (IoT)</b> بتمثّل <b>كل الأجهزة الحاسوبية (computing devices) المتوصلة بالإنترنت</b>. الأجهزة دي مدمج فيها <b>environmental sensors</b> وتقنيات تانية بتخليها <b>تجمع وتتبادل data من غير human intervention</b>.</p>
<h3>الصناعات (slide 6)</h3>
<p>IoT بيقدّم فرص ضخمة في تقريباً كل industry. الأمثلة اللي الدكتورة ذكرتها: ${ul(['<b>Smart Buildings</b>','<b>Smart Cities</b>','<b>Food Traceability</b>','<b>Connected Vehicles</b>'])}</p>
<h3>الـ Figures اللي في الـ handout (slides 4, 7–12)</h3>
${tb(['Slide','الرسمة بتوضح إيه','العناصر المكتوبة في الرسمة'],[
['4','IoT في وسط كل حاجة (الـ cloud/Internet of Things في النص)','IoT enabled: factories, shops/airports/stations, mobile devices, edge IoT devices, IoT devices, datacenters, ships/airplanes/trains, cities, homes &amp; buildings'],
['7','Smart Home System','Weather, Wi-Fi, mobile access, PC, TV, media play, audio, CCTV, tablet, lighting, air conditioning'],
['8','Connected car — sensors كتير','Fuel sensor, rear camera, GPS sensors, airbag sensor, A/C sensor, driver fatigue sensor, night vision sensor, driver seat sensors (EEG, ECG, body balance), door sensor, tyre pressure sensor, parking sensor, high beam sensor, front camera'],
['9','Vehicular networking','Vehicular cloud, satellite, radio tower, infrastructure domain (hotspot, RSU), ad hoc domain, in-vehicle domain, V2V / V2I links'],
['10','Smart hospital/building','Automatic information, indoor locating, platform independent software, automatic documentation, optimised procedures, transparent process knowledge'],
['11','Smart agriculture','Irrigation sprinklers with wireless signals + a mobile app in hand'],
['12','Smart home heating control paths','App → Internet → Cloud; App → Wi-Fi → router/Internet; Gateway → RF or ZigBee → heating valves; App → Bluetooth → a valve directly']])}
<p>خلي بالك من الرسمة بتاعة slide 12: بتوضح إن نفس الـ app ممكن يوصل للجهاز بأكتر من طريق (Internet/Cloud, Wi-Fi, Bluetooth, أو عن طريق Gateway باستخدام RF/ZigBee).</p>`,
defs:[['Internet of Things (IoT)','All computing devices that are connected to the internet and embedded with environmental sensors and other technologies enabling them to collect and exchange data without human intervention.']],
scn:'عربية حديثة: حساس ضغط الإطارات + GPS + camera → بيانات بتتبعت للـ vehicular cloud، والعربية بتكلّم عربيات تانية (V2V) والـ roadside units (V2I).',
memo:['4 صناعات: <b>Smart Buildings, Smart Cities, Food Traceability, Connected Vehicles</b>.','IoT = devices + environmental sensors + exchange data <b>without human intervention</b>.','Car sensors في الرسمة تتضمن EEG و ECG في الـ driver seat.'],
traps:['IoT مش “أي جهاز متوصل بإنترنت” بس؛ التعريف بيذكر وجود <b>sensors</b> وقدرة على <b>collect and exchange data بدون تدخل بشري</b>.'],
flag:['Slides 4, 9, 10 فيها نص صغير جداً في الصورة. قرأنا العناوين الواضحة بس؛ التفاصيل الدقيقة (ترتيب الأسهم) محتاجة مراجعة بشرية.'],
q:['Define IoT as given in the handout and list four application areas mentioned.','IoT represents all computing devices connected to the internet that are embedded with environmental sensors and other technologies enabling them to collect and exchange data without human intervention. Areas: smart buildings, smart cities, food traceability, connected vehicles.']});

L('0-5','“Connect the Unconnected”, Benefits, Kevin Ashton & the Three Visions','الهدف، الفوائد، أصل المصطلح، والـ 3 visions',[[13,16]],{
simple:'هدف IoT: نوصّل “الحاجات غير المتوصلة” بالإنترنت عشان تتكلم مع الناس ومع بعضها. والنتيجة: كفاءة ودقة وأتمتة وتطبيقات متقدمة.',
body:`<h3>Connect the unconnected (slide 13)</h3>
<p>الهدف الأساسي لـ IoT هو “<b>connect the unconnected</b>”. يعني الأشياء (objects) اللي حالياً <b>مش متوصلة بشبكة كمبيوتر</b> — وأهم شبكة هي الإنترنت — هتتوصل عشان <b>تتواصل وتتفاعل مع الناس ومع objects تانية</b>. (الصورة: قطعتين puzzle بيتركبوا.)</p>
<h3>IoT كمجموعة smart devices (slide 14)</h3>
<p>IoT هو مجموعة أجهزة ذكية تقدر <b>تحس (sense)</b> وتتحكم في مكوّناتها الفيزيائية <b>عن بُعد عبر network</b>. ده بيحسّن:</p>
${ul(['<b>Efficiency</b>','<b>Accuracy</b>','<b>Automation</b>','<b>The enablement of advanced applications</b>'])}
<h3>أصل المصطلح (slide 15)</h3>
<p><b>Kevin Ashton</b> هو اللي ابتكر المصطلح “Internet of Things” وهو شغال في <b>Procter &amp; Gamble</b> سنة <b>1999</b>. الاقتباسان المكتوبان في السلايد:</p>
${ul(['“In the twentieth century, computers were brains without senses—they only knew what we told them.”','“IoT is changing this paradigm; in the twenty-first century, computers are sensing things for themselves.”'])}
<p>المعنى: زمان الكمبيوتر كان “مخ من غير حواس” — بيعرف بس اللي الإنسان يدخّله. IoT بيدّي الكمبيوتر حواس (sensors) يحس بنفسه.</p>
<h3>IoT as convergence of three visions (slide 16)</h3>
<p>الرسمة Venn diagram بتوضح إن IoT هو <b>نقطة التقاء 3 رؤى</b>:</p>
${tb(['Vision','العناصر المكتوبة في الدايرة'],[
['<b>Things-oriented Vision</b>','RFID, NFC, Sensor'],
['<b>Internet-oriented Vision</b>','Ad hoc Networks, Web of Things'],
['<b>Semantic-oriented Vision</b>','AI Technologies, Learning Technologies, Reasoning over Data'],
['التقاطعات','Things-oriented ∩ Internet-oriented: <b>Things Communication, IP for Smart Devices</b> · Things ∩ Semantic: <b>Smart Objects</b> · Internet ∩ Semantic + center: <b>Smart-semantic Middleware</b> · المركز: <b>IoT</b>']])}`,
defs:[['“Connect the unconnected”','The basic goal of IoT: objects not currently joined to a computer network (the Internet) will be connected so they can communicate and interact with people and other objects.'],['Kevin Ashton','Created the term “Internet of Things” while working for Procter & Gamble in 1999.']],
steps:['اختار object مش متوصل (مثلاً مكيف).','ضيف له sensors وconnectivity.','يتوصل بالشبكة/الإنترنت.','يتفاعل مع الناس والـ objects التانية (تحكم عن بُعد، أتمتة).'],
scn:'ثرموستات ذكي: كان جهاز “مش متوصل”. دلوقتي بيحس بالحرارة ويتحكم فيها عن بُعد من الموبايل = efficiency + automation.',
memo:['<b>Kevin Ashton · Procter & Gamble · 1999</b>.','4 benefits: <b>Efficiency, Accuracy, Automation, enablement of advanced applications</b>.','3 visions: <b>Things-oriented, Internet-oriented, Semantic-oriented</b>.'],
traps:['الـ visions الثلاثة موزّعة: RFID/NFC/Sensor تحت <b>Things</b>؛ Web of Things تحت <b>Internet</b>؛ AI/Learning/Reasoning تحت <b>Semantic</b>. متبدّلهمش.','Kevin Ashton ابتكر المصطلح في <b>1999</b> مش 2009.'],
q:['Explain “connect the unconnected” and name the three visions that IoT converges.','Objects not currently connected to a computer network (the Internet) will be connected so they can communicate and interact with people and other objects. IoT converges the Things-oriented, Internet-oriented and Semantic-oriented visions.']});

/* ===================== CHAPTER 1 ===================== */
L('1-1','1.1 Introduction — IoT Definition & Evolution','التعريف وتطور الشبكات',[[1,3]],{
simple:'IoT هو شبكة من الأشياء الفيزيائية (Things) اللي جواها إلكترونيات وsoftware وsensors واتصال شبكي، وده بيخليها تجمع وتبادل data.',
body:`<h3>التعريف (slide 2)</h3>
<p><b>The Internet of Things</b> is the network of physical objects or “Things” embedded with <b>electronics, software, sensors, and network connectivity</b>, which enables these objects to <b>collect and exchange data</b>. الأربع حاجات اللي جوّا الـ Thing: <b>electronics + software + sensors + network connectivity</b>.</p>
<h3>تطور الشبكات (slide 3)</h3>
<p>الرسمة بتوضح مراحل تطور الاتصال، من اليسار لليمين:</p>
${tb(['المرحلة','مين المتوصل؟'],[['<b>Network</b>','Hosts (computers) متوصلين ببعض'],['<b>The Internet</b>','Hosts كتير متوصلين عبر Web/Internet'],['<b>Mobile-Internet</b>','Hosts + Mobile devices'],['<b>Mobiles + People + PCs</b>','موبايلات + ناس + PCs'],['<b>Internet of Things</b>','Interconnected Objects: بيت، ثلاجة، ماكينة قهوة، عربية، ATM، موبايل، ناس، PC...']])}
<p>الفكرة: كل مرحلة بتزوّد نوع جديد من الأشياء المتوصلة، وآخر مرحلة هي <b>الأشياء نفسها (objects)</b>.</p>`,
defs:[['Internet of Things (Ch1 definition)','The network of physical objects or “Things” embedded with electronics, software, sensors, and network connectivity, which enables these objects to collect and exchange data.']],
memo:['Thing = <b>electronics + software + sensors + network connectivity</b> → <b>collect & exchange data</b>.','تسلسل التطور: Network → The Internet → Mobile-Internet → Mobiles+People+PCs → <b>IoT</b>.'],
traps:['تعريف Chapter 1 فيه “network of physical objects”، أما تعريف Chapter 0 فبيركّز على “computing devices connected to the internet”. الاتنين صح، بس اكتب التعريف المطلوب بالنص.'],
q:['Give the Chapter 1 definition of IoT and list the stages of connectivity evolution shown in the figure.','IoT is the network of physical objects or “Things” embedded with electronics, software, sensors and network connectivity that enables them to collect and exchange data. Evolution: Network → The Internet → Mobile-Internet → Mobiles + People + PCs → Internet of Things (interconnected objects).']});

L('1-2','1.2 IoT Architecture — The OSI Model and the TCP/IP Architecture','OSI و TCP/IP',[[4,5]],{
simple:'قبل ما نشوف architecture بتاع IoT لازم نفهم النموذجين القياسيين: OSI (7 طبقات) و TCP/IP (4 طبقات).',
body:`<h3>The standard OSI model (slide 4)</h3>
<p>الرسمة بتبيّن جهازين (sending PC و receiving PC) كل واحد عنده <b>7 layers</b>، والبيانات بتعدّي على Internet / local network / long distance network:</p>
${stk(['7 · Application','6 · Presentation','5 · Session','4 · Transport','3 · Network','2 · Data Link','1 · Physical'],'OSI model (7 layers) — slide 4')}
<h3>The TCP/IP architecture (slide 5)</h3>
<p>الرسمة بتقارن OSI بـ TCP/IP وبتوضح <b>الـ mapping</b>:</p>
${tb(['OSI layers','⟶','TCP/IP layer'],[['Application + Presentation + Session','⟶','<b>Application Layer</b>'],['Transport','⟶','<b>Transport Layer</b>'],['Network','⟶','<b>Network Layer</b>'],['Data Link + Physical','⟶','<b>Network Access Layer</b>']])}
<p>يعني TCP/IP = <b>4 layers</b>: Application, Transport, Network, Network Access. وجرّب الـ interactive stack في <a href="#/lab/layers">Visual Lab</a>.</p>`,
defs:[['OSI model','A seven-layer model: Application, Presentation, Session, Transport, Network, Data Link, Physical.'],['TCP/IP architecture (as drawn)','Application (= OSI Application + Presentation + Session), Transport, Network, and Network Access (= OSI Data Link + Physical).']],
memo:['OSI = <b>7</b> layers. TCP/IP (في الـ handout) = <b>4</b> layers.','أعلى 3 OSI layers → TCP/IP Application. أدنى 2 → Network Access.'],
traps:['TCP/IP “Network Access Layer” = Data Link + Physical مع بعض، مش layer منفصلة لكل واحدة.','Transport و Network في OSI و TCP/IP أسمائهم بنفس الشكل، بس Application في TCP/IP أكبر (3 layers مدموجة).'],
q:['Map the OSI layers onto the TCP/IP architecture as shown in the handout.','Application+Presentation+Session → Application; Transport → Transport; Network → Network; Data Link+Physical → Network Access.']});

L('1-3','1.2 IoT Architectures — Overview and the Three-Layer Architecture','Architectures الـ 3 layers',[[6,8]],{
simple:'الـ IoT architecture ممكن يتقسم 3 أو 5 أو 6 أو 7 layers. أبسطهم 3 layers: Perception (يحس)، Network (ينقل)، Application (يخدم المستخدم).',
body:`<h3>الأنواع (slide 6)</h3>
<p>الـ IoT architecture ممكن يكون: ${ul(['<b>Three-layer</b> IoT architecture','<b>Five-layer</b> IoT architecture','<b>Six-layer</b> IoT architecture','<b>Seven-layer</b> architecture'])}</p>
<h3>Three-Layer IoT Architecture (slides 7–8)</h3>
${stk(['<b>Application Layer</b> — Provides Services · Semantic Analysis','<b>Network Layer</b> — Enroutes the received data to distant application','<b>Perception Layer</b> — Information Collection · Data Transmission'],'Figure on slide 7 (top to bottom)')}
${tb(['Layer','مسؤوليتها (من السلايد 8)'],[
['<b>Perception layer</b>','هي الـ <b>physical layer</b>، فيها <b>sensors</b> لاستشعار وجمع معلومات عن البيئة. بتحس بـ physical parameters أو بتتعرف على smart objects تانية في البيئة.'],
['<b>Network layer</b>','مسؤولة عن <b>الاتصال</b> بالـ smart things التانية وأجهزة الشبكة والـ servers. خصائصها بتُستخدم كمان لـ <b>نقل ومعالجة</b> بيانات الـ sensors.'],
['<b>Application layer</b>','مسؤولة عن <b>توصيل الخدمات الخاصة بكل تطبيق</b> للمستخدم. بتعرّف التطبيقات اللي IoT ممكن تتنشر فيها: <b>smart homes, smart cities, smart health</b>.']])}`,
defs:[['Perception layer','The physical layer with sensors for sensing and gathering information about the environment; it senses physical parameters or identifies other smart objects.'],['Network layer','Responsible for connecting to other smart things, network devices and servers; its features are also used for transmitting and processing sensor data.'],['Application layer','Responsible for delivering application-specific services to the user; defines applications such as smart homes, smart cities and smart health.']],
steps:['Perception layer بتجمع data من البيئة.','Network layer بتنقلها (enroutes) لتطبيق بعيد.','Application layer بتقدّم الخدمة للمستخدم (analysis + service).'],
scn:'Smart home: sensor حرارة (Perception) → Wi-Fi/router (Network) → app الموبايل بيعرض ويتحكم (Application).',
memo:['3 layers من تحت لفوق: <b>Perception → Network → Application</b>.','الرسمة: Perception = <b>Information Collection + Data Transmission</b>؛ Network = <b>Enroutes the received data to distant application</b>؛ Application = <b>Provides Services + Semantic Analysis</b>.'],
traps:['الـ Perception layer هي الـ <b>physical layer</b> — بتحس وتجمع، مش بتقدّم الخدمة للمستخدم.','الـ handout بيذكر 5-layer و6-layer في السلايد 6 بس، ومفيش سلايد بيشرحهم تفصيلياً (شوف الملحوظة).'],
extra:['5-layer و6-layer مذكورين كأسماء بس في الـ handout بدون شرح. متذاكرش تفاصيل تانية ليهم من برا الـ handout للامتحان.'],
flag:['5-layer / 6-layer architectures: ذكر فقط (slide 6)، مفيش محتوى تفصيلي في الـ PDFs.'],
q:['Describe the three layers of the three-layer IoT architecture.','Perception: physical layer with sensors that gather environmental information/identify smart objects. Network: connects smart things, network devices and servers and transmits/processes sensor data. Application: delivers application-specific services such as smart homes, smart cities, smart health.']});

L('1-4','1.2.2 Seven-Layer IoT Architecture','Architecture الـ 7 layers',[[9,12]],{
simple:'الـ 7-layer model بيفصّل الرحلة من “الشيء” لحد “الناس والعمليات”: Things → Connectivity → Edge/Fog → Data Accumulation → Data Abstraction → Application → Collaboration & Processes.',
body:`<h3>الطبقات من تحت لفوق</h3>
${stk(['<b>7 · Collaboration and Processes Layer</b>','<b>6 · Application Layer</b>','<b>5 · Data Abstraction Layer</b>','<b>4 · Data Accumulation Layer</b>','<b>3 · Edge/Fog Layer</b>','<b>2 · Connectivity Layer</b>','<b>1 · Things Layer</b>'],'Seven-layer IoT architecture — slide 9 (numbering per slide 12 table: layers 4–7 are numbered there)')}
<h3>Layer 1 — Things Layer (slide 10)</h3>
<p>بتشمل <b>endpoint devices</b> بتاعة IoT: smart things وsmart mobile devices اللي بتبعت وتستقبل information. في الرسمة: <i>Data Generation</i> و<i>Data to Signal Conversion</i>.</p>
<h3>Layer 2 — Connectivity Layer (slide 10)</h3>
<p>مسؤولة عن <b>النقل في الوقت المناسب (in-time transmission)</b> للبيانات المرصودة داخل وبين الـ smart things بتاعة level 1 وعبر شبكات مختلفة. بعبارة تانية: <b>horizontal communication</b> بين smart things، و<b>switching/routing</b> و<b>secure data transmission</b> على مستويات الشبكة هي وظائفها الأساسية. (الرسمة بتذكر: Switching and Routing, Reliable Transmission, Protocol Translation.)</p>
<h3>Layer 3 — Edge/Fog Computing Layer (slide 11)</h3>
<p>مسؤولة عن تحويل <b>heterogeneous network data flows</b> لمعلومات مناسبة للتخزين والتحليل. بتبدأ <b>limited processing</b> على الداتا عند <b>edge of the network</b> وده المقصود بـ <b>Fog computing</b>. وظائفها: <b>data formatting, reduction, decoding, and evaluation</b>. (الرسمة: Data Filtration, Data Aggregation, Data Analysis, Packet Content Inspection.)</p>
<h3>Layers 4–7 (table on slide 12)</h3>
${tb(['IoT Reference Model Layer','Functions (as in the handout)'],[
['<b>Layer 4: Data accumulation layer</b>','Captures data and stores it so it is usable by applications when necessary. Converts <b>event-based data to query-based processing</b>.'],
['<b>Layer 5: Data abstraction layer</b>','Reconciles multiple data formats and ensures consistent semantics from various sources. Confirms that the data set is complete and consolidates data into one place or multiple data stores using virtualization.'],
['<b>Layer 6: Applications layer</b>','Interprets data using software applications. Applications may monitor, control, and provide reports based on the analysis of the data.'],
['<b>Layer 7: Collaboration and processes layer</b>','Consumes and shares the application information. Collaborating on and communicating IoT information often requires multiple steps, and it is what makes IoT useful. This layer can change business processes and delivers the benefits of IoT.']])}
<p>الرسمة (slide 9) بتكمّل: Data Accumulation = <i>Take Data from Network Packets, Store Data in Database</i>؛ Data Abstraction = <i>Combine Data from Sources, Application-oriented Creation of Schema/Views of Data</i>؛ Application = <i>Perform Analytics, Generate Reports</i>؛ Collaboration = <i>Consideration of People and Business Process</i>.</p>`,
defs:[['Fog computing','Limited processing of received data at the edge of the network (Edge/Fog Computing layer).'],['Data accumulation layer','Captures and stores data so it is usable by applications; converts event-based data to query-based processing.'],['Data abstraction layer','Reconciles multiple data formats, ensures consistent semantics, confirms completeness, and consolidates data using virtualization.']],
steps:['Things: الأجهزة بتولّد data وتحوّلها لـ signal.','Connectivity: switching/routing + نقل موثوق وآمن.','Edge/Fog: formatting, reduction, decoding, evaluation.','Accumulation: تخزين (event-based → query-based).','Abstraction: توحيد الـ formats والـ semantics.','Application: تفسير وتقارير ومراقبة وتحكم.','Collaboration: ناس وعمليات الأعمال.'],
scn:'مصنع: sensors الماكينات (Things) → switches (Connectivity) → gateway يفلتر ويجمّع القراءات (Edge/Fog) → database (Accumulation) → دمج مصادر مختلفة (Abstraction) → dashboard (Application) → قرارات صيانة بتغيّر الإجراءات (Collaboration).',
memo:['7 layers بالترتيب: <b>Things, Connectivity, Edge/Fog, Data Accumulation, Data Abstraction, Application, Collaboration & Processes</b>.','Edge/Fog functions: <b>formatting, reduction, decoding, evaluation</b>.','Layer 4: <b>event-based → query-based</b>. Layer 5: <b>virtualization</b>.'],
traps:['<b>Connectivity</b> ≠ Network layer في الـ 3-layer؛ هي Layer 2 بس وفيها switching/routing وprotocol translation.','<b>Fog</b> = معالجة محدودة عند الـ edge، مش المعالجة الكاملة بالـ cloud.','الجدول في slide 12 بيبدأ من Layer 4 لحد 7 بس؛ Layers 1–3 اتشرحت في slides 10–11.'],
typo:['الرسمة في slide 9 بتكتب “Data Generation” تحت Connectivity layer كمان (واحنا نقلناها زي ما هي). النص المكتوب (slide 10) بيحدد وظائف الـ Connectivity على إنها transmission وswitching/routing. محتاجة مراجعة بشرية.'],
flag:['Slide 9: نص الرسمة صغير ومنخفض الجودة؛ القوائم الفرعية داخل كل layer متقرأة بصعوبة. لو الامتحان بيسأل عن تفاصيل أدق، راجع الـ PDF الأصلي.'],
q:['Compare the Edge/Fog layer with the Data accumulation layer.','Edge/Fog layer converts heterogeneous network data flows into information suitable for storage and analysis through limited processing at the edge (formatting, reduction, decoding, evaluation). Data accumulation captures and stores the data so applications can use it, converting event-based data to query-based processing.']});

L('1-5','1.3 IoT System — End-to-End View and Example','نظام IoT كامل من الطرف للطرف',[[13,14]],{
simple:'أي IoT system هو سلسلة: Smart Thing → IoT Gateway → Internet/Intranet → Cloud → IoT Analytics → IoT App.',
body:`<h3>السلسلة الأساسية (slide 13)</h3>
${fig(`<svg viewBox="0 0 720 120" role="img" aria-label="IoT system pipeline"><g class="stext" font-size="12" text-anchor="middle"><rect x="4" y="30" width="96" height="50" rx="8" class="sw"/><text x="52" y="60">Smart Thing</text><rect x="124" y="30" width="96" height="50" rx="8" class="sw"/><text x="172" y="60">IoT Gateway</text><rect x="244" y="30" width="110" height="50" rx="8" class="sw"/><text x="299" y="60">Internet/Intranet</text><rect x="378" y="30" width="80" height="50" rx="8" class="sw"/><text x="418" y="60">Cloud</text><rect x="482" y="30" width="110" height="50" rx="8" class="sw"/><text x="537" y="60">IoT Analytics</text><rect x="616" y="30" width="96" height="50" rx="8" class="sw"/><text x="664" y="60">IoT App</text></g><g stroke="var(--cyan)" stroke-width="2"><path d="M100 55h22M220 55h22M354 55h22M458 55h22M592 55h22"/></g><text x="172" y="104" text-anchor="middle" class="smuted" font-size="11">Wi-Fi, Z-Wave, BLE, Zigbee…</text><text x="299" y="104" text-anchor="middle" class="smuted" font-size="11">LAN, WAN</text></svg>`,'IoT system chain — slide 13 (bottom figure). Connectivity between Smart Thing and Gateway: Wi-Fi, Z-Wave, BLE, Zigbee, …; between Gateway and Internet: LAN, WAN.')}
<p>الرسمة اللي فوقها في نفس السلايد بتوضح نفس الفكرة بصورة أوسع: <b>User</b> + <b>Smart Wearable</b> + <b>Smart Things</b> (فيها sensors) ← <b>Intermediary Communication and Processing Devices</b> ← <b>Cloud</b> ← <b>Real Time Processing</b> ← <b>Visualisation / Presentation / Recommendation</b>، و<b>Data Archive</b>. وعلامة الـ <b>Context Discovery</b> بتظهر في أكتر من مكان.</p>
<h3>Example — The Predix Cloud (slide 14)</h3>
<p>مثال تطبيقي (توربينة رياح): ${tb(['Block','المحتوى'],[['<b>CONNECTIVITY</b>','Predix Machine (software/analytics) + Enterprise Systems (External Data)'],['<b>CLOUD SERVICES</b>','Assets, Analytics, Data, Security, Operations — فوق Cloud Foundry — فوق Data Infrastructure = “The Predix Cloud”'],['<b>APPLICATIONS</b>','UI / Mobile Applications'],['<b>END-TO-END SECURITY</b>','بيغطي السلسلة كلها']])}</p>`,
defs:[['IoT system chain','Smart Thing → IoT Gateway → Internet/Intranet → Cloud → IoT Analytics → IoT App.']],
steps:['الـ Smart Thing بيحس ويجمع data.','الـ Gateway بيوصّله (Wi-Fi/Z-Wave/BLE/Zigbee).','الشبكة (LAN/WAN, Internet/Intranet) بتنقل.','الـ Cloud بيستقبل ويخزّن ويعالج.','الـ Analytics بيطلّع معلومات مفيدة.','الـ IoT App بيعرض للمستخدم أو يتحكم.'],
memo:['<b>Smart Thing → IoT Gateway → Internet/Intranet → Cloud → IoT Analytics → IoT App</b>.','Predix: Connectivity / Cloud Services / Applications + End-to-end security.'],
traps:['الـ Gateway بين الـ Smart Thing والـ Internet — مش بعد الـ Cloud.'],
flag:['Slide 13 (الرسمة العلوية) وslide 14: نصوص صغيرة؛ قرأنا العناوين الأساسية وبس.'],
q:['List, in order, the components of the IoT system chain shown in the handout.','Smart Thing → IoT Gateway → Internet/Intranet (LAN, WAN) → Cloud → IoT Analytics → IoT App.']});

L('1-6','1.3 The Smart Things','الأشياء الذكية',[[15,17]],{
simple:'Smart thing = أي شيء فيزيائي اتصنع ذكي، أو اتحط عليه tags/sensors إلكترونية. وبنحوّل أي شيء عادي لذكي بـ 7 خطوات.',
body:`<h3>التعريف (slide 15)</h3>
<p>الـ <b>smart thing</b> ممكن يكون أي physical object اتعمل إما كـ <b>manufactured artifact</b> أو بـ <b>وضع embedded electronic tags أو sensors</b> على أي physical thing غير ذكي. الرسمة: <b>Thing</b> + <b>Controller</b> + <b>Sensor</b> + <b>Actuator</b> + <b>Communicator</b>.</p>
<h3>خطوات تحويل الشيء لذكي (slide 16)</h3>
${ol(['<b>Integrate Sensors</b> — عشان يحس بالبيئة.','<b>Add a processor</b> — عشان يعالج.','<b>Provide Connectivity</b> — عشان يتواصل.','<b>Include an Actuator (Optional)</b> — عشان ينفّذ فعل؛ لاحظ إنه <u>اختياري</u>.','<b>Power the Device</b> — مصدر طاقة.','<b>Develop a User Interface</b> — واجهة للمستخدم.','<b>Utilize IoT Platforms</b> — منصات IoT.'])}
<h3>Smart thing capabilities (slide 17)</h3>
<p>هرم من 3 مستويات:</p>
${tb(['Level','Capabilities'],[['<b>Advanced Level</b> (القمة)','Self-aware, Self-management'],['<b>Enhanced Level</b> (الوسط)','Sensing/Actuating, Processing, Networking, Shielding, Logging'],['<b>Essential Level</b> (القاعدة)','Digital Identification, Retention, Communication, Energy Harvesting']])}`,
defs:[['Smart thing','Any physical object that is created either as a manufactured artifact or by placing embedded electronic tags or sensors on any non-smart physical thing.']],
steps:['Integrate Sensors','Add a processor','Provide Connectivity','Include an Actuator (Optional)','Power the Device','Develop a User Interface','Utilize IoT Platforms'],
scn:'زرع نبات عادي: ضيف soil-moisture sensor، microcontroller، Wi-Fi، pump كـ actuator (اختياري)، بطارية، app، ومنصة cloud = smart planter.',
memo:['<b>7 steps</b> — الـ Actuator هو الوحيد <b>Optional</b>.','Capabilities pyramid: Essential → Enhanced → Advanced (self-aware, self-management).','أجزاء الرسمة: Thing, Controller, Sensor, Actuator, Communicator.'],
traps:['الـ Essential level مفيهوش sensing؛ الـ Sensing/Actuating في الـ <b>Enhanced</b>.','Self-aware/Self-management = أعلى مستوى (Advanced).'],
q:['List the key steps to make an object smart and say which is optional.','Integrate sensors; add a processor; provide connectivity; include an actuator (optional); power the device; develop a user interface; utilize IoT platforms. The actuator is optional.']});

L('1-7','1.4 The IoT Gateway','الـ IoT Gateway',[[18,20]],{
simple:'الـ Gateway هو الوسيط بين الأجهزة والـ Cloud: بيترجم بين protocols مختلفة ويأمّن النظام.',
body:`<p><b>IoT gateway</b> ممكن يكون <b>dedicated physical device</b> أو <b>software</b> بيساعد على الاتصال بين الأجهزة والـ Cloud (slide 18).</p>
<h3>Functions (slide 19)</h3>
${ul(['بيعمل <b>translation</b> بين network protocols مختلفة لدعم <b>interoperability</b> بين smart things والأجهزة المتوصلة.','بيوفّر مستويات من <b>security</b> عن طريق <b>advanced encryption networks</b>.','بيحمي الـ IoT system من <b>unauthorized access</b> و<b>malicious attacks</b>.'])}
<h3>Hardware & Software (slide 20)</h3>
${ul(['<b>Hardware</b>: <b>MCUs (processors)</b> + <b>wireless connectivity modules</b> (Wi-Fi, ZigBee, Bluetooth, 2G/3G/4G, etc.).','<b>OS</b>: ممكن Linux و Android، لكن <b>RTOS is preferred</b>.','<b>Security</b> بتتنفذ على شكل <b>Crypto Authentication chips</b>.'])}`,
defs:[['IoT gateway','A dedicated physical device or software that assists connectivity between devices and the Cloud.']],
scn:'في بيت ذكي: حساسات ZigBee + لمبات BLE + راوتر Wi-Fi — الـ gateway بيفهم كل البروتوكولات دي ويبعتها للـ cloud بشكل موحد ومشفّر.',
memo:['3 وظائف: <b>protocol translation, security (encryption), protection from unauthorized access/attacks</b>.','OS: Linux/Android ممكن — <b>RTOS preferred</b>.','Security hardware: <b>Crypto Authentication chips</b>.'],
traps:['الـ preferred OS هو <b>RTOS</b> مش Linux/Android (دول ممكنين بس).'],
q:['What are the functions and hardware components of an IoT gateway?','Functions: translating different network protocols for interoperability, providing security through advanced encryption networks, and protecting against unauthorized access and malicious attacks. Hardware: MCUs and wireless connectivity modules (Wi-Fi, ZigBee, Bluetooth, 2G/3G/4G); RTOS is preferred; security via crypto-authentication chips.']});

L('1-8','1.5 Network Infrastructure & 1.6 IoT Cloud','البنية الشبكية والـ Cloud',[[21,22]],{
simple:'Network infrastructure هي الطريق اللي البيانات بتمشي عليه (switches, routers, gateways) من الـ smart things للـ Cloud. والـ Cloud فيها load balancers وapplication servers وdatabase servers.',
body:`<h3>1.5 Network Infrastructure (slide 21)</h3>
<p>الـ network infrastructure (يعني الـ Internet أو internet) بتتيح <b>processing وtransmission</b> للبيانات من الـ smart things للـ <b>IoT Cloud</b> عبر <b>أجهزة شبكة homo-/heterogeneous</b> (متجانسة وغير متجانسة)، زي: <b>switches, routers, and gateways</b>.</p>
<h3>1.6 IoT Cloud (slide 22)</h3>
<p>الرسمة “IoT cloud components” بتبيّن: ${ul(['<b>Load Balancers</b>','<b>Application Servers</b>','<b>Database Servers</b>','<b>Physical Servers in Virtual Resource Pool</b> — السيرفرات الفيزيائية تحت، وبتتجمّع كـ virtual resource pool تشغّل اللي فوقها.'])}</p>`,
defs:[['Network infrastructure','The Internet/internet that enables processing and transmission of data from smart things to the IoT Cloud through homo-/heterogeneous network devices such as switches, routers and gateways.']],
memo:['Network devices: <b>switches, routers, gateways</b>.','Cloud components: <b>Load Balancers, Application Servers, Database Servers, Physical Servers in a Virtual Resource Pool</b>.'],
flag:['Slide 22 رسمة بسيطة؛ الأسهم بين المكونات متوصفتش تفصيلياً.'],
q:['List the IoT cloud components shown in the handout.','Load balancers, application servers, database servers, and physical servers organised in a virtual resource pool.']});

L('1-9','1.7 IoT Analytics — Characteristics, Challenges and Tools','IoT Analytics',[[23,27]],{
simple:'IoT Analytics = تحويل data الـ IoT لتفسيرات مفيدة وتوقع اتجاهات. بتشارك الـ Big Data في أدواتها، بس ليها تحديات خاصة بالـ sensors.',
body:`<h3>التعريف والغرض (slide 23)</h3>
${ul(['IoT analytics هي عملية استخراج <b>interpretations مفيدة</b> من المعلومات من أجل <b>trend forecasting</b>.','الـ <b>predictive analysis</b> لبيانات الـ IoT Cloud ممكن تُستخدم لـ <b>preventive measures</b> ولـ <b>تحسين المنتجات والخدمات</b>.','فيه علاقة قوية بين IoT analytics وبين <b>BigData analytics</b> (غير علاقتها بالـ IoT Cloud).'])}
<h3>الخصائص — الـ Vs (slide 24)</h3>
${tb(['V','المعنى في IoT'],[['<b>Volume</b>','حجم بيانات الـ sensors أكبر من إنه يتخزن في databases تقليدية.'],['<b>Variety</b>','تنوع في الـ semantic والـ format من أنواع sensors مختلفة.'],['<b>Velocity</b>','تجميع بيانات IoT بتردد عالي (high-frequency).'],['<b>Veracity</b>','<b>منخفضة</b> لأن لازم نشيل الـ noise من البيانات المجمعة.']])}
<h3>التحديات (slides 25–26)</h3>
<p>أدوات BigData (databases, data warehouses, data mining) غالباً تنفع في IoT analytics، لكن ليها تحديات خاصة:</p>
${ul(['Acquiring of IoT data through sensors','Dealing with <b>heterogeneous</b> and <b>real-time</b> nature of sensed data','Refinement/elimination of <b>noise</b> on sensed heterogeneous data','<b>Spatiotemporal dependencies</b> of IoT data streams','<b>Biasedness</b> of IoT data demands pre-processing','<b>Security/privacy</b> requirements necessitate pre-processing of personal data'])}
<p>الرسمة (slide 26): دايرة BigData (Volume, Variety, Velocity, Veracity) + جنبها: Heterogeneous Data Collection, Noise Existence, Real-time Data, Spatio-temporal Dependencies, Biasedness of IoT Data, Security/Privacy.</p>
<h3>IoT Analytics Tools (slide 27)</h3>
${tb(['Level','Items'],[['<b>Tools</b>','Apache Hadoop, Apache Spark, H2O, Elasticsearch, Freeboard, KNIME, Apache Flink, Kibana, Tableau Public'],['<b>Techniques</b>','Batch Processing, Stream Processing, Machine Learning, Data Visualization'],['<b>Disciplines</b>','Artificial Intelligence, BigData, Data Mining, Database Management, Computer Graphics']])}`,
defs:[['IoT analytics','The process of obtaining useful interpretations of information for trend forecasting.'],['Veracity (IoT context)','Low, because noise must be removed from the collected IoT data.']],
memo:['4 Vs: <b>Volume, Variety, Velocity, Veracity (low — noise)</b>.','6 challenges: acquiring through sensors, heterogeneous+real-time, noise, spatiotemporal dependencies, biasedness, security/privacy.','Tools: Hadoop, Spark, H2O, Elasticsearch, Freeboard, KNIME, Flink, Kibana, Tableau Public.'],
traps:['Veracity في IoT = <b>low</b> (محتاجة noise removal)، مش high.','Velocity = <b>high-frequency</b> collection مش “سرعة الإنترنت”.'],
q:['Explain the four Vs of IoT analytics as described in the handout and list three unique challenges.','Volume: sensor data too large for conventional databases. Variety: different semantics/formats from different sensors. Velocity: high-frequency data collection. Veracity: low since noise must be removed. Challenges: heterogeneous/real-time data, noise, spatiotemporal dependencies, biasedness, security/privacy pre-processing.']});

/* ===================== CHAPTER 2 ===================== */
L('2-1','2.1 Introduction & 2.2 Infrastructure Protocols — The Three Types of IoT Protocols','أنواع بروتوكولات IoT',[[1,4]],{
simple:'بروتوكولات IoT بتتقسم 3 أنواع: Infrastructure (الأساس)، Service Discovery، Application. الفصل ده كله عن النوع الأول: Infrastructure Protocols.',
body:`<p>الـ IoT systems بتتكون من <b>hardware و software components</b> بتساعد في <b>processing, storage, and analysis</b> للبيانات اللي جاية من smart things. وناس/مجموعات مختلفة اقترحت عدد من الـ IoT protocols <b>لمساعدة application programmers و service providers</b> (slide 2).</p>
<h3>الأنواع التلاتة (slide 3)</h3>
${fig(`<svg viewBox="0 0 640 330" role="img" aria-label="Protocol layers figure"><g class="stext" font-size="13" text-anchor="middle"><rect x="10" y="10" width="620" height="70" rx="8" class="sw"/><text x="320" y="30" font-weight="700">Application Layer Protocols</text><text x="320" y="62">AMQP · XMPP · MQTT · CoAP</text><rect x="10" y="90" width="620" height="60" rx="8" class="sw"/><text x="320" y="110" font-weight="700">Service Discovery Protocols</text><text x="320" y="136">mDNS · DNS-SD</text><rect x="10" y="160" width="620" height="160" rx="8" class="sw" stroke="var(--cyan)"/><text x="320" y="180" font-weight="700">Infrastructure Layer Protocols</text><rect x="60" y="190" width="520" height="50" rx="8" class="sw"/><text x="320" y="208" font-size="12" font-weight="700">Network/Routing Layer Protocols</text><text x="320" y="230">6LoWPAN · RPL</text><rect x="60" y="248" width="520" height="62" rx="8" class="sw"/><text x="320" y="264" font-size="12" font-weight="700">Physical/Link Layer Protocols</text><text x="320" y="282">IEEE 802.15.4 · IEEE 802.11ah · ZigBee</text><text x="320" y="302">EPCglobal · Z-Wave · LTE-A · BLE</text></g></svg>`,'Protocol categories — slide 3 (same figure appears as slide 2 of Chapter 3).')}
<h3>2.2 Infrastructure Protocols (slide 4)</h3>
<p>الـ protocols في الـ layer دي بتتقسم لـ: ${ul(['<b>Physical/Link Layer Protocols</b>','<b>Link Layer Protocols</b>','<b>Network/Routing Layer Protocols</b>'])}</p>
<p>والبروتوكولات اللي بتنفّذ وظائف الـ <b>Physical/Link</b> مع بعض هي:</p>
${ul(['<b>IEEE 802.15.4</b>','<b>IEEE 802.11ah</b>','<b>Bluetooth Low Energy (BLE)</b>','<b>Zonal Intercommunication Global-standard (ZigBee)</b> — زي ما مكتوب في السلايد'])}
<p>وفي الرسمة: <b>6LoWPAN</b> و<b>RPL</b> تحت Network/Routing، وكمان <b>EPCglobal, Z-Wave, LTE-A</b> في الـ Physical/Link (من غير شرح في الـ handout).</p>`,
defs:[['Infrastructure protocols','The lowest group of IoT protocols, comprising Physical/Link layer protocols (e.g., IEEE 802.15.4, IEEE 802.11ah, ZigBee, BLE, EPCglobal, Z-Wave, LTE-A) and Network/Routing layer protocols (6LoWPAN, RPL).']],
memo:['3 أنواع: <b>Infrastructure, Service Discovery, Application</b>.','Network/Routing: <b>6LoWPAN, RPL</b>.','Physical/Link: <b>IEEE 802.15.4, IEEE 802.11ah, ZigBee, EPCglobal, Z-Wave, LTE-A, BLE</b>.','Application: <b>AMQP, XMPP, MQTT, CoAP</b> · Service Discovery: <b>mDNS, DNS-SD</b>.'],
traps:['Bluetooth (classic) مش مذكور في رسمة الـ categories، لكن BLE ذكرت. الـ handout بيشرح Classic Bluetooth برضه في 2.3.','RPL و EPCglobal و Z-Wave و LTE-A ظاهرين في الرسمة بس — الـ handout ما بيشرحهمش.'],
extra:['حرف الـ ZigBee اتكتب في السلايد “Zonal Intercommunication Global-standard” — احنا محافظين على النص زي ما هو.'],
typo:['السلايد 4 بيعدّد “Physical/Link Layer Protocols” و“Link Layer Protocols” كنوعين منفصلين، بينما الرسمة (slide 3) فيها Physical/Link فقط تحت Infrastructure. احفظ الاتنين زي ما الدكتورة كتبت.'],
q:['Classify IoT protocols into three types and give examples of each from the figure.','Infrastructure (6LoWPAN, RPL, IEEE 802.15.4, IEEE 802.11ah, ZigBee, EPCglobal, Z-Wave, LTE-A, BLE); Service Discovery (mDNS, DNS-SD); Application (AMQP, XMPP, MQTT, CoAP).']});

L('2-2','2.3 Bluetooth — Overview and Radio Spectrum','Bluetooth: النظرة العامة والترددات',[[5,6]],{
simple:'Bluetooth تقنية لاسلكية قصيرة المدى للصوت والداتا، رخيصة وقليلة الطاقة، ومش لازم “line of sight”. بتشتغل في نطاق 2.4 GHz وعندها 79 قناة.',
body:`<h3>الخصائص العامة (slide 5)</h3>
${ul(['<b>Wireless technology for short-range voice and data communication</b>.','<b>Low-cost and low-power</b>.','بتوفّر منصة اتصال بين مجموعة واسعة من الأجهزة “الذكية” (smart devices).','<b>مش محدودة بـ “line of sight”</b> — يعني مش لازم الجهازين يشوفوا بعض.'])}
<h3>الـ Spectrum (slide 6)</h3>
${tb(['الخاصية','القيمة'],[['الـ band','<b>2.4 GHz ISM band</b> spread'],['Radio spectrum range','<b>2400 – 2483.5 MHz</b>'],['عدد الـ RF channels','<b>79</b>'],['Channel 0','<b>2402 MHz</b>'],['Channel 78','<b>2480 MHz</b>'],['من الرسمة','عرض الـ band = <b>83.5 MHz</b> و كل channel = <b>1 MHz</b>']])}
<p>تحقق بالحساب: القنوات من 0 لـ 78 = 79 قناة، و 2402 + 78×1 = 2480 MHz ✔ (ده تأكيد حسابي مبني على الأرقام المكتوبة).</p>`,
defs:[['Bluetooth','A wireless technology for short-range voice and data communication; low-cost and low-power; not limited to line-of-sight communication.']],
memo:['<b>2.4 GHz ISM</b> · <b>2400–2483.5 MHz</b> · <b>79 channels</b> · <b>ch0 = 2402 MHz</b> · <b>ch78 = 2480 MHz</b> · 1 MHz per channel · total 83.5 MHz.'],
traps:['Bluetooth classic = <b>79</b> channels؛ BLE = <b>40</b> channels (وعرض كل channel 2 MHz). متخلطش بينهم.','Bluetooth مش محتاجة line of sight.'],
flag:[],
q:['State the frequency band, number of channels and the first/last channel frequencies of Bluetooth.','2.4 GHz ISM band (2400–2483.5 MHz); 79 RF channels; channel 0 = 2402 MHz and channel 78 = 2480 MHz.']});
L('2-3','2.3.1 Bluetooth Architecture — Piconet and Scatternet','Piconet و Scatternet',[[7,9]],{
simple:'Piconet = شبكة صغيرة فيها master واحد و slaves لحد 7. Scatternet = لما أكتر من piconet يتربطوا ببعض عن طريق bridge node.',
body:`<p>Bluetooth بتعرّف <b>نوعين من الشبكات</b>: <b>Piconet</b> و <b>Scatternet</b> (slide 7).</p>
<h3>Piconet (slide 8)</h3>
${ul(['شبكة Bluetooth <b>صغيرة ad-hoc</b> فيها جهاز واحد متحدد كـ <b>master</b> وبيتحكم في الاتصال.','بتتكون من <b>one master (primary)</b> و <b>up to seven active slave (secondary)</b> devices.','الـ master بينسّق الاتصال عن طريق <b>polling the slaves</b>، والـ slaves <b>بتتواصل مباشرة مع الـ master بس، مش مع بعض</b>.','هي <b>building block</b> الأساسي للاتصال قصير المدى، زي توصيل phone بـ headset.'])}
<h3>Scatternet (slide 9)</h3>
${ul(['<b>Multi-hop network</b> بتجمّع عدة piconets منفصلة.','بتتكوّن باستخدام <b>“bridge” nodes</b> بتشتغل كـ <b>master و/أو slave</b> في piconets مختلفة، فتقدر تنقل data بين الشبكات المترابطة.','الـ bridge nodes بتتيح تبادل data بين الـ piconets على أساس <b>time-division</b>، فالأجهزة تبعت رسائل عبر piconets من خلال <b>سلسلة bridges</b>.'])}
${fig(`<svg viewBox="0 0 640 260" role="img" aria-label="Scatternet figure"><ellipse cx="200" cy="130" rx="190" ry="110" fill="none" stroke="var(--line)" stroke-dasharray="5"/><ellipse cx="440" cy="130" rx="190" ry="110" fill="none" stroke="var(--line)" stroke-dasharray="5"/><g class="stext" font-size="13" text-anchor="middle"><circle cx="150" cy="130" r="18" fill="var(--bad)"/><text x="150" y="135" fill="#fff" font-weight="700">M</text><circle cx="490" cy="130" r="18" fill="var(--bad)"/><text x="490" y="135" fill="#fff" font-weight="700">M</text><g fill="var(--good)"><circle cx="90" cy="70" r="14"/><circle cx="200" cy="55" r="14"/><circle cx="60" cy="140" r="14"/><circle cx="110" cy="200" r="14"/><circle cx="220" cy="190" r="14"/><circle cx="545" cy="60" r="14"/><circle cx="590" cy="120" r="14"/><circle cx="580" cy="180" r="14"/><circle cx="500" cy="210" r="14"/></g><circle cx="320" cy="130" r="16" fill="var(--good)" stroke="var(--warn)" stroke-width="3"/><text x="320" y="100" fill="var(--warn)">Bridge (S)</text><text x="110" y="248" class="smuted">Piconet 1</text><text x="530" y="248" class="smuted">Piconet 2</text></g><g stroke="var(--muted)"><path d="M150 130L90 70M150 130L200 55M150 130L60 140M150 130L110 200M150 130L220 190M150 130L320 130M490 130L320 130M490 130L545 60M490 130L590 120M490 130L580 180M490 130L500 210"/></g></svg>`,'Scatternet = two piconets linked by a bridge slave — redrawn from slide 7 (simplified).')}
<p>جرّب الـ interactive في <a href="#/lab/piconet">Visual Lab → Piconet vs Scatternet</a>.</p>`,
defs:[['Piconet','A small, ad-hoc Bluetooth network with one master (primary) device and up to seven active slave (secondary) devices; the master coordinates by polling and slaves communicate only with the master.'],['Scatternet','A multi-hop network that combines several individual piconets using bridge nodes that act as master and/or slave in different piconets, exchanging data on a time-division basis.']],
steps:['اختار master للـ piconet.','الـ master يـ polls الـ slaves بالدور.','الـ slaves بتكلم الـ master بس.','لو عايز تربط piconets: bridge node بيبقى عضو في الاتنين.','الـ bridge بينقل data بين الـ piconets بالـ time-division.'],
scn:'موبايلك (master) + headset + smartwatch (slaves) = piconet. لو الـ smartwatch كمان بيتوصّل بجهاز تاني له master مختلف، الـ watch بيبقى bridge → scatternet.',
memo:['Piconet = <b>1 master + up to 7 active slaves</b>.','Slaves <b>لا تتواصل مع بعض مباشرة</b>.','Scatternet = <b>multi-hop</b> + <b>bridge nodes</b> (master and/or slave).'],
traps:['الـ slaves مش بتتكلم مع بعض مباشرة — دايماً عن طريق الـ master.','Scatternet مش “piconet كبير”؛ هي عدة piconets مربوطة بـ bridge.','الرقم <b>7</b> هو <i>active</i> slaves.'],
q:['Differentiate between a piconet and a scatternet.','A piconet has one master and up to seven active slaves; the master polls and slaves communicate only with it. A scatternet is a multi-hop network combining several piconets via bridge nodes that act as master and/or slave in different piconets and relay data on a time-division basis.']});

L('2-4','2.3.2 Bluetooth TDMA (TDD-TDMA)','Bluetooth TDMA',[[10,11]],{
simple:'Bluetooth بتقسّم الوقت لـ slots كل واحد 625 μs: الـ master بياخد الـ even slots والـ slave بياخد الـ odd slots — وبكده بيتبادلوا الإرسال (half-duplex).',
body:`${ul(['Bluetooth بتستخدم نوع من الـ TDMA اسمه <b>TDD-TDMA</b> (time-division duplex TDMA).','الوقت متقسم لـ <b>slots مدة كل واحد 625 μs</b>.','الـ <b>master</b> بيستخدم الـ <b>even-numbered slots</b> (0, 2, 4, …).','الـ <b>slave(s)</b> بتستخدم الـ <b>odd-numbered slots</b> (1, 3, 5, …).','TDD-TDMA بتسمح للـ primary والـ secondary يتواصلوا في <b>half-duplex mode</b>.'])}
<h3>الرسمتين في slide 11</h3>
${ul(['<b>Single secondary</b>: Primary بيبعت في f0 ثم Secondary يرد في f1، Primary في f2، Secondary في f3. كل slot على <b>تردد (hop)</b> مختلف: f0, f1, f2, f3.','<b>Two secondaries</b>: Primary بيبعت (f0) → Secondary 1 يرد (f1) → Primary (f2) → Secondary 2 يرد (f3). يعني الـ master بيتبادل مع slave مختلف في كل دورة، والـ slaves بتستخدم odd slots.'])}
<p>جرّب الـ timeline في <a href="#/lab/tdma">Visual Lab → TDMA</a>.</p>`,
defs:[['TDD-TDMA','Time-division duplex TDMA: time is divided into 625 μs slots; the master transmits in even-numbered slots and the slave(s) in odd-numbered slots, giving half-duplex communication.']],
steps:['Slot 0: master يبعت (f0).','Slot 1: slave يرد (f1).','Slot 2: master يبعت (f2).','Slot 3: slave (نفس الـ slave أو غيره) يرد (f3).'],
scn:'phone (master) بيبعت packet للـ headset في slot 0 والـ headset يرد في slot 1؛ كل slot بتردد مختلف عشان يتجنب التداخل.',
memo:['<b>625 μs</b> per slot · master = <b>even</b> · slave = <b>odd</b> · <b>half-duplex</b> · اسم النظام <b>TDD-TDMA</b>.'],
traps:['الرقم الصح <b>625 μs</b> (ميكروثانية) — مش milli.'],
typo:['الرسمة في slide 11 مكتوب عليها “625 ms” و“366 ms” (ملّي ثانية)، بينما النص في slide 10 مكتوب “625 μs”. الأرجح إنه خطأ في وحدة الرسمة. المطلوب في الإجابة: <b>625 μs</b> زي النص. (الـ 366 مكتوبة في الرسمة كمان — بدون شرح في النص.)'],
q:['Explain how TDD-TDMA allows half-duplex communication in Bluetooth.','Time is divided into 625 μs slots. The master transmits in even-numbered slots (0, 2, 4, …) and the slave(s) transmit in odd-numbered slots (1, 3, 5, …), so the two sides alternate, giving half-duplex communication.']});

L('2-5','2.3.3 Bluetooth Layers — Controller Stack and Host Stack','طبقات Bluetooth',[[12,15]],{
simple:'الـ Bluetooth stack نصين: Controller stack (الراديو والرابط) و Host stack (البروتوكولات الأعلى). والـ HCI هو الجسر بينهم.',
body:`<p>الرسمة (slide 12) بتبيّن الـ stack: فوق <b>Applications</b> (Audio Apps, Management Apps, Phone Apps, Networking Apps, vCard)، وتحتها: <b>Audio, Control, SDP, TCS, AT, BNEP, OBEX, RFCOMM, L2CAP</b>، وبعدين <b>HCI</b>، وبعده <b>Link Manager → Baseband → Radio</b>.</p>
${stk(['Apps: Audio · Management · Phone · Networking · vCard','Host stack: SDP · TCS · AT · BNEP · OBEX · RFCOMM · L2CAP (+ Audio/Control)','— HCI (Host Controller Interface) —','Link Manager (LMP)','Baseband','Radio'],'Bluetooth layers — slide 12 (summarised)')}
<h3>Controller stack (slides 13–14) — بيدير الاتصال الفيزيائي ومستوى الـ link</h3>
${tb(['Layer','Function (الـ handout)'],[
['<b>Radio</b>','بيتعامل مع <b>إرسال واستقبال الموجات الراديو</b>، شاملاً <b>frequency hopping</b> و <b>modulation</b>.'],
['<b>Baseband</b>','بيعرّف <b>packet formats, timing, power control</b>، و<b>addressing scheme</b> للأجهزة.'],
['<b>Link Manager Protocol (LMP)</b>','بيدير الـ <b>connection-oriented (SCO)</b> و <b>connection-less (ACL)</b> links، ومهامه: <b>establishing, maintaining, terminating</b> connections.'],
['<b>Host Controller Interface (HCI)</b>','<b>interface موحّد</b> بيسمح للـ <b>Host</b> يتواصل مع الـ <b>Controller</b> بإرسال commands واستقبال events.']])}
<p><b>SCO</b> = connection-oriented لـ <b>audio and video</b>. <b>ACL</b> = connection-less لـ <b>data</b> (slide 14).</p>
<h3>Host stack (slide 15) — بيتعامل مع بروتوكولات وخدمات أعلى</h3>
${tb(['Layer','Function'],[
['<b>L2CAP</b> — Logical Link Control and Adaptation Protocol','“قلب” الـ stack. بتغلّف data الطبقات العليا في صيغ مناسبة للطبقات الأدنى، وبتسمح بـ <b>multiplexing</b> و <b>segmentation</b>.'],
['<b>SDP</b> — Service Discovery Protocol','بتخلّي جهاز Bluetooth يكتشف <b>الخدمات</b> (زي audio streaming, file transfer) اللي بيقدمها جهاز Bluetooth تاني.'],
['<b>RFCOMM</b> — Radio Frequency Communication','بتوفّر <b>serial port emulation</b>، وغالباً بتُستخدم لاستبدال الوصلات السلكية التسلسلية.']])}`,
defs:[['Controller stack','Manages the physical and link-level communication: Radio, Baseband, and Link Manager Protocol.'],['Host stack','Handles higher-level data protocols and services: L2CAP, SDP and RFCOMM.'],['HCI','A standardized interface that enables the Host to communicate with the Controller, sending commands and receiving events.'],['SCO / ACL','SCO: connection-oriented link for audio and video. ACL: connection-less link for data.']],
memo:['Controller: <b>Radio, Baseband, LMP</b> (+ HCI interface). Host: <b>L2CAP, SDP, RFCOMM</b>.','<b>SCO = audio/video (connection-oriented)</b> · <b>ACL = data (connection-less)</b>.','L2CAP = <b>heart of the stack</b> (multiplexing + segmentation).','RFCOMM = <b>serial port emulation</b>.'],
traps:['SCO/ACL: <b>SCO</b> للصوت والفيديو، و<b>ACL</b> للداتا — متعكسش.','Frequency hopping و modulation في <b>Radio</b>، أما packet formats و timing في <b>Baseband</b>.','SDP هنا = <b>Service Discovery Protocol</b> الخاص بـ Bluetooth، مش ليه علاقة بـ DNS-SD في Chapter 3.'],
flag:['Slide 12: بعض مربعات الرسمة (TCS, AT, BNEP, OBEX, Audio, Control) ظاهرة كأسماء بس وبدون شرح في الـ handout.'],
q:['Distinguish between the Controller stack and Host stack in Bluetooth and name their components.','Controller stack handles physical and link-level communication: Radio (transmission/reception, frequency hopping, modulation), Baseband (packet formats, timing, power control, addressing) and Link Manager Protocol (SCO/ACL links, establishing/maintaining/terminating). Host stack handles higher-level protocols/services: L2CAP, SDP, RFCOMM. HCI lets the Host talk to the Controller.']});

L('2-6','2.3.4 Bluetooth — Advantages & Disadvantages','مميزات وعيوب Bluetooth',[[16,16]],{
simple:'Bluetooth قوية في throughput والتوافق، لكن بتستهلك طاقة أكتر ومداها أقصر وlatency أعلى.',
body:`${tb(['Advantages','Disadvantages'],[['It supports <b>high data throughput</b>.','<b>High Power Consumption</b>'],['It supports <b>different network topologies</b>.','<b>Limited Connectivity</b>'],['<b>Broad Device Compatibility</b>.','<b>Shorter Range</b>'],['','<b>Higher Latency</b>']])}
<p>السلايد بيعدّد العناصر دي كعناوين بس (بدون تفاصيل أكتر). وده بيربط مع BLE في الجزء الجاي: BLE اتصممت أصلاً لتقليل استهلاك الطاقة.</p>`,
defs:[['Bluetooth advantages','High data throughput, support for different network topologies, broad device compatibility.'],['Bluetooth disadvantages','High power consumption, limited connectivity, shorter range, higher latency.']],
memo:['3 مميزات: <b>throughput, topologies, compatibility</b>.','4 عيوب: <b>power, connectivity, range, latency</b>.'],
traps:['“High power consumption” عيب لـ Classic Bluetooth؛ BLE عكسه (ultra-low power).'],
extra:['الـ handout بيذكر العناوين بس. اربط “Limited Connectivity” بحدود الـ piconet (7 active slaves) كفهم شخصي — مش منصوص في السلايد.'],
q:['List the advantages and disadvantages of Bluetooth.','Advantages: high data throughput, supports different network topologies, broad device compatibility. Disadvantages: high power consumption, limited connectivity, shorter range, higher latency.']});

L('2-7','2.4 Bluetooth Low Energy (BLE) — Overview and Channels','BLE: النظرة العامة والقنوات',[[17,18]],{
simple:'BLE نسخة موفّرة للطاقة جداً من Bluetooth: بتعمل اتصالات قصيرة لنقل packets صغيرة، وتشتغل شهور على coin-cell battery.',
body:`<h3>التعريف (slide 17)</h3>
${ul(['<b>Wireless personal area network technology</b>.','مصممة لـ <b>ultra-low power consumption</b> فالأجهزة بتشتغل فترات طويلة على <b>standard coin-cell batteries</b>.','مثالية لـ <b>health monitors, fitness trackers, and sensors</b>.','بتعمل <b>اتصالات قصيرة</b> لنقل <b>small data packets</b> وفيها مزايا للـ <b>security</b> وتوسيع <b>communication range</b>.'])}
<h3>القنوات (slide 18)</h3>
${tb(['الخاصية','القيمة'],[['الـ band','<b>2.4 GHz ISM</b> (Industrial, Scientific, and Medical)'],['عدد القنوات','<b>40 channels</b>، عرض كل channel = <b>2 MHz</b>'],['Advertising channels','<b>3 channels: 37, 38, 39</b> — لاكتشاف الأجهزة وبدء الاتصال (device discovery and connection initiation)'],['Data channels','<b>37 channels: 0 through 36</b> — لنقل الداتا أثناء الاتصال']])}
<p>تحقق: 3 + 37 = 40 ✔. الرسمة بتلوّن الـ advertising channels بالأحمر (على الأطراف وفي المنتصف تقريباً) والـ data channels بالأخضر.</p>`,
defs:[['Bluetooth Low Energy (BLE)','A wireless personal area network technology designed for ultra-low power consumption, enabling devices to run for long periods on standard coin-cell batteries; creates short connections to transfer small data packets.']],
memo:['<b>40 channels × 2 MHz</b> · advertising = <b>37, 38, 39</b> · data = <b>0–36</b>.','Use cases: health monitors, fitness trackers, sensors.'],
traps:['BLE: <b>40</b> channels (3 adv + 37 data). Classic: <b>79</b> channels. عرض القناة: BLE <b>2 MHz</b> vs Classic <b>1 MHz</b> (الرقم 1 MHz من رسمة Classic).','القنوات الإعلانية هي 37 و 38 و 39 — مش 0 و 1 و 2.'],
q:['Describe BLE channel allocation.','BLE uses the 2.4 GHz ISM band with 40 channels each 2 MHz wide. Channels 37, 38, 39 are advertising channels (device discovery/connection initiation); channels 0–36 (37 channels) carry data during a connection.']});

L('2-8','2.4.1 BLE Flowchart — The Link-Layer States','حالات BLE (State flowchart)',[[19,20]],{
simple:'جهاز BLE بيتنقل بين حالات: Standby في النص، وحواليه Advertising / Scanning / Initiating، وفي الآخر بيتكوّن الـ connection (Slave=Advertiser، Master=Initiator).',
body:`<h3>الرسمة (slide 19)</h3>
<p><b>Standby</b> في المركز. من Standby وإليها بتتحرك الأسهم لـ <b>Advertising</b> و<b>Scanning</b> و<b>Initiating</b>. من <b>Advertising</b> بتروح لـ <b>Connecting</b> بصفة <b>Slave (Advertiser)</b>، ومن <b>Initiating</b> بتروح لـ <b>Connecting</b> بصفة <b>Master (Initiator)</b>، وبعدها بترجع لـ Standby.</p>
<h3>الحالات (slide 20)</h3>
${tb(['State','المعنى'],[
['<b>Advertising</b>','الأجهزة <b>بتبعت advertising packets</b> على الـ advertising channels.'],
['<b>Scanning</b>','الأجهزة <b>بتستقبل advertising packets بدون نية</b> تكوين connection.'],
['<b>Initiating</b>','الجهاز <b>ناوي يكوّن connection</b> ردّاً على advertising packets الداخلة.'],
['<b>Standby</b>','الأجهزة <b>غير متصلة</b> (unconnected).'],
['<b>Connected</b>','اتكوّن connection بين الـ <b>advertiser (slave)</b> والـ <b>initiator (master)</b>. الـ master يُعتبر الـ <b>central device</b> والـ slave هو الـ <b>peripheral device</b>.']])}
<p>جرّب الـ state machine في <a href="#/lab/ble">Visual Lab → BLE States</a>.</p>`,
