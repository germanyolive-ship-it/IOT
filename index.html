${ul(['الـ <b>NON</b> <b>مش بتحتاج Acknowledge</b> من الـ server.','رغم إنها <b>unreliable</b>، <b>ليها unique ID</b>.','هي رسائل <b>مش فيها معلومات حرجة</b> لازم توصل للـ server.','منها الرسائل اللي فيها <b>قيم مقروءة من sensors</b>.'])}
<p>الرسمة: Client → Server: <b>NON (ID: 0xAA51)</b>.</p>
<p>جرّب في <a href="#/lab/coap">Visual Lab → CoAP</a>.</p>`,
defs:[['Confirmable (CON)','A reliable CoAP message that is sent again and again until the other party sends an acknowledgment (ACK) containing the same message ID.'],['Non-confirmable (NON)','An unreliable CoAP message that does not require an acknowledgment but still has a unique ID; suited to messages with non-critical information such as sensor readings.'],['Reset (RST)','Sent by the server instead of an ACK when it has trouble managing the incoming request.']],
steps:['CON: Client → CON(ID) → Server.','Server → ACK(same ID).','لو في مشكلة: Server → RST بدل ACK.','NON: Client → NON(ID) بدون ACK.'],
scn:'CON: أمر “افتح الباب” لازم يوصل. NON: قراءة حرارة كل ثانية — لو واحدة ضاعت الجاية هتغطي.',
memo:['<b>CON</b> = reliable, resent until <b>ACK</b> with the <b>same ID</b>.','<b>RST</b> بدل ACK لو السيرفر مش قادر يتعامل مع الطلب.','<b>NON</b> = unreliable, no ACK, <b>unique ID</b> برضه.'],
traps:['NON بردو ليها ID — بس مفيش ACK.','الـ ACK بياخد <b>نفس message ID</b> بتاع الـ CON.'],
typo:['السلايد 35 بيكتب “Rest message (RST)” — المقصود <b>Reset</b> (slide 32 بيسميها Reset). محفوظة زي ما هي.'],
q:['Contrast CON and NON messages in CoAP and state when RST is sent.','CON is reliable: it is resent until an ACK with the same ID arrives. NON is unreliable and needs no acknowledgment although it has a unique ID — used for non-critical data such as sensor values. RST is sent instead of an ACK when the server has trouble handling the request.']});

L('3-14','3.3.2 CoAP — Request/Response: Immediate and Delayed Answers, Token vs Message ID','CoAP: Request/Response و Token',[[38,43]],{
simple:'الـ request بيتبعت CON أو NON. لو السيرفر يقدر يرد فوراً: الرد بيجي جوه الـ ACK. لو مش قادر: يبعت ACK فاضي الأول وبعدين CON جديد فيه الرد. والـ Token هو اللي بيربط الـ request بالـ response.',
body:`<p>الـ <b>Request/Response</b> هو <b>الـ layer التانية</b> في CoAP. الـ request بيتبعت باستخدام <b>CON أو NON</b>. فيه سيناريوهات حسب إذا كان السيرفر يقدر يرد فوراً أو الرد مش متاح (slide 38).</p>
<h3>السيناريو 1 — رد فوري (slides 39–40)</h3>
<p>لو السيرفر يقدر يرد فوراً وكان الـ request محمول على <b>CON</b>، السيرفر يبعت <b>ACK يحتوي الـ response أو error code</b>.</p>
${tb(['#','الرسالة','أين'],[['1','<b>CON (ID: 0xAA51)</b> — GET /Pressure — <b>Token 0x14</b>','Client → Server'],['2','<b>ACK (ID: 0xAA51)</b> — 1000 hPa — <b>Token 0x14</b>','Server → Client']])}
<p>الـ <b>Token</b> مختلف عن الـ <b>Message ID</b> و<b>بيُستخدم لمطابقة الـ request مع الـ response</b>.</p>
<h3>السيناريو 2 — رد متأخر (slides 41–42)</h3>
${ol(['السيرفر مش قادر يرد فوراً → يبعت <b>ACK مع empty response</b>.','أول ما الرد يبقى متاح، السيرفر يبعت <b>CON جديد</b> للـ client فيه الـ response.','عندها الـ client يبعت <b>ACK</b>.'])}
${tb(['#','الرسالة','أين'],[['1','<b>CON (ID: 0xAA51)</b> — GET /Pressure — <b>Token 0x14</b>','Client → Server'],['2','<b>ACK (ID: 0xAA51)</b> (empty)','Server → Client'],['3','<b>CON (ID: 0xAA52)</b> — 1000 hPa — <b>Token 0x14</b>','Server → Client'],['4','<b>ACK (ID: 0xAA52)</b>','Client → Server']])}
<p>لاحظ: الـ <b>Message ID اتغيّر</b> (0xAA51 → 0xAA52) لأن الـ CON التاني رسالة جديدة، لكن الـ <b>Token فضل 0x14</b> عشان الـ client يربط الرد بالطلب الأصلي.</p>
<h3>السيناريو 3 — NON (slide 43)</h3>
<p>لو الـ request محمول على <b>NON-confirmable message</b>، السيرفر يرد باستخدام <b>NON-confirmable message</b> كمان.</p>
<p>جرّب في <a href="#/lab/coap">Visual Lab → CoAP</a>.</p>`,
defs:[['CoAP Token','A value different from the Message ID, used to match a request with its response.'],['CoAP immediate response','When the server can answer immediately to a CON request, it replies with an ACK containing the response or error code.'],['CoAP delayed response','When the server cannot answer immediately it sends an ACK with an empty response, then a new CON message with the response when available, to which the client replies with an ACK.']],
steps:['الـ client يبعت CON GET /Pressure مع Token.','لو الرد جاهز: ACK فيه 1000 hPa + نفس الـ Token.','لو لأ: ACK فاضي (نفس ID).','لما الرد يجهز: السيرفر يبعت CON جديد (ID مختلف) فيه الرد + نفس الـ Token.','الـ client يرد ACK على الـ ID الجديد.'],
scn:'GET /Pressure: لو قراءة الضغط جاهزة → الرد في الـ ACK. لو الحساس بياخد وقت → ACK فاضي الأول ثم CON فيه 1000 hPa لاحقاً.',
memo:['رد فوري: <b>ACK carries the response</b>. رد متأخر: <b>empty ACK → new CON with response → client ACK</b>.','<b>Token</b> ≠ <b>Message ID</b>: Token = request↔response matching.','NON request → NON response.','مثال الـ handout: <b>GET /Pressure</b>, <b>Token 0x14</b>, <b>1000 hPa</b>, IDs <b>0xAA51 / 0xAA52</b>.'],
traps:['الـ <b>Token ثابت</b> في السيناريو المتأخر لكن الـ <b>Message ID يتغير</b> مع الـ CON الجديد.','الـ ACK الفاضي بيأكد الاستلام بس — مش الرد.','الـ request ممكن CON أو NON.'],
q:['Explain the separate (delayed) response in CoAP and the role of the Token.','If the server cannot answer immediately it replies to the CON request with an empty ACK; once the response is available it sends a new CON message containing the response (new message ID), and the client replies with an ACK. The Token (different from the Message ID) is used to match the request with its response.']});

L('3-15','3.3.3 MQTT vs CoAP — The Comparison Table','مقارنة MQTT و CoAP',[[44,44]],{
simple:'MQTT = TCP + publish/subscribe + broker topic + port 1883. CoAP = UDP + request/response + URI + port 5683.',
body:`${tb(['','MQTT','CoAP'],[
['<b>Transport Layer</b>','TCP','UDP'],
['<b>Reliability</b>','3 Levels of Quality of Service','Confirmable, Non-confirmable, Acknowledgement, Reset'],
['<b>Protection Message</b>','SSL/TLS UTF-8','DTLS 3072-bit RSA'],
['<b>Architecture</b>','Publish-Subscribe','Request-Response'],
['<b>Sorting Data Store</b>','Broker Topic','Universal Resource Identifier (URI)'],
['<b>Port Used</b>','1883','5683']])}
<p>الجدول بالنص زي ما هو مكتوب في الـ handout (slide 44). ربط الجدول بالشرح:</p>
${ul(['<b>Transport</b>: MQTT على TCP (lossless/ordered/bidirectional)، وCoAP على UDP (طبقة Messages بتتعامل مع UDP).','<b>Reliability</b>: MQTT = QoS 0/1/2؛ CoAP = أنواع الرسايل CON/NON/ACK/RST.','<b>Architecture</b>: MQTT = clients + broker (pub/sub)؛ CoAP = request/response شبه HTTP.','<b>Data store/addressing</b>: MQTT بالـ broker topic؛ CoAP بالـ URI.','<b>Ports</b>: MQTT <b>1883</b>؛ CoAP <b>5683</b> (و mDNS <b>5353</b> UDP — متخلطش).'])}
<p>جرّب المقارنة side-by-side في <a href="#/compare">Comparison Center</a>.</p>`,
defs:[['MQTT vs CoAP (slide 44)','MQTT: TCP, 3 QoS levels, SSL/TLS UTF-8, publish-subscribe, broker topic, port 1883. CoAP: UDP, confirmable/non-confirmable/acknowledgement/reset, DTLS 3072-bit RSA, request-response, URI, port 5683.']],
memo:['MQTT: <b>TCP · QoS 0/1/2 · SSL/TLS · Pub-Sub · Broker Topic · 1883</b>.','CoAP: <b>UDP · CON/NON/ACK/RST · DTLS · Request-Response · URI · 5683</b>.'],
traps:['<b>1883</b> = MQTT، <b>5683</b> = CoAP، <b>5353</b> = mDNS. ثلاث أرقام مختلفة.','Reliability في MQTT = <b>QoS</b>؛ في CoAP = <b>message types</b>.'],
typo:['خانة الـ Protection بتقول “SSL/TLS UTF-8” لـ MQTT و“DTLS 3072-bit RSA” لـ CoAP — مكتوبة زي الجدول بالضبط. “UTF-8” في الأصل ترميز نصوص مش مرتبط بالـ SSL/TLS، فاعتبر الصياغة كما هي في الـ handout وراجع الدكتورة لو الامتحان بيسأل عنها.'],
q:['Fill in a comparison between MQTT and CoAP across transport, reliability, architecture, data store and port.','Transport: TCP vs UDP. Reliability: 3 QoS levels vs confirmable, non-confirmable, acknowledgement, reset. Protection: SSL/TLS UTF-8 vs DTLS 3072-bit RSA. Architecture: publish-subscribe vs request-response. Data store: broker topic vs URI. Port: 1883 vs 5683.']});

WR('2-3','m','Differentiate between a piconet and a scatternet, and explain the role of bridge nodes.','A piconet is a small ad-hoc network with one master and up to seven active slaves; the master polls and slaves talk only to the master. A scatternet is a multi-hop network combining several piconets; bridge nodes act as master and/or slave in different piconets and relay data between them on a time-division basis.',['Piconet: 1 master + up to 7 active slaves (1)','Master polls; slaves talk only to master (1)','Scatternet = multi-hop, several piconets (1)','Bridge nodes master/slave in different piconets, time-division relay (1)']);
WR('2-8','m','Explain the BLE states and the master/slave roles.','Advertising: send advertising packets. Scanning: receive them without intent to connect. Initiating: intends to connect in response to advertising packets. Standby: unconnected. Connected: connection between advertiser (slave/peripheral) and initiator (master/central).',['Names five states (2)','Distinguishes scanning from initiating (1)','Advertiser=slave/peripheral, initiator=master/central (1)']);
WR('2-13','h','Explain how RAW works in 802.11ah and list its benefits.','AP groups STAs into RAW periods, each divided into equal slots; STAs are split into subgroups assigned to slots; only the assigned subgroup contends in its slot while others stay dormant. RAW parameters (start time, duration, number of slots) are sent in beacons (PRAW periodic). Benefits: reduced collisions, lower contention overhead, energy efficiency, improved performance.',['Grouping + slotting + subgroups (1)','Access control: only assigned subgroup contends (1)','Beacon announcement/PRAW (1)','Four benefits (1)']);
WR('2-18','h','Compare IEEE 802.15.4 and IEEE 802.11ah (any six features).','802.15.4: WSN; 2.4 GHz and sub-1 GHz; ~100 m; 250 Kbps; CSMA/CA; sleep-wake; FFD relay; smart environment monitoring/agriculture. 802.11ah: WSN and backhaul; sub-1 GHz; ~1000 m; 78 Mbps; RAW; TIM/DTIM/TWT; AP relay; smart city/smart home.',['Six correct feature pairs (1 each)']);
WR('2-22','m','Explain AODV route discovery in ZigBee and the routing-table contents.','Source broadcasts RREQ when route unknown; destination or intermediate node with a route replies with RREP; routes stored in routing tables; RERR for maintenance. Table: destination address (16-bit), next hop, route status, route cost.',['RREQ broadcast (1)','RREP from destination/intermediate (1)','RERR maintenance (1)','Four table fields (1)']);
WR('2-27','m','Explain 6LoWPAN neighbour discovery and the three mobility types.','Sleepy devices cannot be assumed on, so a device registers with the router using RS, RA, NR, NC instead of broadcast. Micro-mobility: within same IP domain, prefix unchanged. Macro-mobility: between IP domains, IP changes. Network mobility: whole 6LoWPAN moves, edge router attachment changes.',['Why ND differs (1)','RS-RA-NR-NC (1)','Micro and macro (1)','Network mobility (1)']);
WR('3-4','m','Explain mDNS and DNS-SD and how they work together.','mDNS resolves hostnames on a local network without a central server by multicast query/reply, updating mDNS caches. DNS-SD searches by service name over mDNS, returning hostnames, IPs and ports; the client then connects using the service protocol and port.',['mDNS multicast, no server (1)','Cache update (1)','DNS-SD service search (1)','Connect using protocol/port (1)']);
WR('3-5','e','State the mDNS specifications.','IPv4 224.0.0.51 or IPv6 ff02::fb; UDP; port 5353; only hostnames ending with .local are resolved.',['Addresses (1)','UDP/5353 (1)','.local restriction (1)']);
WR('3-9','m','Compare MQTT QoS 0, 1 and 2.','QoS 0 at most once, no ack, no guarantee. QoS 1 at least once, PUBACK, sender stores and may resend so duplicates are possible, at least 2 messages. QoS 2 exactly once, PUBLISH/PUBREC/PUBREL/PUBCOMP, at least 4 messages, slowest and most expensive.',['QoS 0 (1)','QoS 1 incl. PUBACK/duplicates (1)','QoS 2 four-step (1)','Cost ordering (1)']);
WR('3-8','m','Describe the MQTT connection lifecycle and keep-alive.','CONNECT with keep-alive; CONNACK; connection stays until DISCONNECT or no messages for 1.5 × keep-alive; empty PINGREQ at regular intervals keeps it alive (PINGRESP replies).',['CONNECT/CONNACK (1)','1.5× rule (1)','PINGREQ (1)','DISCONNECT (1)']);
WR('3-14','h','Describe CoAP immediate vs delayed responses and the role of the Token.','Immediate: ACK carries the response or error code. Delayed: server sends empty ACK, then a new CON with the response (new message ID), client ACKs. Token (different from Message ID) matches request with response. NON request → NON response.',['Immediate (1)','Delayed sequence (2)','Token role (1)']);
WR('3-15','m','Compare MQTT and CoAP.','Transport TCP/UDP; reliability 3 QoS levels vs CON/NON/ACK/RST; protection SSL/TLS vs DTLS; architecture pub-sub vs request-response; data store broker topic vs URI; port 1883 vs 5683.',['Six rows (1 each, max 4 marks)']);
WR('1-4','h','Describe the seven-layer IoT architecture from bottom to top with one function each.','1 Things (endpoint devices); 2 Connectivity (in-time transmission, switching/routing, secure transmission); 3 Edge/Fog (limited processing: formatting, reduction, decoding, evaluation); 4 Data accumulation (store, event→query-based); 5 Data abstraction (reconcile formats/semantics, virtualization); 6 Application (interpret, monitor, control, reports); 7 Collaboration & processes (share info, change business processes).',['Correct order (2)','Functions for at least five layers (2)']);
WR('1-9','m','Explain the 4 Vs of IoT analytics and three unique challenges.','Volume, Variety, Velocity, Veracity (low, noise); challenges e.g. heterogeneous real-time data, noise, spatiotemporal dependencies, biasedness, security/privacy.',['4 Vs (2)','Three challenges (2)']);
WR('0-5','e','Explain “connect the unconnected” and the three visions of IoT.','Connect objects not yet on a network so they can communicate with people and objects; IoT is the convergence of Things-oriented, Internet-oriented and Semantic-oriented visions.',['Connect the unconnected (1)','Three visions (2)']);

/* ===== quiz engine ===== */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const x=a[i];a[i]=a[j];a[j]=x}return a}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const ZC={scope:'all',kinds:{mcq:1,tf:1,fb:1},n:20,mode:'practice'};
let Z=null,ztimer=null;

const nf=s=>String(s).toLowerCase().replace(/[\s,]/g,'');
function isOK(q,a){if(a===undefined||a==='')return false;if(q.k==='mcq')return a===0;if(q.k==='tf')return a===q.a;return q.a.some(x=>nf(x)===nf(a))}
function correctText(q){if(q.k==='mcq')return q.o[0];if(q.k==='tf')return q.o[q.a];return q.a[0]}
function ansText(q,a){if(a===undefined||a==='')return '— (no answer)';if(q.k==='mcq'||q.k==='tf')return q.o[a];return a}
function ordFor(q){if(q.k==='mcq'){if(!Z.ord[q.id])Z.ord[q.id]=shuffle([0,1,2,3],rng(hashStr(q.id)+Z.seed));return Z.ord[q.id]}return [0,1]}
function startQuiz(ids){
 const seed=S.seed++;save();const r=rng(seed);let pool;
 if(ids)pool=Qs.filter(q=>ids.indexOf(q.id)>-1);

 else{pool=Qs.filter(q=>q.k!=='wr'&&ZC.kinds[q.k]);if(ZC.scope==='weak')pool=pool.filter(q=>S.qstat[q.id]&&S.qstat[q.id].last===0);else if(ZC.scope!=='all')pool=pool.filter(q=>qCh(q)===+ZC.scope);pool=shuffle(pool,r);if(ZC.n!=='all')pool=pool.slice(0,ZC.n)}
 if(!pool.length){toast('مفيش أسئلة بالاختيارات دي');return}
 const mode=ids?'retry':ZC.mode;
 Z={qs:pool,i:0,ans:{},rev:{},flag:{},ord:{},seed,mode,start:Date.now(),limit:mode==='mock'?45*60:0,done:false};

}

function finishQuiz(){if(!Z||Z.done)return;Z.done=true;clearInterval(ztimer);Z.end=Date.now();let sc=0;const bych={},byt={};
 Z.qs.forEach(q=>{const ok=isOK(q,Z.ans[q.id]);if(ok)sc++;const ch=qCh(q);bych[ch]=bych[ch]||[0,0];bych[ch][1]++;if(ok)bych[ch][0]++;byt[q.t]=byt[q.t]||[0,0];byt[q.t][1]++;if(ok)byt[q.t][0]++;const st=S.qstat[q.id]||{c:0,w:0};if(ok)st.c++;else st.w++;st.last=ok?1:0;S.qstat[q.id]=st});
 Z.score=sc;Z.bych=bych;Z.byt=byt;S.quiz.unshift({ts:Date.now(),mode:Z.mode,n:Z.qs.length,score:sc});S.quiz=S.quiz.slice(0,30);addRecent('quiz','Quiz '+sc+'/'+Z.qs.length+' ('+Z.mode+')','#/quiz/result');save();location.hash='#/quiz/result'}

/* ===== RTL / BiDi fix ===== */
const AR_RE=/[؀-ۿݐ-ݿ]/;
const LAT_SRC="[(\\[]?[A-Za-z0-9][A-Za-z0-9_\\-.\\/+#%:'’@=<>&*°μ×→⟶←⇄≥≤~,;()\\[\\] ]*";
const BIDI_SKIP='script,style,svg,code,textarea,input,.ltr,.lt,.qtext,.opt,.ans,.stk,.box.def,[dir=ltr],.timer,.stat,.tnum,.ttl h2,.fig figcaption';
const BLOCK_SKIP='.ltr,.box.def,.ans,.qtext,.opt,.stk';

function splitRun(m){
  const cnt=(s,c)=>s.split(c).length-1;
  let a=0,b=m.length,core;
  while(b>a&&!/[A-Za-z0-9)\]%+#°]/.test(m[b-1]))b--;
  core=m.slice(a,b);
  while(core.endsWith(')')&&cnt(core,')')>cnt(core,'(')){b--;core=m.slice(a,b)}
  while(core.endsWith(']')&&cnt(core,']')>cnt(core,'[')){b--;core=m.slice(a,b)}
  while(core[0]==='('&&cnt(core,'(')>cnt(core,')')){a++;core=m.slice(a,b)}
  while(core[0]==='['&&cnt(core,'[')>cnt(core,']')){a++;core=m.slice(a,b)}
  return [m.slice(0,a),core,m.slice(b)];
}

function fixBidi(root){
  if(!root)return;
  root.querySelectorAll('p,li,td,th,h3,.bt,.stepnote,summary').forEach(e=>{
    if(e.closest(BLOCK_SKIP)||e.hasAttribute('dir'))return;
    e.setAttribute('dir',AR_RE.test(e.textContent)?'rtl':'ltr');
  });
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  const cache=new Map();
  const isRtl=el=>{if(!cache.has(el))cache.set(el,getComputedStyle(el).direction==='rtl');return cache.get(el)};
  nodes.forEach(n=>{
    const p=n.parentElement;
    if(!p||p.closest(BIDI_SKIP)||!isRtl(p))return;
    const s=n.nodeValue,re=new RegExp(LAT_SRC,'g');
    let last=0,m,frag=null;
    while((m=re.exec(s))){
      const [lead,core]=splitRun(m[0]);
      if(!/[A-Za-z]/.test(core))continue;
      frag=frag||document.createDocumentFragment();
      const st=m.index+lead.length;
      frag.append(s.slice(last,st));
      const sp=document.createElement('span');
      sp.className='lt';sp.textContent=core;
      frag.append(sp);
      last=st+core.length;
      re.lastIndex=last;
    }
    if(frag){frag.append(s.slice(last));n.replaceWith(frag)}
  });
}
