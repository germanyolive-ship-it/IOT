defs:[['Advertising state','Devices transmit advertising packets on advertising channels.'],['Scanning state','Devices receive advertising packets without any intention of setting up a connection.'],['Initiating state','A device intends to set up a connection in response to incoming advertising packets.'],['Connected state','A connection is set up between the advertiser (slave) and the initiator (master); the master is the central device, the slave the peripheral device.']],
steps:['الجهاز في Standby (مش متصل).','لو عايز يتعلن: ينتقل لـ Advertising ويبعت packets.','جهاز تاني في Scanning يسمع الإعلانات.','لو عايز يتصل: ينتقل لـ Initiating.','يتكوّن الاتصال: Advertiser = slave/peripheral، Initiator = master/central.'],
scn:'fitness tracker بيعمل advertising، والموبايل بيعمل scanning ثم initiating → بيتوصلوا: الموبايل central (master) والـ tracker peripheral (slave).',
memo:['5 states: <b>Advertising, Scanning, Initiating, Standby, Connected</b>.','Advertiser = <b>slave = peripheral</b> · Initiator = <b>master = central</b>.','Scanning = يسمع <b>بدون نية</b> اتصال.'],
traps:['<b>Scanning ≠ Initiating</b>: الأول بيسمع بس، التاني ناوي يتصل.','الـ master = <b>Initiator</b> (مش الـ advertiser).'],
typo:['الرسمة بتكتب الحالة “Connecting” بينما النص بيسميها “Connected state”. نفس الحالة — استخدم “Connected” في الإجابة.'],
q:['Explain the BLE states and the roles of master and slave.','Advertising: transmit advertising packets. Scanning: receive them without intending to connect. Initiating: intends to connect in response to advertising packets. Standby: unconnected. Connected: connection between advertiser (slave/peripheral) and initiator (master/central).']});

L('2-9','2.4.2 BLE Architecture & 2.4.3 BLE Security','أوضاع BLE والأمان',[[21,22]],{
simple:'BLE بتشتغل Dual Mode (BLE + Classic مع بعض) أو Single Mode (واحد بس). والتهديدات الأساسية: eavesdropping و man-in-the-middle، وBLE عندها طريقتين تقللهم.',
body:`<h3>Operating modes (slide 21)</h3>
${tb(['Mode','المعنى'],[['<b>Dual Mode</b>','BLE و Classic Bluetooth يشتغلوا <b>مع بعض بانسجام</b> في الـ physical layer.'],['<b>Single Mode</b>','<b>واحد منهم بس</b> يقدر يشتغل.']])}
<p>الاختيار بينهم <b>بيعتمد بالكامل على الـ application</b> المطلوب.</p>
<h3>Security (slide 22)</h3>
<p>أهم أنواع الهجمات اللي BLE و Classic Bluetooth معرّضين لها: <b>eavesdropping</b> و <b>man-in-the-middle attacks</b>. وBLE فيها ميزتين لتقليل المخاطر:</p>
${tb(['Feature','الشرح'],[['<b>Numeric comparison</b>','جهازين الطرفين <b>بيولّدوا قيمة رقمية</b> بتتأكد <b>يدوياً (manually validated)</b> لما تظهر على الجهازين.'],['<b>Passkey Entry</b>','الجهاز <b>غير المبادر (non-initiating)</b> بيولّد <b>random seed اسمه nonce</b> لتوثيق (authenticate) الاتصال.']])}`,
defs:[['Dual mode','Both BLE and Classic Bluetooth can work in harmony in the physical layer.'],['Single mode','Only one of BLE or Classic Bluetooth can operate.'],['Numeric comparison','Two end devices generate a numerical value that is manually validated once displayed on both devices.'],['Passkey entry','The non-initiating device generates a random seed called a nonce to authenticate the connection.']],
memo:['Modes: <b>Dual</b> (both) vs <b>Single</b> (one) — حسب الـ application.','Attacks: <b>eavesdropping + man-in-the-middle</b>.','Features: <b>Numeric comparison</b> (manual validation) · <b>Passkey entry</b> (non-initiating device generates a <b>nonce</b>).'],
traps:['الـ nonce بيتولّد من الجهاز <b>non-initiating</b> مش الـ initiator.','Numeric comparison بيتم <b>manual validation</b> للرقم المعروض على الجهازين.'],
q:['What attacks threaten BLE/Classic Bluetooth, and which BLE features reduce the risk?','Eavesdropping and man-in-the-middle attacks. BLE offers numeric comparison (two devices generate a number that is manually validated when displayed on both) and passkey entry (the non-initiating device generates a random seed called a nonce to authenticate the connection).']});

L('2-10','2.5 IEEE 802.11 ah — The IEEE 802 Family and Wi-Fi Generations','عائلة IEEE 802 وأجيال Wi-Fi',[[23,24]],{
simple:'قبل 802.11ah لازم نعرف مكانها: IEEE عندها لجنة 802 فيها مجموعات (Ethernet, WLAN, WPAN...)، وWi-Fi اتطوّر عبر أجيال بسرعات وترددات مختلفة.',
body:`<h3>IEEE 802 LMSC (slide 23)</h3>
<p>الرسمة: <b>IEEE 802 LMSC (LAN and MAN Standard Committee)</b> وتحتها:</p>
${tb(['Standard','الاسم/المجال'],[['IEEE 802.2','LLC'],['IEEE 802.3','Ethernet'],['IEEE 802.11','WLANs'],['<b>IEEE 802.15</b>','<b>WPANs</b>'],['IEEE 802.16','Broadband wireless access'],['IEEE 802.20','Mobile broadband wireless access']])}
<p>وتحت <b>802.15 (WPANs)</b>: 802.15.1 (WPAN/Bluetooth)، 802.15.2 (Coexistence)، 802.15.3 (High-rate WPANs)، <b>802.15.4 (Low-rate WPANs)</b>، 802.15.5 (Mesh networking)، 802.15.6 (BANs). وتحت 802.15.4: 802.15.4a (WPAN Low-rate alternative PHY) و 802.15.4b (Enhancements and clarifications).</p>
<h3>جدول أجيال Wi-Fi (slide 24)</h3>
${tb(['Gen','IEEE standard','Adopted','Link rate (Mbit/s)','2.4 GHz','5 GHz','6 GHz'],[
['—','802.11','1997','1–2','✓','',''],['—','802.11b','1999','1–11','✓','',''],['—','802.11a','1999','6–54','','✓',''],['—','802.11g','2003','6–54','✓','',''],
['Wi-Fi 4','802.11n','2009','6.5–600','✓','✓',''],['Wi-Fi 5','802.11ac','2013','6.5–6,933','','✓',''],['Wi-Fi 6','802.11ax','2021','0.4–9,608','✓','✓',''],['Wi-Fi 6E','802.11ax','2021','0.4–9,608','✓','✓','✓'],['Wi-Fi 7','802.11be','2024','0.4–23,059','✓','✓','✓'],['Wi-Fi 8','802.11bn','—','0.4–23,059','✓','✓','✓']])}`,
defs:[['IEEE 802.15','The IEEE 802 group for Wireless Personal Area Networks (WPANs).'],['IEEE 802.15.4','Low-rate WPANs (LR-WPAN).']],
memo:['802.11 = WLANs · 802.15 = WPANs · 802.3 = Ethernet · 802.15.4 = Low-rate WPAN · 802.15.1 = Bluetooth.','802.11a: 5 GHz فقط. 802.11b/g: 2.4 GHz فقط. 802.11n: 2.4 + 5. 802.11ac: 5 فقط. Wi-Fi 6E أضاف 6 GHz.'],
traps:['802.11ac = <b>5 GHz فقط</b>.','802.11a و 802.11b نفس سنة 1999 لكن ترددات مختلفة (5 GHz vs 2.4 GHz).'],
flag:['Slide 23: نصوص الرسمة صغيرة؛ الأسماء اللي فوق مقروءة، والتفاصيل التحتية (4a/4b) مقروءة بصعوبة.'],
extra:['السلايدين دول مجرد خلفية (لجنة 802 وأجيال Wi-Fi) قبل شرح 802.11ah. الجدول فيه Wi-Fi 8 / 802.11bn بدون adopt year في الرسمة.'],
q:['Where do 802.11 and 802.15.4 sit within the IEEE 802 family?','IEEE 802 LMSC (LAN/MAN Standard Committee) contains 802.11 (WLANs) and 802.15 (WPANs); 802.15.4 is the low-rate WPAN standard under 802.15.']});

L('2-11','2.5 Are 802.11 Protocols Suitable for IoT? — Pros, Cons & WSN Examples','هل 802.11 مناسبة لـ IoT؟',[[25,26]],{
simple:'Wi-Fi العادي سريع وواسع ومعروف، لكن بياكل طاقة وموارده كبيرة. عشان كده اتعمل 802.11ah للـ IoT.',
body:`${tb(['Advantages of 802.11','Disadvantages of 802.11'],[['<b>High data rates</b>','<b>High power consumption</b>'],['<b>Wide coverage</b>','<b>Resource constraints</b>'],['<b>Easy implementation</b>','<b>Unique traffic patterns</b>']])}
<h3>أمثلة 802.11 standards في WSNs (slide 26)</h3>
${tb(['Standard','دوره'],[
['<b>802.11ah</b>','مصمم لـ <b>low-power, long-range communication</b> في IoT، وأنسب لـ WSNs من باقي Wi-Fi standards.'],
['<b>802.11ax</b>','بعض تطبيقات WSN (زي <b>indoor localization</b>) بتستخدم 802.11ax لتحقيق دقة عالية عبر خوارزميات محسّنة و test benches متخصصة.'],
['<b>802.11bf</b>','معيار أحدث بيتطور خصيصاً لـ <b>Wi-Fi sensing</b>: استخدام الموجات الراديو لاكتشاف الحركات الدقيقة، ينفع في WSNs لتطبيقات زي <b>occupancy monitoring</b> أو <b>elderly care</b>.']])}`,
defs:[['Wi-Fi sensing (802.11bf)','Using radio waves to detect fine movements, applicable in WSNs for occupancy monitoring or elderly care.']],
memo:['3 pros: <b>high data rates, wide coverage, easy implementation</b> · 3 cons: <b>high power, resource constraints, unique traffic patterns</b>.','<b>ah</b> = low-power long-range · <b>ax</b> = indoor localization · <b>bf</b> = Wi-Fi sensing.'],
traps:['802.11ah هو الأنسب لـ WSN؛ 802.11bf للـ <b>sensing</b> مش للاتصال طويل المدى.'],
q:['Why are conventional 802.11 protocols not ideal for IoT, and which 802.11 variants are used in WSNs?','Despite high data rates, wide coverage and easy implementation, they suffer high power consumption, resource constraints and unique IoT traffic patterns. WSN variants: 802.11ah (low-power long-range), 802.11ax (e.g., indoor localization), 802.11bf (Wi-Fi sensing).']});

L('2-12','2.5 IEEE 802.11ah (Wi-Fi HaLow) — Key Characteristics','802.11ah: الخصائص الأساسية',[[27,29]],{
simple:'802.11ah = Wi-Fi HaLow: Wi-Fi بتردد أقل من 1 GHz، يمشي لحد 1 كم، يخترق الحيطان، ويكلّم آلاف الأجهزة بطاقة قليلة.',
body:`<p><b>802.11ah (Wi-Fi HaLow)</b> هو Wi-Fi standard متصمم لـ <b>low power</b> و <b>extended range applications</b>، أساساً لـ IoT.</p>
${tb(['Characteristic','التفصيل (من الـ handout)'],[
['<b>Frequency band</b>','يشتغل في <b>unlicensed sub-1 GHz band</b> زي <b>900 MHz</b> أو <b>860 MHz</b>.'],
['<b>Range</b>','تغطية ممتدة لحد <b>1 km</b>، مقارنة بـ <b>أقل من 200 m</b> للـ Wi-Fi التقليدي.'],
['<b>Penetration</b>','التردد الأقل بيدّي <b>اختراق أفضل للحيطان</b> وحول العوائق.'],
['<b>Power consumption</b>','مصمم لـ <b>low energy consumption</b> — مناسب للـ battery-powered IoT devices.'],
['<b>Data rate</b>','من <b>150 kbps</b> لحد <b>346 Mbps</b>. المعدلات الأقل للاتصال بعيد المدى والموفّر للطاقة.'],
['<b>Device density</b>','يدعم عدد كبير من الأجهزة لكل access point، لحد <b>8,191 stations</b>.'],
['<b>Traffic management</b>','بيستخدم <b>Restricted Access Window (RAW)</b> لإدارة traffic آلاف الأجهزة ومنع الـ collisions.'],
['<b>Power-saving strategies</b>','بيدعم استراتيجيات متطورة زي <b>Target Wake Time (TWT)</b>.'],
['<b>Channel bandwidth</b>','قنوات أضيق: <b>1, 2, 4, 8, 16 MHz</b> لتحقيق المدى الطويل والطاقة المنخفضة. (الرسمة: من <b>902 MHz إلى 928 MHz</b>.)'],
['<b>Use cases</b>','<b>machine-to-machine communication, smart metering, environmental monitoring, industrial automation, large-scale IoT deployments</b>.']])}`,
defs:[['IEEE 802.11ah (Wi-Fi HaLow)','A Wi-Fi standard designed for low-power and extended-range applications, primarily IoT, operating in the unlicensed sub-1 GHz band.']],
memo:['sub-1 GHz (900 / 860 MHz) · <b>up to 1 km</b> vs <200 m · <b>150 kbps – 346 Mbps</b> · <b>8,191 stations</b> · RAW · TWT · BW <b>1/2/4/8/16 MHz</b>.'],
traps:['802.11ah بتشتغل <b>sub-1 GHz</b> مش 2.4/5 GHz.','الأقصى <b>8,191</b> stations (مش 8,192).','الـ data rate المكتوب في الجدول المقارن (slide 44) مختلف (78 Mbps) — شوف topic 2-18.'],
typo:['Slide 28 بيكتب “150 kbps to 346 Mbps” بينما جدول slide 44 بيكتب “78 Mbps”. الرقمين اتحفظوا زي ما هما — اذكر مصدر كل رقم لو اتسألت.'],
flag:['رسمة slide 29 (قنوات 1–16 MHz بين 902 و 928 MHz) مقروءة؛ عدد القنوات الدقيق في كل عرض مش مكتوب كنص.'],
q:['List the key characteristics of 802.11ah.','Unlicensed sub-1 GHz band (900/860 MHz); range up to 1 km vs <200 m; better wall penetration; low power; data rate 150 kbps–346 Mbps; up to 8,191 stations per AP; RAW for traffic management; TWT for power saving; 1/2/4/8/16 MHz channels; M2M, smart metering, monitoring, industrial automation.']});

L('2-13','2.5 802.11ah — Restricted Access Window (RAW)','آلية RAW',[[30,33]],{
simple:'RAW بتقسّم الأجهزة لمجموعات وslots؛ كل مجموعة تتنافس على القناة في slot خاص بيها، وباقي الأجهزة تنام. النتيجة: collisions أقل وطاقة أوفر.',
body:`<p>الـ <b>Restricted Access Window (RAW)</b> بتدير الوصول للقناة في الشبكات اللاسلكية <b>الكثيفة (dense)</b>، خاصة IoT (slide 30). الرسمة: beacon بيحمل <b>RPS</b>، وبعده RAW A, RAW B, RAW C, RAW D؛ و<b>Station X assigned to RAW C</b>، و RAW C مقسّم لـ <b>slot 0, slot 1, … slot i … slot N<sub>RAW</sub>−1</b>.</p>
<h3>كيف بتشتغل (slides 31–32)</h3>
${ol(['<b>Grouping</b>: الـ AP بيعيّن <b>مجموعة من STAs</b> لفترة RAW محددة.','<b>Slotting</b>: كل RAW period بتتقسم لـ <b>time slots متساوية المدة</b>.','<b>Subgroup Assignment</b>: مجموعة الـ STAs بتتقسم لـ <b>subgroups</b> وكل subgroup بتتخصص لـ RAW slot معين.','<b>Access Control</b>: خلال الـ slot المخصصة، الـ STAs في الـ subgroup دي <b>مسموح لها تتنافس وتبعت data</b>. باقي STAs <b>ممنوعة من الوصول للقناة وبتفضل dormant</b>.','<b>Information broadcast</b>: الـ AP بيعلن بارامترات الـ RAW (<b>start time, duration, number of slots</b>) عبر <b>beacons</b>. ولتقليل الـ overhead ممكن يتعمل بشكل دوري: <b>Periodic RAW (PRAW)</b>.','<b>Sleep mode</b>: الأجهزة اللي مش مخصصة للـ RAW group أو slot الحالي بتدخل <b>low-power sleep</b> لحد ما يجي دورها.'])}
<h3>Benefits of using RAW (slide 33)</h3>
${ul(['<b>Reduced Collisions</b>','<b>Lower Contention Overhead</b>','<b>Energy Efficiency</b>','<b>Improved Performance</b>'])}
<p>السلايد بيذكر الفوائد الأربعة كعناوين بس (من غير شرح).</p>`,
defs:[['Restricted Access Window (RAW)','A mechanism in 802.11ah that manages channel access in dense wireless networks by assigning groups of stations to RAW periods divided into equal-duration slots, with subgroups contending only in their assigned slot while others sleep.'],['PRAW','Periodic RAW — periodic advertisement of RAW parameters to minimize overhead.']],
steps:['Grouping','Slotting','Subgroup assignment','Access control','Information broadcast via beacons (PRAW optional)','Sleep mode for non-assigned devices'],
scn:'عدّادات مياه ذكية (آلاف): بدل ما كلهم يحاولوا يبعتوا مرة واحدة ويحصل collisions، الـ AP بيوزّعهم على RAW slots؛ كل عداد بيصحى في slot بتاعه ويبعت وينام.',
memo:['6 مراحل: <b>Grouping → Slotting → Subgroup → Access Control → Info broadcast (beacons, PRAW) → Sleep</b>.','البارامترات المعلنة: <b>start time, duration, number of slots</b>.','4 benefits: <b>Reduced Collisions, Lower Contention Overhead, Energy Efficiency, Improved Performance</b>.'],
traps:['الـ slots <b>متساوية المدة</b> (equal duration).','الأجهزة خارج الـ slot بتكون <b>dormant/asleep</b>، مش بتتنافس.','PRAW = <b>Periodic</b> RAW.'],
q:['Explain how RAW reduces collisions and saves energy in 802.11ah.','The AP assigns STAs to a RAW period split into equal slots and subgroups; only the subgroup assigned to a slot may contend and transmit while all others remain dormant/asleep. RAW parameters (start time, duration, number of slots) are announced in beacons (PRAW to reduce overhead). This reduces collisions and contention overhead and saves energy.']});

L('2-14','2.5 802.11ah — Target Wake Time (TWT) & Network Discovery','TWT و Network Discovery',[[34,35]],{
simple:'TWT = الجهاز يتفق مع الـ AP على ميعاد يصحى فيه، فينام أطول. وNetwork Discovery فيها طريقتين: Passive scanning (بيسمع beacons) و Active scanning (بيبعت Probe Request).',
body:`<h3>Target Wake Time (slide 34)</h3>
<p><b>TWT</b> هو power-saving feature بتسمح للأجهزة <b>تتفاوض على جدول محدد</b> للصحيان وإرسال/استقبال data، فتفضل في <b>sleep mode</b> فترات أطول. الرسمة بتوضح: Beacons متتالية، و<b>TWT Service Period</b> و<b>TWT Wake Interval</b> (الفترة بين مرتين صحيان).</p>
<h3>Network Discovery (slide 35)</h3>
<p>الرسمة: laptop <b>H1</b> وسط تغطية <b>AP 1 (BSS 1)</b> و<b>AP 2 (BSS 2)</b>.</p>
${tb(['Passive Scanning','Active Scanning'],[['(1) <b>Beacons</b> sent from APs','(1) <b>Probe Request (broadcast)</b> sent from H1'],['(2) <b>Association Request</b> sent from H1 to selected AP','(2) <b>Probe Response</b> sent from APs'],['(3) <b>Association Response</b> sent from AP to H1','(3) <b>Association Request</b> sent from H1 to selected AP'],['','(4) <b>Association Response</b> sent from AP to H1']])}
<p>جرّب الـ stepper في <a href="#/lab/wifiscan">Visual Lab</a>.</p>`,
defs:[['Target Wake Time (TWT)','A power-saving feature that allows devices to negotiate a specific schedule for when to wake up and send or receive data, enabling them to stay in sleep mode for longer periods.'],['Passive scanning','APs send beacons; the station sends an Association Request to its selected AP and receives an Association Response.'],['Active scanning','The station broadcasts a Probe Request, APs reply with Probe Responses, then Association Request/Response follow.']],
steps:['(Passive) APs يبعتوا Beacons.','H1 يختار AP ويبعت Association Request.','AP يرد Association Response.','(Active) H1 يبعت Probe Request broadcast.','APs ترد Probe Response.','H1 يبعت Association Request لـ AP المختار.','AP يرد Association Response.'],
memo:['Passive = <b>3 steps</b> (Beacon, AssocReq, AssocResp) · Active = <b>4 steps</b> (ProbeReq, ProbeResp, AssocReq, AssocResp).','TWT = negotiated wake schedule → longer sleep.'],
traps:['<b>Probe Request</b> بتتبعت من الـ station (H1) بـ <b>broadcast</b> في الـ active scanning؛ أما الـ Beacons فبتتبعت من الـ APs في الـ passive.'],
q:['Compare passive and active scanning in 802.11 network discovery.','Passive: APs send beacons, H1 sends Association Request to the selected AP, AP replies with Association Response (3 steps). Active: H1 broadcasts a Probe Request, APs send Probe Responses, then Association Request and Response (4 steps).']});

L('2-15','2.6 IEEE 802.15.4 — Overview, Frequency Bands, PHY and MAC','802.15.4: الأساسيات',[[36,38]],{
simple:'802.15.4 هو الأساس لـ ZigBee و 6LoWPAN: بيشتغل على 3 bands، بسرعات 40–250 kbps، الـ PHY بيستخدم DSSS والـ MAC بيستخدم CSMA/CA.',
body:`<p><b>IEEE 802.15</b> بيوفّر وظائف الـ <b>Physical and MAC layers</b> لـ <b>Low-Rate Wireless Personal Area Networks (LR-WPAN)</b> (slide 36). الرسمة: WPAN IEEE 802.15 ← TG1 (802.15.1 Bluetooth) · TG2 (802.15.2 Coexistence) · TG3 (802.15.3 High data rate WPAN) · TG3a (802.15.3a Very high data rate WPAN, UWB) · TG4 (802.15.4 ZigBee).</p>
<h3>Key facts (slides 37–38)</h3>
${ul(['802.15.4 هو <b>الأساس</b> لبروتوكولات مختلفة: <b>ZigBee</b> و <b>6LoWPAN</b> (Internet Protocol version 6 over Low-Power Wireless Personal Area Network).','نقل البيانات ممكن على <b>3 frequency bands</b>: <b>2.4 GHz</b> و <b>915 MHz</b> و <b>868 MHz</b>.','حسب الـ band بيدعم data rates مختلفة من <b>40 إلى 250 kbps</b>.','<b>الترددات المنخفضة</b> بتغطي مسافات أكبر وبتدّي <b>sensitivity</b> أحسن.','<b>الترددات العالية</b> بتدعم <b>low latency</b> و <b>high throughput</b>.','الـ <b>Physical layer</b> مبني على <b>Direct Sequence Spread Spectrum (DSSS)</b>.','الـ <b>MAC layer</b> مبني على بروتوكول <b>CSMA/CA</b> اللي بيقلل collisions لما nodes كتير تبعت في نفس الوقت.'])}`,
defs:[['IEEE 802.15.4','A standard that provides Physical and MAC layer functionalities for Low-Rate Wireless Personal Area Networks (LR-WPAN); basis of ZigBee and 6LoWPAN.'],['DSSS','Direct Sequence Spread Spectrum — the basis of the 802.15.4 physical layer.']],
memo:['Bands: <b>2.4 GHz, 915 MHz, 868 MHz</b> · rates <b>40–250 kbps</b>.','PHY = <b>DSSS</b> · MAC = <b>CSMA/CA</b>.','Low freq → range + sensitivity · High freq → low latency + throughput.','Basis of <b>ZigBee</b> + <b>6LoWPAN</b>.'],
traps:['الترددات المنخفضة = مسافة أكبر؛ العالية = latency أقل وthroughput أعلى (متعكسش).','802.15.4 = <b>PHY + MAC فقط</b> — مش network ولا application.'],
typo:['Slide 38 كتب “IEEE 802.1.4” في سطر الـ MAC — المقصود 802.15.4. السلايد 36 بيحط ZigBee تحت TG4 (802.15.4) — ده نص الرسمة.'],
q:['State the frequency bands, data rates, PHY and MAC basis of IEEE 802.15.4.','Bands 2.4 GHz, 915 MHz, 868 MHz; data rates from 40 to 250 kbps; PHY based on DSSS; MAC based on CSMA/CA.']});

L('2-16','2.6 CSMA/CA in IEEE 802.15.4','CSMA/CA',[[39,39]],{
simple:'CSMA/CA = “اسمع الأول قبل ما تتكلم”: الجهاز بيستنى وقت عشوائي، يفحص القناة (CCA)، ولو مشغولة بيزوّد الـ backoff ويحاول تاني لحد ما يعدّي حد أقصى فيفشل.',
body:`<p>الاسم الكامل: <b>CSMA/CA (Carrier Sense Multiple Access / Carrier Avoidance)</b> (slide 39). الـ flowchart في الرسمة:</p>
${ol(['<b>NB = 0</b>, <b>BE = macMinBE</b> (تهيئة).','<b>Delay for random(2<sup>BE</sup> − 1) unit backoff periods</b>.','<b>Perform CCA</b> (Clear Channel Assessment).','<b>Channel idle?</b> لو <b>Y</b> → <b>Success</b>.','لو <b>N</b>: <b>NB = NB + 1</b> و <b>BE = min(BE + 1, macMaxBE)</b>.','<b>NB &gt; macMaxCSMABackoffs?</b> لو <b>Y</b> → <b>Failure</b>. لو <b>N</b> → ارجع لخطوة الـ random delay.'])}
<p>المنطق: كل ما القناة تطلع مشغولة بنكبّر نافذة الـ backoff العشوائية (BE بتزيد لحد macMaxBE)، وبعد عدد محاولات أقصى (macMaxCSMABackoffs) بنعلن فشل.</p>`,
defs:[['CSMA/CA','Carrier Sense Multiple Access with Collision (Carrier) Avoidance: a node waits a random backoff, performs CCA, transmits if the channel is idle, otherwise increases NB and BE and retries until NB exceeds macMaxCSMABackoffs.']],
steps:['NB=0, BE=macMinBE','Random delay (2^BE − 1) backoff periods','Perform CCA','Idle? yes → Success','No → NB+1, BE=min(BE+1, macMaxBE)','NB > macMaxCSMABackoffs? yes → Failure, no → repeat'],
memo:['Variables: <b>NB, BE, macMinBE, macMaxBE, macMaxCSMABackoffs</b>.','CCA = <b>Perform CCA</b> then <b>Channel idle?</b>'],
traps:['الـ delay عشوائي من <b>0 إلى 2^BE − 1</b> backoff periods.','فشل الـ CSMA/CA يحصل لما <b>NB &gt; macMaxCSMABackoffs</b>.'],
extra:['“CCA” = Clear Channel Assessment؛ الاسم الكامل مش مكتوب في الـ handout (مكتوب Perform CCA بس).'],
q:['Describe the CSMA/CA flow used by 802.15.4.','Initialise NB=0 and BE=macMinBE; wait a random number of backoff periods in [0, 2^BE−1]; perform CCA; if idle, success; otherwise NB=NB+1 and BE=min(BE+1, macMaxBE); if NB exceeds macMaxCSMABackoffs, failure, else repeat the backoff.']});

L('2-17','2.6 802.15.4 — Node Types (RFD/FFD) and Topologies','RFD و FFD والـ Topologies',[[40,41]],{
simple:'فيه نوعين nodes: RFD (بسيط ومحدود) و FFD (أقوى، ممكن يبقى coordinator). والـ topologies الثلاثة: star, peer-to-peer, cluster-tree.',
body:`<h3>Node types (slide 40)</h3>
${tb(['','RFD — Reduced Function Device','FFD — Full Function Device'],[['<b>الوصف</b>','أجهزة شبكة <b>بسيطة</b> بموارد ومتطلبات اتصال <b>محدودة</b>.','أجهزة <b>أكتر موارد</b>.'],['<b>القدرات</b>','—','<ul><li>تعمل كـ <b>coordinator</b> (في الـ WPAN) بيتحكم ويدير الـ PAN.</li><li>تعمل كـ <b>normal node</b>.</li><li>تدعم <b>full MAC implementation</b>.</li><li><b>تخزّن routing tables</b>.</li></ul>']])}
<h3>Topologies (slide 41)</h3>
<p>3 topologies: <b>star, peer-to-peer, cluster-tree</b>. الرسمة (Figure 5.4): ${ul(['<b>(a) Star</b>: PC (PAN Coordinator) في النص وحواليه FFD و RFDs.','<b>(b) Peer-to-Peer</b>: PC + FFDs/RFDs متوصلين بشبكة بين بعض.','<b>(c) Cluster</b>: PC + CH (Cluster Head) + RFDs/FFD.'])}</p>`,
defs:[['RFD','Reduced Function Device: a simple network device with constrained resource and communication requirements.'],['FFD','Full Function Device: can act as coordinator, act as a normal node, support full MAC implementation and store routing tables.']],
memo:['FFD: <b>coordinator, normal node, full MAC, routing tables</b>.','Topologies: <b>star, peer-to-peer, cluster-tree</b>.','PC = PAN Coordinator · CH = Cluster Head (الرسمة).'],
traps:['<b>RFD</b> لا تخزّن routing tables ولا تبقى coordinator (دي قدرات الـ FFD).'],
extra:['“PC” و“CH” مكتوبين في الرسمة؛ التسميات PAN Coordinator و Cluster Head هي الشائعة لكن مش مكتوبة صراحةً في النص — اعتبرها توضيح.'],
flag:['Slide 41: مواضع RFD/FFD الدقيقة في كل شكل متقرأة من رسمة صغيرة.'],
q:['Differentiate RFD from FFD and list the 802.15.4 topologies.','RFD is a simple device with constrained resources; FFD has more resources and can act as PAN coordinator, as a normal node, support full MAC and store routing tables. Topologies: star, peer-to-peer, cluster-tree.']});

L('2-18','2.6 802.15.4 — Advantages, Disadvantages and Comparison with 802.11ah','مميزات/عيوب 802.15.4 ومقارنة مع 802.11ah',[[42,44]],{
simple:'802.15.4 رخيص وموفر للطاقة وبسيط لكن بطيء ومداه قصير. 802.11ah أبعد (~1 كم) وأسرع، بس اتصمم يشتغل بـ RAW وTWT.',
body:`${tb(['Advantages','Disadvantages'],[['<b>Low power consumption</b>','<b>Low data rate</b>'],['<b>Low cost</b>','<b>Limited range</b>'],['<b>Simplicity</b>','<b>Low reliability</b>'],['<b>Flexibility</b>','<b>Limited bandwidth</b>'],['<b>Mesh networking</b>','<b>Latency issues</b>']])}
<h3>الرسمتين (slide 43)</h3>
<p>اليسار: AP بـ <b>Backhaul Network</b> متصل بـ servers والإنترنت والـ user؛ Relay APs بتخدم Smart Home (Gas Meter, Home Electricity Control) و Smart City (Car Parking, Smart Hospital). اليمين: <b>IEEE 802.11ah AP</b> متصل بـ Backbone Network و Control Stations، وروترات <b>802.15.4g | 802.11ah</b> بتخدم sensors.</p>
<h3>جدول المقارنة (slide 44)</h3>
${tb(['Protocol Feature','IEEE 802.15.4','IEEE 802.11ah'],[['Network Support','WSN','WSN, Backhaul'],['Frequency','2.4 GHz, Sub-1 GHz','Sub-1 GHz'],['Range','~100 m','~1000 m'],['Data rate','250 Kbps','78 Mbps'],['MAC Support','CSMA/CA','RAW'],['Power Saving','Sleep–Wake Mechanism','Traffic Indication Map (TIM), Delivery Traffic Indication Map (DTIM), Target Wake Time (TWT)'],['Relay Node','FFD','Access Point (AP)'],['Application Support','Smart Environment Monitoring, Smart Agriculture','Smart City, Smart Home']])}`,
defs:[['802.15.4 vs 802.11ah (slide 44)','802.15.4: ~100 m, 250 Kbps, CSMA/CA, sleep-wake, FFD relay. 802.11ah: ~1000 m, 78 Mbps, RAW, TIM/DTIM/TWT, AP relay.']],
memo:['802.15.4: <b>~100 m · 250 Kbps · CSMA/CA · FFD relay</b> — 802.11ah: <b>~1000 m · 78 Mbps · RAW · AP relay</b>.','Power saving: 15.4 = <b>sleep–wake</b> · 11ah = <b>TIM, DTIM, TWT</b>.','Apps: 15.4 = smart environment monitoring + smart agriculture · 11ah = smart city + smart home.'],
traps:['MAC: 802.15.4 = <b>CSMA/CA</b>، 802.11ah = <b>RAW</b>.','Relay: 802.15.4 = <b>FFD</b>، 802.11ah = <b>Access Point</b>.'],
typo:['جدول slide 44 فيه “Data rate: 78 Mbps” لـ 802.11ah، بينما slide 28 فيه “150 kbps to 346 Mbps”. اتحفظوا الاتنين زي ما هما.'],
flag:['Slide 43: الرسمتين فيهم تسميات صغيرة؛ وصفنا الأجزاء الواضحة بس.'],
q:['Compare IEEE 802.15.4 and IEEE 802.11ah using the handout table.','Network: WSN vs WSN+Backhaul; frequency 2.4 GHz/sub-1 GHz vs sub-1 GHz; range ~100 m vs ~1000 m; data rate 250 Kbps vs 78 Mbps; MAC CSMA/CA vs RAW; power saving sleep-wake vs TIM/DTIM/TWT; relay FFD vs AP; applications smart environment monitoring/smart agriculture vs smart city/smart home.']});

L('2-19','2.6 802.15.4 Alone — When to Use It, and What Else You Need','إمتى تكفي 802.15.4 لوحدها؟',[[45,46]],{
simple:'802.15.4 لوحدها بتديك Physical + MAC بس. تكفي للتطبيقات البسيطة المحلية. لو عايز mesh تحتاج ZigBee/Thread، ولو عايز IP تحتاج 6LoWPAN أو gateway.',
body:`<p>IEEE 802.15.4 <b>لوحدها بتوفّر الـ physical و MAC layers فقط</b>، فينفع لتطبيقات:</p>
${ul(['<b>مش محتاجة routing</b> (point-to-point أو star كفاية).','<b>مش محتاجة IP connectivity</b> (اتصال محلي بس).','عندها <b>simple, custom protocols</b> في الـ application layer.'])}
<h3>أمثلة</h3>
${ul(['temperature sensor بيبعت data لـ <b>single coordinator</b>.','ماكينات بتتبادل <b>small control messages</b> في مصنع (factory floor).','<b>wireless light switches</b> أو remote controls بتكلّم <b>single hub</b>.'])}
<h3>لو محتاج…</h3>
${tb(['Need','Solution (as stated)'],[['<b>Mesh networking</b>','<b>ZigBee</b> or <b>Thread</b>'],['<b>Internet connectivity (IP)</b>','<b>6LoWPAN</b> or a <b>gateway</b>']])}
${stk(['IEEE 802.15.4 alone: Application Layer ← IEEE 802.15.4 MAC/PHY','ZigBee: Application · Security · Network layers ← IEEE 802.15.4 MAC/PHY','6LoWPAN: Application ← 6LoWPAN ← IEEE 802.15.4 MAC/PHY'],'Stack comparison — slide 46')}`,
defs:[['802.15.4 alone','Provides only the physical and MAC layers, suitable for applications that need no routing, no IP connectivity, and use simple custom application-layer protocols.']],
memo:['Mesh → <b>ZigBee or Thread</b> · IP → <b>6LoWPAN or a gateway</b>.','3 conditions: no routing · no IP · simple custom app protocols.'],
traps:['“Thread” مذكور هنا كخيار mesh لكن الـ handout ما بيشرحهوش.','Internet connectivity مش من 802.15.4 لوحده.'],
q:['When is 802.15.4 alone sufficient and what do you add for mesh or IP?','It is sufficient when no routing is needed (point-to-point/star), no IP is required (local communication) and the application layer uses simple custom protocols. Add ZigBee or Thread for mesh; 6LoWPAN or a gateway for Internet (IP) connectivity.']});

L('2-20','2.7 ZigBee — Overview and Protocol Stack','ZigBee: نظرة عامة والـ stack',[[47,48]],{
simple:'ZigBee = stack كامل (network + security + application) فوق 802.15.4. مصمم للطاقة المنخفضة والـ mesh، مدى 10–100 متر وسرعة لحد 250 kbps.',
body:`<h3>Key features (slide 47)</h3>
${ul(['بروتوكول اتصال لاسلكي <b>low-power, low-data-rate</b> مبني على IEEE 802.15.4.','بيُستخدم أساساً للاتصال قصير المدى في IoT: <b>smart homes, industrial automation, sensor networks</b>.','بيشتغل في <b>2.4 GHz ISM</b> (وكمان <b>868 MHz و 915 MHz</b> في بعض المناطق).','<b>Low power consumption</b> → مثالي للأجهزة بالبطارية.','<b>Mesh networking</b> → الأجهزة تقدر تعمل relay للبيانات لغيرها.','Data rate: <b>up to 250 kbps</b>.','Range: عادةً <b>10–100 meters</b>.'])}
<h3>الـ Stack (slide 48)</h3>
<p>ZigBee بتتنفّذ على <b>كل IEEE 802.15.4 node بيشارك في ZigBee network</b>. هي <b>full protocol stack</b> (<b>network, security, application layers</b>) شغّالة فوق 802.15.4 MAC/PHY. كل node محتاج ZigBee عشان:</p>
${ul(['يفهم <b>ZigBee addressing and routing</b>.','<b>يعمل join و authenticate</b> في الـ ZigBee network.','<b>يتواصل باستخدام ZigBee application profiles</b>.'])}
${stk(['Application Layer','Security Layer','Network Layer','IEEE 802.15.4 MAC/PHY'],'ZigBee stack — slide 48')}`,
defs:[['ZigBee','A low-power, low-data-rate wireless communication protocol based on IEEE 802.15.4; a full protocol stack (network, security, application layers) running above 802.15.4 MAC/PHY.']],
memo:['<b>2.4 GHz</b> (+868/915 MHz some regions) · <b>up to 250 kbps</b> · <b>10–100 m</b> · mesh.','Stack: <b>802.15.4 MAC/PHY → Network → Security → Application</b>.'],
traps:['ZigBee ≠ 802.15.4: 802.15.4 = PHY+MAC، ZigBee = فوقها Network+Security+Application.','المدى <b>10–100 m</b> (مش كيلومتر).'],
q:['Describe the ZigBee protocol stack and what each node needs ZigBee for.','ZigBee is a full stack (network, security, application) above IEEE 802.15.4 MAC/PHY, implemented on every participating node. Each node needs it to understand ZigBee addressing and routing, join and authenticate in the network, and communicate using application profiles.']});

L('2-21','2.7 ZigBee — Addressing and Topologies','ZigBee: العناوين والـ topologies',[[49,50]],{
simple:'ZigBee بتستخدم عنوانين: 64-bit ثابت للهاردوير و16-bit قصير بيديه الـ Coordinator لما الجهاز ينضم. والـ topologies: Star, Mesh, Cluster Tree.',
body:`<h3>Addressing (slide 49)</h3>
${tb(['Address','التفاصيل'],[['<b>64-bit IEEE address</b>','العنوان الفريد للـ hardware.'],['<b>16-bit short address</b>','بيتم تعيينه من <b>ZigBee Coordinator</b> لما الجهاز <b>ينضم للشبكة</b>.']])}
<p>الـ 16-bit بيُستخدم للاتصال الكفء داخل الشبكة (<b>overhead أقل من 64-bit</b>). والـ Coordinator بيعيّن الـ 16-bit network address بواحدة من طريقتين:</p>
${tb(['Method','الفكرة'],[['<b>Distributed Address Assignment</b>','كل router بياخد <b>block of addresses</b> يوزّعها على أولاده (children).'],['<b>Stochastic Address Assignment</b>','تعيين <b>عشوائي</b> مع <b>conflict resolution</b>.']])}
<h3>Topologies (slide 50)</h3>
<p>ZigBee بتدعم: <b>Star</b> و <b>Mesh</b> و <b>Cluster Tree</b>. ألوان الرسمة: <b>أحمر = ZigBee Coordinator</b>، <b>أزرق = ZigBee Routers</b>، <b>أصفر = ZigBee Devices</b> (end devices).</p>`,
defs:[['ZigBee addressing','A 64-bit unique IEEE hardware address and a 16-bit short address assigned by the ZigBee Coordinator when the device joins the network.'],['Distributed Address Assignment','Each router gets a block of addresses to assign to its children.'],['Stochastic Address Assignment','Random assignment with conflict resolution.']],
memo:['<b>64-bit IEEE</b> (hardware) + <b>16-bit short</b> (من الـ Coordinator).','Assignment: <b>Distributed (blocks to routers)</b> vs <b>Stochastic (random + conflict resolution)</b>.','Topologies: <b>Star, Mesh, Cluster Tree</b>. Roles: Coordinator (red), Routers (blue), Devices (yellow).'],
traps:['الـ 16-bit address بيتعيّن عند الـ <b>join</b> مش مصنعي.','Stochastic = عشوائي <b>مع</b> حل التعارض.'],
q:['Explain the two ZigBee address types and the two assignment methods.','A unique 64-bit IEEE hardware address, and a 16-bit short address assigned by the Coordinator on joining (less overhead). Assignment: Distributed (each router receives an address block for its children) or Stochastic (random with conflict resolution).']});

L('2-22','2.7 ZigBee — AODV Routing and the Routing Table','AODV Routing',[[51,53]],{
simple:'ZigBee بتعمل route discovery وقت الحاجة: لو الجهاز مش عارف الطريق بيبعت RREQ broadcast، والـ destination (أو node عارف الطريق) بيرد RREP. والـ routers بتحفظ جدول.',
body:`<h3>AODV (slide 51)</h3>
<p>ZigBee بتستخدم <b>AODV (Ad hoc On-Demand Distance Vector) routing</b> معدّل للشبكات منخفضة الطاقة. <b>How it works</b>:</p>
${ol(['لو جهاز عايز يبعت data لجهاز تاني <b>ومش عارف الـ route</b>، بيعمل <b>broadcast لـ route request (RREQ)</b>.','الـ <b>destination</b> أو <b>intermediate node</b> عنده route بيرد بـ <b>route reply (RREP)</b>.','الـ routes بتتخزن في <b>routing tables</b> للاستخدام بعدين.'])}
<p><b>Mesh Routing</b>: الـ routers بتعمل forward للـ packets بين الـ nodes وده بيتيح <b>multi-hop communication</b>.</p>
<h3>Routing table (slide 52)</h3>
<p>كل ZigBee <b>router أو coordinator</b> بيحتفظ بجدول فيه: ${ul(['<b>Destination Address</b> (16-bit short address)','<b>Next Hop Address</b>','<b>Route Status</b> (active, discovery, etc.)','<b>Route Cost</b> (number of hops or link quality)'])}</p>
<p><b>How the table is built</b>: <b>Route Discovery (On-Demand) using RREQ</b> ← <b>Route Reply (RREP)</b> ← <b>Route Maintenance using RERR</b>.</p>
<h3>ZigBee network figure (slide 53)</h3>
<p>الرسمة فيها nodes A–K: <b>D = Coordinator</b> (غامق)، routers (رمادي): A, B, C, E, F, G، وend nodes (أبيض): H, I, J, K. والـ legend: <b>RREQ, RREP, DATA, KEEP-ALIVE</b> بأنواع أسهم مختلفة.</p>
<p>جرّب الـ stepper في <a href="#/lab/aodv">Visual Lab → AODV</a>.</p>`,
defs:[['AODV','Ad hoc On-Demand Distance Vector routing, adapted for low-power networks: a device broadcasts a route request (RREQ) when it lacks a route; the destination or an intermediate node with a route replies with a route reply (RREP); routes are stored in routing tables.'],['RERR','Route Error — used for route maintenance.']],
steps:['الجهاز مش عارف الـ route → يبعت RREQ broadcast.','الـ RREQ يعدّي من routers لحد destination.','الـ destination أو node عارف route يرد RREP.','الـ route يتخزّن في routing table.','البيانات تتبعت DATA عبر multi-hop.','لو الـ route باظ → RERR لصيانة الـ route.'],
memo:['<b>RREQ</b> = broadcast route request · <b>RREP</b> = route reply · <b>RERR</b> = route maintenance.','Table fields: <b>Destination (16-bit), Next Hop, Route Status, Route Cost</b>.'],
traps:['الـ route discovery <b>on-demand</b> (لما تحتاج بس) مش دايماً.','الـ Destination Address في الجدول = <b>16-bit short address</b>.','Route Cost = number of hops <b>or</b> link quality.'],
flag:['Slide 53: سماكة/نمط الأسهم (مين بيحمل RREQ/RREP/DATA/KEEP-ALIVE بين أي nodes) مش واضحة من الرسمة الصغيرة؛ ماوصفناش المسارات بالتفصيل.'],
q:['Explain how ZigBee builds routes using AODV and what a routing table contains.','If a device lacks a route it broadcasts a route request (RREQ); the destination or an intermediate node with a route replies with a route reply (RREP); routes are stored in routing tables and maintained using RERR. Table: destination (16-bit), next hop, route status, route cost (hops or link quality).']});

L('2-23','2.7 ZigBee — Join Process and Security','الانضمام والأمان',[[54,55]],{
simple:'الجهاز الجديد بيدوّر على شبكات (Beacon Request)، يبعت Association Request لأب (Coordinator/Router)، ياخد 16-bit address وPAN ID وchannel وsecurity settings. والأمان: AES-128 وTrust Center بيدير المفاتيح.',
body:`<h3>ZigBee Join Process (slide 54)</h3>
${ol(['<b>Beacon Request</b>: الجهاز بيعمل scan عن الشبكات المتاحة.','<b>Association Request</b>: بيبعت طلب لـ <b>parent</b> (Coordinator أو Router).','<b>Address Assignment</b>: الـ parent بيعيّن <b>16-bit short address</b> للجهاز.','<b>Network Parameters</b>: الجهاز بيستلم <b>PAN ID, channel, security settings</b>.'])}
<h3>ZigBee Authentication (slide 55)</h3>
${ul(['ZigBee بتستخدم <b>AES-128 encryption</b> للأمان.','الـ authentication بيضمن إن <b>الأجهزة الموثوقة بس</b> هي اللي بتنضم.','الـ <b>Trust Center</b> (عادةً الـ <b>Coordinator</b>) بيدير المفاتيح: <b>Network Key</b>: مشترك بين كل الأجهزة للتشفير. <b>Link Keys</b>: اختيارية (optional)، لأمان جهاز-لجهاز.','الجهاز المنضم لازم <b>يثبت إنه معاه المفتاح الصح</b> (pre-installed أو بيتبعتله بشكل آمن).'])}
<p>جرّب الـ stepper في <a href="#/lab/zjoin">Visual Lab → ZigBee Join</a>.</p>`,
defs:[['ZigBee join process','Beacon Request (scan for networks) → Association Request to a parent (Coordinator/Router) → Address Assignment (16-bit short address) → Network Parameters (PAN ID, channel, security settings).'],['Trust Center','Usually the Coordinator; manages the network key (shared by all devices for encryption) and optional link keys (device-to-device security).']],
steps:['Beacon Request (scan)','Association Request إلى parent','Address Assignment (16-bit)','Network Parameters (PAN ID, channel, security)','إثبات المفتاح الصحيح (authentication)'],
memo:['Join = <b>4 steps</b>: Beacon Request → Association Request → Address Assignment → Network Parameters.','Security: <b>AES-128</b> · Trust Center (Coordinator) · <b>Network Key</b> (shared) · <b>Link Keys</b> (optional).'],
traps:['Link Keys <b>optional</b> — Network Key هو المشترك للكل.','الـ parent ممكن يكون <b>Coordinator أو Router</b>.'],
q:['List the ZigBee join steps and the keys managed by the Trust Center.','Beacon Request (scan), Association Request to a parent, Address Assignment of a 16-bit short address, receipt of network parameters (PAN ID, channel, security settings). The Trust Center (usually the Coordinator) manages the network key (shared by all devices) and optional link keys; encryption is AES-128.']});

L('2-24','2.8 6LoWPAN — Overview and Who Does What','6LoWPAN: الفكرة والأدوار',[[56,58]],{
simple:'6LoWPAN = IPv6 فوق شبكات 802.15.4 المنخفضة الطاقة. الـ sensors فيها adaptation layer (ضغط header، fragmentation، mesh addressing)، والـ 6LBR بيوصّل الشبكة بالإنترنت.',
body:`<p><b>6LoWPAN</b> = <b>IPv6 over Low-Power Wireless Personal Area Networks</b>. هو بروتوكول اتصال بيسمح لأجهزة صغيرة منخفضة الطاقة (sensors و actuators) <b>تتواصل باستخدام IPv6 فوق شبكات IEEE 802.15.4</b> (slide 56). الرسمة: Wireless Sensor Devices (802.15.4) ← Router ← IPv6 devices (PC/phone).</p>
<p>وظيفة 6LoWPAN بتتطبّق على <b>الـ sensor nodes</b> و<b>الـ gateway/router</b> لكن بطرق مختلفة:</p>
<h3>At the Sensor Nodes (slide 57)</h3>
${ul(['كل sensor node بينفّذ <b>6LoWPAN adaptation layer</b> فوق IEEE 802.15.4 MAC/PHY.','الـ layer دي بتتولى:'])}
${ul(['<b>IPv6 header compression</b> — عشان IPv6 يدخل جوه frames صغيرة (<b>127-byte frames</b>).','<b>Fragmentation and reassembly</b> للـ packets.','<b>Mesh addressing</b> للاتصال multi-hop.'])}
<p>يعني الـ sensors نفسها تقدر “تتكلم IPv6 (compressed)” بفضل 6LoWPAN.</p>
<h3>At the Router/Gateway (slide 58)</h3>
<p>الـ <b>6LoWPAN Border Router (6LBR)</b> بيوصّل الشبكة منخفضة الطاقة بشبكة IPv6 الأوسع (زي الإنترنت). وهو:</p>
${ul(['<b>بيترجم</b> بين <b>6LoWPAN-compressed IPv6 packets</b> و <b>standard IPv6 packets</b>.','بيدير <b>routing</b> بين شبكة الـ sensors والشبكات الخارجية.','غالباً بيوفّر <b>security and network management</b>.'])}`,
defs:[['6LoWPAN','IPv6 over Low-Power Wireless Personal Area Networks: a communication protocol that allows small low-power devices to communicate using IPv6 over IEEE 802.15.4 networks.'],['6LBR','6LoWPAN Border Router: connects the low-power network to the wider IPv6 network, translating between compressed and standard IPv6 packets, routing, and often providing security and network management.']],
memo:['Sensor node: <b>adaptation layer</b> = <b>header compression + fragmentation/reassembly + mesh addressing</b>.','Frame size: <b>127-byte</b>.','6LBR: <b>translation + routing + security/management</b>.'],
traps:['الـ compression/fragmentation بتحصل عند الـ <b>sensor</b>؛ الـ 6LBR بيترجم بين compressed وstandard.','6LoWPAN ≠ ZigBee: الاتنين فوق 802.15.4 لكن 6LoWPAN بتوصّل <b>IPv6</b>.'],
q:['Explain the roles of the sensor nodes and the 6LBR in a 6LoWPAN network.','Sensor nodes implement a 6LoWPAN adaptation layer on top of 802.15.4 MAC/PHY handling IPv6 header compression (to fit 127-byte frames), fragmentation/reassembly and mesh addressing. The 6LBR connects to the wider IPv6 network, translating between compressed and standard IPv6 packets, routing, and often providing security and network management.']});

L('2-25','2.8 6LoWPAN — Network Architecture and Routing Figures','6LoWPAN architecture و routing',[[59,62]],{
simple:'الشبكة فيها routers (R) و hosts (H) وedge router بيوصّلها بالـ IPv6 Internet. والرسمتين الأخيرتين بيوضحوا الـ protocol stack على الـ source والـ intermediate والـ destination والـ edge router.',
body:`<h3>Network architecture (slide 59)</h3>
<p>الرسمة: <b>Servers + Internet</b> ← <b>IPv6 Router</b> ← بيتوصّل بـ PCs وبـ <b>6LoWPAN Router</b> ← جواه <b>6LoWPAN Network</b> فيها Routers (<b>R</b>) و Hosts (<b>H</b>).</p>
<h3>Network routing (slides 60–62)</h3>
${ul(['<b>R</b> stands for <b>Routers</b> · <b>H</b> stands for <b>Hosts</b> (slide 60). الشبكة: Remote Server (عنوان 2001:a03f::1ffa في الرسمة) ← IPv6 Internet ← Router ← P2P link ← <b>Edge Router</b> ← LoWPAN فيها R و H.','Slide 61: stack على <b>Source Node</b> (Application, Transport, Network, 6LoWPAN, Data Link, Physical)، و<b>Intermediate Node</b> (Network, 6LoWPAN, Data Link, Physical فقط — بيعمل routing على الـ Network layer)، و<b>Destination Node</b> (stack كامل).','Slide 62: Host (Application/UDP/IPv6/LoWPAN/DLL/PHY) ← Router (IPv6/LoWPAN/DLL/PHY) ← <b>Edge Router</b> (LoWPAN على جهة، وـ DLL/PHY عادي على جهة الـ IPv6 network) ← <b>IPv6 Host</b> (Application/UDP/IPv6/DLL/PHY). الجزء الأيسر = 6LoWPAN network، والأيمن = IPv6 network.'])}
<p>الخلاصة: الـ <b>Edge Router</b> هو نقطة التحويل بين عالم 6LoWPAN وعالم IPv6 العادي، والـ intermediate node بيمرّر على مستوى IPv6 من غير ما يرفع للـ transport.</p>`,
defs:[['6LoWPAN routing roles','R = Routers, H = Hosts; the Edge Router connects the LoWPAN to the IPv6 network.']],
memo:['<b>R = Routers</b>, <b>H = Hosts</b>.','Edge Router = pivot between <b>LoWPAN</b> and <b>IPv6 Internet</b>.','Intermediate node stack: <b>Network + 6LoWPAN + Data Link + Physical</b> (no Transport/Application).'],
traps:['الـ intermediate node ما بيطلعش لـ Transport/Application — بيعمل forwarding على الـ Network layer.'],
flag:['Slides 59–62: الرسمات فيها labels صغيرة (عناوين IPv6 وأسهم). وصفنا البنية العامة؛ التفاصيل الدقيقة تحتاج مراجعة بشرية للـ PDF.'],
q:['What do R and H denote in 6LoWPAN routing figures, and what does the edge router do?','R denotes routers and H denotes hosts. The edge router connects the 6LoWPAN network to the IPv6 network/Internet, bridging between compressed LoWPAN operation and standard IPv6.']});

L('2-26','2.8 6LoWPAN — Motivation, Features and Packet Format','مميزات 6LoWPAN وشكل الـ packet',[[63,65]],{
simple:'6LoWPAN اتعملت عشان IP توصل لأصغر الأجهزة. أهم ميزتها: header compression (بتقلل overhead الـ fragmentation والإرسال). والـ packet ممكن يبقى فيه Fragment Header و Mesh Addressing Header.',
body:`<h3>Why 6LoWPAN (slide 63)</h3>
${ul(['اتعملت بهدف <b>تطبيق Internet Protocol (IP) حتى على أصغر الأجهزة</b>، عشان أجهزة منخفضة الطاقة ومعالجة محدودة تشارك في IoT.','بتوفّر <b>header compression</b>.','الـ compression بتقلل overheads: <b>fragmentation overhead</b> و <b>transmission overhead</b>.','بتدّي دعم واعد لاتصال IP لأجهزة IoT.'])}
<h3>Features of 6LoWPAN (slide 64)</h3>
${ul(['دعم <b>64-bit و 16-bit 802.15.4 addressing</b>.','مفيدة مع low-power link layers زي <b>IEEE 802.15.4</b> و <b>narrowband ISM</b> و <b>power-line communications</b>.','<b>Efficient header compression</b>: IPv6 base and extension headers + UDP header.','<b>Network auto-configuration using neighbor discovery</b>.','<b>Unicast, multicast and broadcast</b> support — الـ multicast بيتضغط ويتحوّل لـ broadcast.','<b>Fragmentation</b>: <b>1280-byte IPv6 MTU → 127-byte 802.15.4 frames</b>.','دعم IP routing (مثلاً <b>IETF RPL</b>).','دعم link-layer mesh (مثلاً <b>802.15.5</b>).'])}
<h3>6LoWPAN packet (slide 65)</h3>
<p>3 أشكال في الرسمة (كلهم بيبدأوا بـ <b>802.15.4 Header</b> وبينتهوا بـ <b>IPv6 Payload</b>):</p>
${tb(['الشكل','الترتيب'],[['(1) بدون fragmentation','802.15.4 Header → IPv6 Header Compression → IPv6 Payload'],['(2) مع fragmentation','802.15.4 Header → <b>Fragment Header</b> → IPv6 Header Compression → IPv6 Payload'],['(3) مع mesh + fragmentation','802.15.4 Header → <b>Mesh Addressing Header</b> → <b>Fragment Header</b> → IPv6 Header Compression → IPv6 Payload']])}`,
defs:[['6LoWPAN header compression','Compresses IPv6 base/extension and UDP headers, reducing fragmentation and transmission overhead so IPv6 packets fit small 802.15.4 frames.']],
memo:['<b>1280-byte IPv6 MTU → 127-byte 802.15.4 frames</b>.','Addressing: <b>64-bit + 16-bit</b>.','Compression covers: <b>IPv6 base/extension headers + UDP header</b>.','Multicast → compressed and <b>mapped to broadcast</b>.','Packet order: 802.15.4 Hdr → <b>Mesh Addressing</b> → <b>Fragment</b> → IPv6 HC → Payload.'],
traps:['الـ Mesh Addressing Header <b>قبل</b> الـ Fragment Header.','الـ multicast مش مدعوم كـ multicast حقيقي: بيتحوّل لـ broadcast.','1280 هو الـ IPv6 <b>MTU</b>، و127 byte هو حجم frame الـ 802.15.4.'],
q:['Why does 6LoWPAN need fragmentation and header compression, and what is the packet order with mesh addressing?','IPv6 MTU is 1280 bytes while 802.15.4 frames carry 127 bytes, so packets are fragmented; header compression (IPv6 base/extension and UDP headers) reduces fragmentation and transmission overhead. With mesh addressing: 802.15.4 header, mesh addressing header, fragment header, IPv6 header compression, IPv6 payload.']});

L('2-27','2.8 6LoWPAN — Neighbour Discovery (ND) and Mobility','Neighbour Discovery والـ Mobility',[[66,70]],{
simple:'IPv6 العادي بيفترض إن الأجهزة شغالة دايماً، لكن في 6LoWPAN فيه أجهزة نايمة. عشان كده الجهاز بيسجّل نفسه عند الـ router (RS, RA, NR, NC). والـ mobility 3 أنواع: micro, macro, network.',
body:`<h3>Neighbour Discovery (slides 66–67)</h3>
${ul(['في <b>IPv6</b> الافتراض إن كل الأجهزة <b>شغالة طول الوقت</b>.','لكن في 6LoWPAN الـ ND العادي <b>مش مناسب</b> لأن فيه <b>sleepy devices</b> بعضها بيصحى بعد أسابيع.','الجهاز اللي عايز يتوصل <b>بيسجّل نفسه عند الـ router</b>: بدل ما يعمل broadcasting لـ packet، الـ wireless device <b>بيبعت للـ router ويسجل نفسه</b>.'])}
<p>الرسائل الأربعة (الرسمة: Host ↔ Router ↔ Edge Router ↔ IPv6 Host):</p>
${tb(['Message','الاسم الكامل','الاتجاه (من الرسمة)'],[['<b>RS</b>','Router Solicitation','Host → Router'],['<b>RA</b>','Router Advertisement','Router → Host'],['<b>NR</b>','Node Registration','Host → Router، وبعدين Router → Edge Router'],['<b>NC</b>','Node Confirmation','Edge Router → Router، وبعدين Router → Host']])}
<p>بعدها: <b>Data flows</b> بين الـ Host و الـ IPv6 Host.</p>
<h3>6LoWPAN Mobility (slides 68–70)</h3>
<p>الـ mobility = <b>حركة الـ nodes</b>، وفيها عمليتين: <b>Roaming</b> (حركة node من network لـ network تانية) و <b>Handover</b> (نقطة الـ attachment بتتغير).</p>
${tb(['Type','المعنى'],[['<b>Micro-mobility</b>','حركة node <b>داخل نفس الـ IP Domain</b> أو بنية الـ WiFi — الـ <b>IPv6 prefix بيفضل ثابت</b>.'],['<b>Macro-mobility</b>','node بيتحرك <b>من IP domain لـ IP domain تاني</b> — الـ <b>IP address بيتغير</b>.'],['<b>Network Mobility</b>','<b>6LoWPAN كاملة</b> بتتحرك، نقطة attachment الـ <b>edge router</b> بتتغير. مثال: شبكة nodes جوه عربية، ومع حركة العربية نقطة الاتصال بتتغير.']])}
<p>الرسمة (slide 70): Node Mobility (macro-mobility بين Simple LoWPAN و Extended LoWPAN، و micro-mobility جوه Extended LoWPAN) و Network Mobility (edge router بينتقل من Old لـ New router).</p>
<p>جرّب الـ stepper في <a href="#/lab/nd">Visual Lab → 6LoWPAN ND</a>.</p>`,
defs:[['6LoWPAN Neighbour Discovery','Devices register themselves with the router instead of broadcasting, using Router Solicitation (RS), Router Advertisement (RA), Node Registration (NR) and Node Confirmation (NC), because sleepy devices cannot be assumed always on.'],['Micro-mobility','Movement of a node within the same IP domain or Wi-Fi infrastructure; the IPv6 prefix stays the same.'],['Macro-mobility','A node moves from one IP domain to another; the IP address changes.'],['Network mobility','An entire 6LoWPAN moves; the edge router’s point of attachment changes.']],
steps:['Host يبعت RS للـ router.','Router يرد RA.','Host يبعت NR (تسجيل) للـ router.','Router يمرّر NR للـ Edge Router.','Edge Router يرد NC.','Router يمرّر NC للـ Host.','Data flows بين Host و IPv6 Host.'],
memo:['<b>RS → RA → NR → NC</b> (بالترتيب).','Mobility: <b>Roaming</b> (network لـ network) + <b>Handover</b> (attachment point changes).','Micro = prefix ثابت · Macro = IP يتغير · Network = شبكة كاملة.'],
traps:['6LoWPAN ND بتتم بـ <b>registration مع الـ router</b> مش broadcast.','Micro-mobility: prefix <b>ثابت</b>. Macro: IP <b>بيتغير</b>.','Network Mobility = <b>الشبكة كلها</b> مش node واحد.'],
flag:['Slide 67: ترتيب أسهم NR/NC بين Router و Edge Router مستنتج من الرسمة الصغيرة؛ راجعه على الـ PDF.'],
q:['Why is standard IPv6 Neighbour Discovery unsuitable for 6LoWPAN, and what messages are used instead?','IPv6 assumes devices are always on, but 6LoWPAN has sleepy devices (some waking after weeks). Instead of broadcasting, a device registers with the router using RS, RA, NR and NC messages.']});

/* ===================== CHAPTER 3 ===================== */
L('3-1','3.1 Introduction — Infrastructure vs Service Discovery vs Application Protocols','الأنواع التلاتة للبروتوكولات',[[1,2]],{
simple:'IoT protocols بتتقسم 3 أنواع: Infrastructure (6LoWPAN, 802.15.4, BLE…) و Service Discovery (mDNS, DNS-SD) و Application (MQTT, CoAP, AMQP, XMPP). الفصل ده عن التاني والتالت.',
body:`<p>الـ IoT protocols ممكن تتقسم إلى <b>ثلاثة أنواع</b> (slide 2): ${ul(['<b>Infrastructure Protocols</b>','<b>Service Discovery Protocols</b>','<b>Application Protocols</b>'])}</p>
${tb(['Type','Examples (from the figure)','اتشرح فين؟'],[
['<b>Application Layer Protocols</b>','AMQP, XMPP, MQTT, CoAP','Chapter 3 (3.3) — MQTT و CoAP بالتفصيل'],
['<b>Service Discovery Protocols</b>','mDNS, DNS-SD','Chapter 3 (3.2)'],
['<b>Infrastructure Layer Protocols</b> — Network/Routing: 6LoWPAN, RPL · Physical/Link: IEEE 802.15.4, IEEE 802.11ah, ZigBee, EPCglobal, Z-Wave, LTE-A, BLE','','Chapter 2']])}
<p>خلي بالك: الـ protocols دي في <b>layers مختلفة</b> — مش بدائل لبعض. زي ما الرسمة مرتبة: Application فوق، Service Discovery في النص، Infrastructure تحت.</p>`,
defs:[['Three IoT protocol types','Infrastructure protocols, service discovery protocols, and application protocols.']],
memo:['<b>Application</b>: AMQP, XMPP, MQTT, CoAP · <b>Service Discovery</b>: mDNS, DNS-SD · <b>Infrastructure</b>: 6LoWPAN, RPL, 802.15.4, 802.11ah, ZigBee, EPCglobal, Z-Wave, LTE-A, BLE.'],
traps:['MQTT/CoAP (Application) مش بدائل لـ 6LoWPAN/ZigBee (Infrastructure) — كل واحد في layer مختلفة.'],
q:['Name the three types of IoT protocols with two examples of each.','Infrastructure (e.g., 6LoWPAN, IEEE 802.15.4); Service Discovery (mDNS, DNS-SD); Application (MQTT, CoAP).']});

L('3-2','3.2 Service Discovery Protocols and DNS','Service Discovery و DNS',[[3,4]],{
simple:'الـ IoT محتاج الأجهزة تلاقي بعض وخدماتها تلقائياً. الـ DNS هو “دفتر تليفونات الإنترنت”، لكنه unicast عبر سيرفر ثابت.',
body:`<h3>Service Discovery (slide 3)</h3>
${ul(['الـ Service Discovery <b>مهم في IoT systems</b>.','بيحتاج <b>automatic and efficient resource management mechanism</b> لـ <b>registration and discovery</b> للموارد (resources) والخدمات في شبكة الـ IoT.','بروتوكولين معروفين: <b>Multicast Domain Name System (mDNS)</b> و <b>Domain Name System Service Discovery (DNS-SD)</b>.'])}
<h3>DNS (slide 4)</h3>
${ul(['الـ <b>Domain Name System (DNS)</b> هو <b>phonebook of the Internet</b>.','لما المستخدم يكتب اسم زي ‘google.com’ في المتصفح، الـ DNS مسؤول عن <b>إيجاد الـ IP address الصح</b> للموقع.','المتصفحات بتستخدم العناوين دي للاتصال بـ <b>origin servers</b> أو <b>CDN edge servers</b> للوصول لمعلومات الموقع.','هو بروتوكول <b>one-to-one (unicast)</b>: جهازك بيسأل <b>fixed DNS server</b> ويحصل على الرد. واستعلام الـ DNS بيحصل <b>عبر الإنترنت</b>.'])}`,
defs:[['Service discovery','An automatic and efficient resource-management mechanism for the registration and discovery of resources and services in an IoT network.'],['DNS','The phonebook of the Internet: resolves domain names such as google.com to IP addresses; a one-to-one (unicast) protocol where a machine queries a fixed DNS server over the internet.']],
steps:['المستخدم يكتب google.com.','الجهاز يسأل DNS server ثابت (unicast).','الـ DNS server يرد بالـ IP.','المتصفح يتصل بالـ origin/CDN edge server.'],
memo:['DNS = <b>phonebook</b> · <b>one-to-one (unicast)</b> · <b>fixed DNS server</b> · <b>over the internet</b>.','Service discovery protocols: <b>mDNS</b> + <b>DNS-SD</b>.'],
traps:['DNS = <b>unicast</b> بسيرفر ثابت؛ mDNS = <b>multicast</b> من غير سيرفر مركزي (الـ topic الجاي).'],
q:['What is DNS and why is it called unicast?','DNS is the phonebook of the Internet, mapping domain names like google.com to IP addresses. It is one-to-one (unicast) because a machine queries a fixed DNS server and receives its response, over the internet.']});

L('3-3','3.2.1 mDNS — Multicast DNS','mDNS',[[5,6]],{
simple:'mDNS هو DNS للشبكة المحلية بس من غير سيرفر مركزي: الجهاز بيسأل “مين هو الـ printer؟” لكل الأجهزة، والجهاز المعني يرد بالـ IP للكل.',
body:`<p><b>Multicast DNS</b> هو <b>DNS equivalent</b> للـ <b>local network</b> (slide 5).</p>
<h3>المشكلة (مثال الـ handout)</h3>
<p>غرفة فيها أجهزة كتير (موبايلات، لابتوبات، تليفزيونات، طابعات…) على <b>نفس Wi-Fi network</b>. عايز تبعت أمر من الموبايل للطابعة عشان تطبع: الموبايل لازم يتصل بالطابعة ومحتاج <b>IP الطابعة</b> (اللي اداه الـ Wi-Fi router). <b>إزاي يجيبه؟</b></p>
<h3>الحل (slide 6)</h3>
<p>ببساطة <b>بيسأل كل اللي على الشبكة المحلية</b> “هل أنت الطابعة المقصودة؟”. و<b>في mDNS مفيش central DNS server</b>. لاستعلام IP عن hostname معروف:</p>
${ol(['<b>Send a multicast message</b> لكل الأجهزة على الشبكة بيسأل: هل حد منكم يطابق الـ hostname؟','واحد من الأجهزة هيطابق الـ hostname، ويرد بـ <b>IP address بتاعه</b> (برضه عبر <b>multicast</b> لكل الأجهزة على الشبكة).','كل الأجهزة على الشبكة تقدر <b>تحدّث local phonebook (mDNS cache)</b> بحيث تربط الـ hostname بالـ local IP.'])}
<p>جرّب الـ stepper في <a href="#/lab/mdns">Visual Lab → mDNS</a>.</p>`,
defs:[['mDNS','Multicast DNS: the DNS equivalent for a local network; there is no central DNS server — a multicast query asks all devices to identify with a hostname, the matching device replies with its IP via multicast, and all devices update their mDNS cache.']],
steps:['الموبايل يبعت multicast query بالـ hostname.','الطابعة (المطابقة) ترد بالـ IP عبر multicast.','كل الأجهزة تحدّث mDNS cache (hostname ↔ local IP).'],
scn:'ريموت/تطبيق موبايل بيدوّر على الكاميرا الذكية في البيت من غير ما تكتب IP.',
memo:['<b>No central DNS server</b> · query = <b>multicast</b> · reply = <b>multicast</b> برضه · الأجهزة تحدّث <b>mDNS cache</b>.'],
traps:['الـ reply في mDNS برضه <b>multicast</b> (مش unicast للسائل بس) عشان كل الأجهزة تحدّث الـ cache.','مفيش DNS server مركزي هنا.'],
q:['Describe how mDNS resolves a hostname on a local network.','A device sends a multicast message to all devices asking whether any identifies with the hostname; the matching device replies with its IP address, also via multicast; all devices update their local mDNS cache mapping the hostname to the local IP. There is no central DNS server.']});

L('3-4','3.2.2 DNS-SD — DNS-based Service Discovery','DNS-SD',[[7,8]],{
simple:'DNS-SD بتخليك تدوّر بالـ service (مش بالـ hostname): تسأل عن خدمة معينة وتجيلك قائمة بالأجهزة اللي بتقدمها وعناوين IP وال ports، وmDNS بيحل الـ hostnames لعناوين.',
body:`<p>mDNS ممكن يتستخدم <b>مع DNS-based Service Discovery (DNS-SD)</b> (slide 7). معظم الأجهزة بتقدّم <b>services</b> لأجهزة تانية على نفس الشبكة. مثال الـ handout: طابعة بتقدم <b>messaging services over TCP on port 5566</b>.</p>
<p>بدل البحث بالـ <b>hostname</b>، لو بحثت بـ <b>service name</b> (بإرسال <b>DNS-SD request over mDNS</b>) هتجيب الـ <b>hostnames</b> اللي بتقدم الخدمة، وبعدين <b>mDNS يحل (resolve) الـ hostnames دي لـ IP addresses</b> المقابلة.</p>
<h3>Using mDNS with DNS-SD (slide 8)</h3>
${ul(['لو بحثت عن service اسمها مثلاً <code>._print._udp</code> (زي المكتوب في السلايد) هتاخد <b>قائمة بكل الأجهزة على الشبكة المحلية</b> اللي بتقدم الخدمة دي، مع <b>hostnames</b> و <b>IP addresses</b> و <b>الـ port</b> اللي بتقدم عليه الخدمة (وتقدر كمان تدوّر على port معين).','بعدها تتصل بالجهاز اللي يهمك، باستخدام <b>الـ protocol المحدد في الـ service</b>، على <b>الـ port المحدد</b>، وتنفّذ الإجراء المطلوب.'])}
<p>جرّب في <a href="#/lab/dnssd">Visual Lab → DNS-SD</a>.</p>`,
defs:[['DNS-SD','DNS-based Service Discovery: searching by service name (via a DNS-SD request over mDNS) returns the hostnames, IP addresses and ports of devices providing the service; mDNS then resolves hostnames to IP addresses.']],
steps:['ابعت DNS-SD request over mDNS باسم الـ service.','استقبل hostnames (+ IP + port) للأجهزة اللي بتقدم الخدمة.','mDNS يحل الـ hostnames لـ IP.','اتصل بالجهاز بالـ protocol والـ port المحددين.'],
memo:['DNS-SD = search by <b>service name</b> (مش hostname) · بتشتغل <b>فوق mDNS</b>.','النتيجة: <b>hostnames + IPs + port</b>.'],
traps:['DNS-SD بتدوّر بالـ <b>service</b>، mDNS بتحل الـ <b>hostname → IP</b>. الاتنين بيشتغلوا مع بعض.'],
typo:['اسم الخدمة المكتوب في slide 8 هو “._print._udp” (ببداية نقطة) والمثال في slide 7 عن port 5566 على TCP. محفوظين زي ما هما.'],
q:['What does DNS-SD add on top of mDNS?','It lets a client search by service name instead of hostname: a DNS-SD request over mDNS returns the devices (hostnames, IPs, ports) that provide the service; mDNS resolves the hostnames to IPs, then the client connects using the service’s protocol and port.']});

L('3-5','3.2.3 Specifications and 3.2.4 Implementation in IoT','مواصفات mDNS والتطبيق في IoT',[[9,11]],{
simple:'الأرقام المهمة: multicast address (224.0.0.51 أو ff02::fb)، UDP port 5353، والـ hostnames لازم تنتهي بـ .local. وبتتنفذ عملياً في Apple Bonjour و Avahi و Windows 10.',
body:`<h3>Specifications (slide 9)</h3>
${tb(['Spec','القيمة'],[['Multicast query address','<b>IPv4 224.0.0.51</b> أو <b>IPv6 ff02::fb</b> (دايماً على واحد منهم)'],['Transport / port','<b>UDP message</b> على <b>port 5353</b>'],['Hostnames','الـ resolution مسموح <b>فقط للـ hosts اللي بتنتهي بـ <code>.local</code></b> (عكس .com, .in … للمواقع العادية). أي hostname بامتداد غير .local <b>مش بتتعالج بـ mDNS</b>.']])}
<h3>Software (slide 10)</h3>
${ul(['<b>Apple Bonjour</b> و <b>Avahi</b> (على Linux distributions) بينفّذوا <b>mDNS و DNS-SD</b> الاتنين.','<b>Windows 10</b> بدأ يوفّر <b>native implementation</b> لـ mDNS و DNS-SD.'])}
<h3>Implementation in IoT (slide 11)</h3>
${ul(['mDNS (مع DNS-SD) بيُستخدم لـ <b>اكتشاف smart devices على الشبكة المحلية</b> بناءً على <b>hostname أو service</b>.','بعد الاكتشاف، تقدر <b>تضبط وتتفاعل</b> مع الأجهزة <b>على الشبكة المحلية نفسها</b>.','كتير من أجهزة <b>smart home</b> بتدعم mDNS-based discovery.','mDNS اختيار مفضل للـ <b>embedded IP-based devices</b> لأسباب: <b>Automatic configuration</b> + <b>no additional infrastructure required to manage devices</b>.'])}`,
defs:[['mDNS specifications','Queries use IPv4 224.0.0.51 or IPv6 ff02::fb, as UDP messages on port 5353; only hostnames ending in .local are resolved.']],
memo:['<b>224.0.0.51</b> · <b>ff02::fb</b> · <b>UDP 5353</b> · <b>.local</b> only.','Software: <b>Apple Bonjour, Avahi (Linux), Windows 10 native</b>.','Why preferred: <b>automatic configuration</b> + <b>no extra infrastructure</b>.'],
traps:['mDNS = <b>UDP 5353</b> (مش TCP، ومش 1883/5683 اللي هم MQTT/CoAP).','Hostname بـ .com مش بتتعالج بـ mDNS — <b>.local فقط</b>.','port 5566 في السلايد 7 هو مثال لخدمة طابعة (مش port الـ mDNS).'],
q:['State the multicast addresses, port, and hostname restriction of mDNS.','Queries go to IPv4 224.0.0.51 or IPv6 ff02::fb as UDP messages on port 5353; only hostnames ending with .local are resolved by mDNS.']});

L('3-6','3.3 Application Protocols — Overview','بروتوكولات الـ Application',[[12,12]],{
simple:'IoT applications ليها احتياجات أداء متنوعة، فاتطوّرت عدة application-level protocols: DDS, MQTT, CoAP, AMQP, XMPP.',
body:`<p>بالنظر لـ <b>الجوانب المتنوعة لأداء تطبيقات IoT</b>، اتطوّر عدد من الـ <b>application-level IoT protocols</b>. الـ IoT application layer protocols تتضمن:</p>
${tb(['Abbreviation','Full name (as written)'],[['<b>DDS</b>','Data Distribution Service'],['<b>MQTT</b>','Message Queue Telemetry Transport'],['<b>CoAP</b>','Constrained Application Protocol'],['<b>AMQP</b>','Advanced Message Queuing Protocol'],['<b>XMPP</b>','eXtensible Messaging and Presence Protocol']])}
<p>الـ handout بيشرح <b>MQTT</b> و <b>CoAP</b> بالتفصيل فقط (وبيقارن بينهم).</p>`,
defs:[['Application-layer IoT protocols','DDS, MQTT, CoAP, AMQP, XMPP.']],
memo:['5 protocols: <b>DDS, MQTT, CoAP, AMQP, XMPP</b>. الاتنين المشروحين: <b>MQTT + CoAP</b>.'],
traps:['MQTT = Message Queue <b>Telemetry Transport</b> (زي المكتوب). CoAP = <b>Constrained</b> Application Protocol.','DDS مذكور في السلايد 12 بس مش موجود في رسمة السلايد 2.'],
flag:[],
q:['Expand the abbreviations DDS, MQTT, CoAP, AMQP and XMPP.','Data Distribution Service; Message Queue Telemetry Transport; Constrained Application Protocol; Advanced Message Queuing Protocol; eXtensible Messaging and Presence Protocol.']});

L('3-7','3.3.1 MQTT — Transport, Clients, Brokers and Publish/Subscribe','MQTT: الأساسيات والـ architecture',[[13,16]],{
simple:'MQTT شغال على TCP/IP بنظام publish/subscribe: الأجهزة (clients) مش بتتكلم مع بعض مباشرة، كلها بتتصل بـ broker (السيرفر) اللي بيستقبل ويوزع الرسائل.',
body:`<h3>Transport (slide 13)</h3>
${ul(['MQTT <b>غالباً بيشتغل فوق TCP/IP</b>.','ممكن كمان يشتغل فوق <b>أي network protocol</b> بيوفّر: <b>Lossless</b> + <b>Ordered</b> + <b>bi-directional connections</b>.','<b>Bi-directional هي الكلمة المفتاحية</b> وواحد من أهم عوامل تفضيل MQTT.','طبيعته ثنائية الاتجاه بتمنع الحاجة لـ <b>constant polling</b> للتحقق من رسائل جديدة.'])}
<h3>Clients and brokers (slides 14–15)</h3>
${ul(['فيه <b>نوعين من الأنظمة</b>: <b>clients</b> و <b>brokers</b>.','الـ <b>broker</b> هو <b>الـ server</b> اللي الـ clients بتتواصل معاه.','الـ broker <b>بيستقبل الاتصالات من الـ clients ويبعتها لـ clients تانية</b>.','الـ clients <b>مش بتتواصل مع بعض مباشرة</b>، بل بتتصل بالـ broker.','كل client ممكن يكون <b>publisher</b> أو <b>subscriber</b> أو <b>الاتنين</b>.'])}
<p>الرسمة (slide 14): ثلاث حساسات حرارة بتعمل <b>Publish: 20°C</b> للـ <b>MQTT-Broker</b>، وجهازين كمبيوتر بيعملوا <b>Subscribe</b> وبيستقبلوا <b>Publish: 20°C</b> من الـ broker.</p>
<h3>Message types (slide 16 — “MQTT Message Format”)</h3>
<p>الرسمة بتوضح الرسائل بين MQTT Client و MQTT Broker:</p>
${tb(['Client → Broker','Broker → Client'],[['<b>Connect</b>','<b>Connect ack</b>'],['<b>Subscribe</b>','<b>Subscribe ack</b>'],['<b>Publish</b>','<b>Publish ack</b>']])}
<p>جرّب الـ stepper في <a href="#/lab/mqttpubsub">Visual Lab → MQTT Pub/Sub</a>.</p>`,
defs:[['MQTT broker','The server that MQTT clients communicate with; it receives communications from clients and sends them on to other clients.'],['MQTT client','A publisher, a subscriber, or both; clients do not communicate directly with each other but connect to the broker.']],
steps:['الـ client يتصل بالـ broker (Connect → Connect ack).','الـ subscriber يعمل Subscribe (→ Subscribe ack).','الـ publisher يعمل Publish (→ Publish ack).','الـ broker يوزّع الرسالة على الـ subscribers.'],
scn:'3 حساسات حرارة (publishers) بتبعت 20°C للـ broker، وشاشتين (subscribers) مشتركين في الـ topic فبتستلم القيمة — من غير ما الحساس يعرف الشاشة أصلاً.',
memo:['<b>TCP/IP</b> (أو أي protocol <b>lossless, ordered, bi-directional</b>).','<b>Clients + Broker</b>؛ clients ماتكلموش بعض مباشرة.','Client = <b>publisher / subscriber / both</b>.','الرسائل: <b>Connect/ack, Subscribe/ack, Publish/ack</b>.'],
traps:['<b>Bi-directional</b> = المفتاح؛ بيمنع polling.','الـ clients ماتتصلش ببعض — دايماً عن طريق broker.','Client ممكن يكون publisher <b>وsubscriber</b> في نفس الوقت.'],
q:['Explain MQTT’s architecture and why bidirectional connections matter.','MQTT uses clients and a broker (server). Clients connect only to the broker, which receives messages and forwards them to other clients; each client may be a publisher, subscriber or both. It generally runs over TCP/IP (or any lossless, ordered, bi-directional protocol); bidirectionality avoids constant polling for new messages.']});

L('3-8','3.3.1 MQTT — Connection Lifecycle: CONNECT, CONNACK, Keep-Alive, PINGREQ, DISCONNECT','دورة حياة الـ connection',[[17,18]],{
simple:'الـ client يبعت CONNECT + keep-alive time، الـ broker يرد CONNACK فالاتصال يتأسس. بيفضل شغال لحد DISCONNECT أو لحد ما يعدّي 1.5 × keep-alive من غير أي رسايل. وPINGREQ بيحافظ على الاتصال حي.',
body:`<p>الرسمة (slide 17) بتوضح 3 مراحل بين MQTT Client و MQTT Broker:</p>
${tb(['Phase','Messages'],[['<b>Establish a connection</b>','CONNECT → · ← CONNACK'],['<b>Maintain the connection</b>','PINGREQ → · ← PINGRESP'],['<b>Terminate the connection</b>','DISCONNECT →']])}
<h3>الشرح (slide 18)</h3>
${ul(['الـ client اللي عايز يتصل بالـ broker <b>يبعت CONNECT message مع keep-alive time</b>.','لما الـ broker يبعت acknowledgment (<b>CONNACK</b>)، الاتصال بيتأسس.','الاتصال بيفضل established لحد حصول <b>واحد</b> من حدثين: ① الـ client يبعت <b>DISCONNECT</b> message. ② <b>مفيش أي تبادل رسائل</b> بين الـ client والـ broker لمدة <b>1.5 times the keep-alive period</b>.','لتجنب الحالة التانية ولإبقاء الاتصال نشط، الـ clients ممكن تبعت <b>empty PINGREQ message</b> على فترات منتظمة.'])}
<p>أما الـ <b>PINGRESP</b> فمذكور في الرسمة كرد على PINGREQ.</p>
<p>جرّب الـ stepper في <a href="#/lab/mqttlife">Visual Lab → MQTT Lifecycle</a>.</p>`,
defs:[['Keep-alive','A time sent in the CONNECT message; the connection stays established until a DISCONNECT or until no messages are exchanged for 1.5 times the keep-alive period.'],['PINGREQ','An empty message sent at regular intervals by a client to keep the connection active.']],
steps:['Client → CONNECT (+ keep-alive time).','Broker → CONNACK (الاتصال اتأسس).','Client → PINGREQ بشكل دوري (لو مفيش traffic).','Broker → PINGRESP.','Client → DISCONNECT (إنهاء).'],
memo:['<b>CONNECT + keep-alive → CONNACK → (PINGREQ/PINGRESP) → DISCONNECT</b>.','الاتصال ينتهي بـ <b>DISCONNECT</b> أو <b>1.5 × keep-alive</b> من غير رسائل.','PINGREQ = <b>empty</b>.'],
traps:['الـ timeout = <b>1.5 ×</b> keep-alive (مش 2× ولا 1×).','CONNACK بيجي من الـ <b>broker</b>، CONNECT من الـ <b>client</b>.'],
q:['Describe the lifecycle of an MQTT connection and when it ends.','The client sends CONNECT with a keep-alive time; the broker replies CONNACK and the connection is established. The client may send empty PINGREQ messages periodically (PINGRESP replies). The connection ends when the client sends DISCONNECT or when no messages are exchanged for 1.5 times the keep-alive period.']});

L('3-9','3.3.1 MQTT — Quality of Service: QoS 0 and QoS 1','QoS 0 و QoS 1',[[19,22]],{
simple:'QoS = اتفاق بين المرسل والمستقبل على ضمان التسليم. QoS 0: مرة واحدة بدون ضمان. QoS 1: مرة على الأقل مع PUBACK، وممكن الرسالة تتكرر.',
body:`<p>الـ <b>QoS</b> بيحدد <b>الاتفاق بين المرسل والمستقبل</b> بخصوص <b>ضمان تسليم الرسالة</b>. له <b>3 قيم</b>: ${ul(['<b>QoS 0 (At most once)</b>','<b>QoS 1 (At least once)</b>','<b>QoS 2 (Exactly once)</b>'])}</p>
<h3>QoS 0 — At most once (slide 20)</h3>
<p>بيتعمل مجهود لإرسال الرسالة <b>مرة واحدة</b>. لو المستقبل استلمها: تمام. لو لأ: <b>مفيش أي مجهود تاني لإعادة الإرسال</b>. <b>مفيش ضمان تسليم</b>.</p>
${tb(['#','الخطوة (من الرسمة)','أين'],[['1','<b>PUBLISH, QoS = 0, DUP 0 &lt;Msg Identifier&gt;</b>','Publisher → Broker'],['2','<b>Delete Message</b>','عند الـ Publisher'],['3','<b>Send</b>','Broker → Subscriber']])}
<h3>QoS 1 — At least once (slides 21–22)</h3>
${ul(['بيضمن إن الرسالة <b>هتتسلّم مرة واحدة على الأقل</b>.','المرسل <b>بيخزّن الرسالة</b> لحد ما يستلم <b>acknowledgment (PUBACK)</b> من المستقبل.','المرسل ممكن <b>يبعت الرسالة أكتر من مرة</b> لو الـ PUBACK اتأخر.','<b>أغلى من QoS 0</b> لأن فيه <b>على الأقل رسالتين</b> (الرسالة الفعلية + PUBACK).'])}
${tb(['#','الخطوة (من الرسمة)','أين'],[['1','<b>Store Message</b>','Publisher'],['2','<b>PUBLISH, QoS = 1, DUP 0 &lt;Msg Identifier&gt;</b>','Publisher → Broker'],['3','<b>Store Message</b>','Broker'],['4','<b>Send</b>','Broker → Subscriber'],['5','<b>Delete Message</b>','Broker'],['6','<b>PUBACK</b>','Broker → Publisher'],['7','<b>Delete Message</b>','Publisher']])}
<p>جرّب في <a href="#/lab/qos">Visual Lab → QoS</a>.</p>`,
defs:[['QoS (MQTT)','The agreement between sender and receiver regarding the delivery guarantee of a message; QoS 0 (at most once), QoS 1 (at least once), QoS 2 (exactly once).'],['QoS 0','The effort is made to transmit a message once; if the receiver does not get it, no further effort is made to resend it; no guarantee of delivery.'],['QoS 1','Guarantees the message will be delivered at least once; the sender stores the message until it gets a PUBACK and may send it multiple times if the PUBACK is delayed; at least 2 messages are exchanged.']],
steps:['QoS 0: PUBLISH → (publisher يمسح الرسالة) → broker يبعت للـ subscriber.','QoS 1: publisher يخزّن → PUBLISH → broker يخزّن ويبعت → يمسح → PUBACK → publisher يمسح.'],
scn:'QoS 0: قراءة حرارة كل ثانية — لو واحدة ضاعت مفيش مشكلة. QoS 1: أمر تشغيل pump — لازم يوصل، ولو وصل مرتين مش مشكلة كبيرة.',
memo:['QoS 0 = <b>at most once</b> (no ack) · QoS 1 = <b>at least once</b> (PUBACK) · QoS 2 = <b>exactly once</b>.','QoS 1: المرسل <b>يخزّن حتى PUBACK</b> وممكن <b>يكرّر</b> الإرسال.','QoS 1 = <b>≥ 2 messages</b>.'],
traps:['QoS 1 ممكن يسلّم الرسالة <b>أكتر من مرة (duplicates)</b>؛ QoS 2 هو اللي exactly once.','QoS 0 ما فيهوش ack ولا إعادة إرسال.','الـ DUP flag في الرسمتين = 0 (الرسالة جديدة).'],
q:['Compare MQTT QoS 0 and QoS 1.','QoS 0 (at most once): single transmission attempt, no acknowledgment, no resend, no delivery guarantee. QoS 1 (at least once): sender stores the message until PUBACK is received and may resend if the PUBACK is delayed, so the message may be delivered more than once; it needs at least two messages (message + PUBACK).']});

L('3-10','3.3.1 MQTT — QoS 2 (Exactly Once): PUBREC, PUBREL, PUBCOMP','QoS 2',[[23,24]],{
simple:'QoS 2 هو الأبطأ والأغلى: 4 رسائل على الأقل (PUBLISH, PUBREC, PUBREL, PUBCOMP) عشان الرسالة توصل مرة واحدة بالظبط من غير تكرار.',
body:`<p><b>QoS 2 (Exactly once)</b>: بيضمن تسليم الرسالة <b>مرة واحدة بالضبط</b>. هو <b>الأبطأ والأغلى</b> لأنه يتطلب <b>4 message exchanges على الأقل</b> (slide 23).</p>
<h3>الخطوات (slide 24)</h3>
${ol(['الرسالة بتتبعت للمستقبل. المستقبل بيرد بـ <b>PUBREC</b> acknowledgment. لو المرسل ما استلمش PUBREC ممكن <b>يعيد إرسال الرسالة مع duplicate (DUP) flag</b> عشان المستقبل يعرف إنها مش رسالة جديدة.','لما المرسل يستلم PUBREC بيقدر <b>يمسح الرسالة الأصلية</b> ويبعت <b>PUBREL (release)</b> للمستقبل.','لما المستقبل يستلم PUBREL، بيقدر <b>يبعت الرسائل لمشتركي الـ topic</b>، ويبعت <b>PUBCOMP (complete)</b> acknowledgment للمرسل.'])}
<h3>الرسمة (slide 23) خطوة بخطوة</h3>
${tb(['#','الخطوة','أين'],[['1','Store Message','Publisher'],['2','PUBLISH, QoS = 2, DUP 0 &lt;Msg Identifier&gt;','Publisher → Broker'],['3','Store Message','Broker'],['4','Send','Broker → Subscriber'],['5','PUBREC','Broker → Publisher'],['6','PUBREL','Publisher → Broker'],['7','Delete Message (publisher) · و Delete Message <i>or</i> Discard Message Identifier (broker)','Both'],['8','PUBCOMP','Broker → Publisher'],['9','Delete Message','Publisher']])}
<p>جرّب في <a href="#/lab/qos">Visual Lab → QoS 2</a>.</p>`,
defs:[['QoS 2','Guarantees the message is delivered exactly once; the slowest and most expensive level because it requires at least four message exchanges: PUBLISH, PUBREC, PUBREL, PUBCOMP.'],['PUBREC / PUBREL / PUBCOMP','PUBREC: receiver’s acknowledgment of the message; PUBREL: release message sent by the sender after receiving PUBREC; PUBCOMP: complete acknowledgment from the receiver after PUBREL.'],['DUP flag','A duplicate flag set when a message is resent so the receiver realizes it is not a new message.']],
steps:['PUBLISH (QoS 2) → broker.','broker → PUBREC.','publisher يمسح الأصل → PUBREL.','broker يوزّع للـ subscribers → PUBCOMP.','publisher يمسح الرسالة.'],
memo:['<b>PUBLISH → PUBREC → PUBREL → PUBCOMP</b> (4 رسائل).','Exactly once = <b>slowest + most expensive</b>.','<b>DUP flag</b> عند إعادة الإرسال.','PUBREL = <b>release</b> · PUBCOMP = <b>complete</b>.'],
traps:['QoS 2 = <b>4</b> exchanges على الأقل؛ QoS 1 = 2.','المرسل بيمسح الرسالة الأصلية <b>بعد PUBREC</b> مش بعد PUBCOMP.','PUBREL (release) بيتبعت من <b>المرسل</b> والـ PUBCOMP من <b>المستقبل</b>.'],
typo:['النص (slide 24) بيقول إن المستقبل بيبعت للـ subscribers <b>بعد PUBREL</b>، بينما رقم الخطوة “4. Send” في الرسمة (slide 23) ظاهر <b>قبل</b> PUBREC. محفوظين زي ما هما — لو اتسألت عن الترتيب، اتبع النص ونوّه على الرسمة.'],
q:['Explain the QoS 2 handshake and why it is the most expensive level.','Sender sends PUBLISH (DUP flag if resent); receiver replies PUBREC; the sender discards the original and sends PUBREL; the receiver then sends the message to subscribers and replies PUBCOMP. It needs at least four exchanges, making it the slowest and most expensive, but guarantees exactly-once delivery.']});

L('3-11','3.3.1 MQTT — Retained Messages and Why MQTT Suits IoT','Retained flag ولماذا MQTT مناسب لـ IoT',[[25,27]],{
simple:'الرسالة اللي ليها retained flag بيحتفظ بيها الـ broker ويبعتها لأي subscriber جديد على نفس الـ topic. ومسموح رسالة retained واحدة بس لكل topic.',
body:`<h3>Retained flag (slides 25–26)</h3>
${ul(['الـ <b>Retained flag</b> في الرسالة بيحدد إذا كان الـ broker <b>يحتفظ بالرسالة</b> للـ subscribers المستقبليين على الـ topic.','الرسائل اللي الـ retained flag = true <b>بتتخزّن عند الـ broker وبتتبعت لأي subscriber جديد</b> على الـ topic المقابل.','الـ brokers بتسمح <b>برسالة retained واحدة فقط لكل topic</b>.','لو بعتّ رسالة جديدة بـ retained flag لنفس الـ topic، <b>هتستبدل</b> أي رسالة retained قديمة.'])}
<p>الرسمة (slide 25): Publisher → Broker: <b>PUBLISH, RETAIN = 1, dataValue = 100</b>؛ الـ Broker يبعتها لـ <b>Subscriber X</b> (المشترك أصلاً)؛ بعدين <b>Subscriber Y</b> يعمل <b>SUBSCRIBE</b> → <b>SUBACK</b> → ويستلم <b>PUBLISH, RETAIN = 1, dataValue = 100</b> (الرسالة المحفوظة).</p>
<h3>ليه MQTT مناسب لـ IoT (slide 27)</h3>
${ul(['<b>الاتصال ثنائي الاتجاه</b> (bidirectional).','طبيعة <b>publish-subscribe</b>: بيدعم <b>one-to-one, many-to-one, one-to-many</b>، وممكن يتوسّع لـ <b>ملايين clients</b>.','<b>Reliability configuration (باستخدام QoS)</b> بتخلّي MQTT يتكيّف مع مجموعة واسعة من التطبيقات.'])}
<p>جرّب الـ retained flow في <a href="#/lab/retain">Visual Lab → Retained</a>.</p>`,
defs:[['MQTT retained message','A message with the retained flag set to true is kept by the broker and sent to any new subscriber of the corresponding topic; only one retained message per topic is allowed and a new retained message replaces the previous one.']],
steps:['Publisher يبعت PUBLISH مع RETAIN=1.','الـ broker يخزّن الرسالة ويبعتها للمشتركين الحاليين.','Subscriber جديد يعمل SUBSCRIBE.','الـ broker يرد SUBACK.','الـ broker يبعت الرسالة المحفوظة (RETAIN=1) للمشترك الجديد.'],
scn:'حساس بيبعت درجة حرارة كل ساعة مع retain — أي شاشة تتفتح في النص بتاخد آخر قراءة فوراً بدل ما تستنى الساعة الجاية.',
memo:['<b>One retained message per topic</b> · new retained <b>replaces</b> old.','Why MQTT: <b>bidirectional</b>, <b>pub-sub (1:1, N:1, 1:N, millions)</b>, <b>QoS reliability config</b>.'],
traps:['رسالة retained واحدة <b>لكل topic</b> فقط — مش كل الرسائل.','الـ retained message بتروح لـ <b>المشتركين الجدد</b> (الحاليين استلموها بالفعل).'],
q:['What is a retained message in MQTT and how many can a topic have?','A retained message has its retain flag set so the broker keeps it and delivers it to any new subscriber of that topic. A broker keeps only one retained message per topic; a new retained message replaces the previous one.']});

L('3-12','3.3.2 CoAP — Overview, Features and Layers','CoAP: الفكرة والـ layers',[[28,32]],{
simple:'CoAP = Constrained Application Protocol (RFC 7252): بروتوكول بسيط وخفيف للأجهزة والشبكات المحدودة (M2M)، شبه HTTP لكن مش HTTP مضغوط، وبيشتغل فوق UDP.',
body:`<h3>Overview (slide 28)</h3>
${ul(['CoAP بروتوكول IoT له ميزات مصممة خصيصاً لـ <b>constrained devices</b>.','CoAP = <b>Constrained Application Protocol</b> ومعرّف في <b>RFC 7252</b>.','بروتوكول <b>بسيط بـ low overhead</b> لأجهزة محدودة (زي <b>microcontrollers</b>) وشبكات محدودة.','بيُستخدم في <b>M2M data exchange</b>.','<b>شبيه جداً بـ HTTP</b> رغم وجود اختلافات مهمة.'])}
<h3>Main features (slide 29)</h3>
${ul(['<b>Web protocol</b> مستخدم في M2M بمتطلبات constrained.','<b>Asynchronous message exchange</b>.','<b>Low overhead</b> وبسيط جداً في الـ parsing.','دعم <b>URI</b> و <b>content-type</b>.','قدرات <b>Proxy و caching</b>.'])}
<h3>CoAP ≠ compressed HTTP (slide 30)</h3>
<p>CoAP <b>ما ينفعش يتعتبر HTTP مضغوط</b>، لأنه مصمم خصيصاً لـ IoT وبالتحديد لـ <b>M2M</b> فهو <b>optimized جداً</b> للمهمة دي.</p>
<h3>الـ Layers (slides 30–31)</h3>
<p>الرسمة: <b>Application</b> فوق، وتحتها <b>Request/Response</b> و<b>Messages</b> (الاتنين مع بعض = <b>CoAP</b>)، وتحتهم <b>UDP</b>.</p>
${stk(['Application','CoAP: Request/Response layer','CoAP: Messages layer','UDP'],'CoAP as a protocol layer — slide 30')}
${tb(['CoAP layer','المسؤولية'],[['<b>Messages</b>','بتتعامل مع <b>UDP</b> ومع <b>asynchronous messages</b>.'],['<b>Request/Response</b>','بتدير تفاعل <b>request/response</b> بناءً على رسائل request/response.']])}
<h3>Message types (slide 32)</h3>
<p>CoAP بيدعم <b>4 أنواع رسايل</b>: <b>Confirmable</b> و <b>Non-confirmable</b> و <b>Acknowledgment</b> و <b>Reset</b>.</p>`,
defs:[['CoAP','Constrained Application Protocol (RFC 7252): a simple low-overhead protocol designed for constrained devices (e.g., microcontrollers) and constrained networks, used in M2M data exchange; similar to HTTP but not a compressed HTTP.']],
memo:['<b>RFC 7252</b> · <b>UDP</b> · 2 layers: <b>Messages</b> + <b>Request/Response</b>.','Features: <b>web protocol for M2M, asynchronous, low overhead/simple parsing, URI + content-type, proxy + caching</b>.','4 message types: <b>Confirmable, Non-confirmable, Acknowledgment, Reset</b>.'],
traps:['CoAP <b>ليس</b> “compressed HTTP” — مصمم لـ M2M.','طبقة <b>Messages</b> هي اللي بتتعامل مع UDP؛ <b>Request/Response</b> هي اللي بتدير التفاعل.'],
typo:['العنوان في slides 29–43 مكتوب “COAP Protocol” وفي 28 “CoAP Protocol” — نفس البروتوكول.'],
q:['Describe CoAP’s purpose, features, and layers.','CoAP (RFC 7252) is a simple low-overhead protocol for constrained devices and networks used in M2M; similar to HTTP but optimized for M2M, not compressed HTTP. Features: asynchronous exchange, low overhead/simple parsing, URI and content-type support, proxy and caching. Layers: Messages (UDP, asynchronous messages) and Request/Response; four message types: Confirmable, Non-confirmable, Acknowledgment, Reset.']});

L('3-13','3.3.2 CoAP — Message Types: Confirmable (CON), ACK, Reset (RST), Non-confirmable (NON)','CoAP: أنواع الرسايل',[[33,37]],{
simple:'CON = رسالة موثوقة بتتكرر لحد ما ييجي ACK بنفس الـ ID. RST = السيرفر مش قادر يتعامل مع الطلب. NON = رسالة غير موثوقة من غير ACK (زي قراءات sensors).',
body:`<h3>Confirmable (CON) — الموثوقة (slides 33–34)</h3>
${ul(['الـ <b>confirmable message</b> هي <b>reliable message</b>.','في CoAP بنحصل على رسالة موثوقة باستخدام <b>CON</b>. الـ client بيبقى <b>متأكد إن الرسالة هتوصل للـ server</b>.','الـ CON <b>بتتبعت مرة بعد مرة (again and again)</b> لحد ما الطرف التاني يبعت <b>acknowledge message (ACK)</b>.','الـ <b>ACK</b> بيحتوي <b>نفس الـ ID</b> بتاع الـ CON.'])}
<p>الرسمة: Client → Server: <b>CON (ID: 0xAA51)</b>؛ Server → Client: <b>ACK (ID: 0xAA51)</b>.</p>
<h3>Reset (RST) (slide 35)</h3>
<p>لو الـ <b>server عنده مشكلة في التعامل مع الطلب الوارد</b> بيقدر يرجّع <b>RST</b> بدل الـ <b>ACK</b>. الرسمة: <b>CON (ID: 0xAA51)</b> ← <b>RST</b>.</p>
<h3>Non-confirmable (NON) (slides 36–37)</h3>
